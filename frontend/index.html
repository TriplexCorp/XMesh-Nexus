<body>
<div class="app">
<aside data-ui-surface="panel">
  <div class="brand"><div class="logo" id="lg">X</div><b class="bt" id="bn">XMesh Nexus</b></div>
  <nav id="nav" aria-label="Разделы"></nav>
  <div class="core"><div class="ct"><span class="dot" id="cd" style="--c:var(--mu);animation:none"></span><div><b>Xray-core</b><small id="cs">API не подключён</small></div></div><button id="restart" aria-label="Настройки Xray-core"></button><small id="core-rail-version" class="core-rail-version" aria-live="polite">—</small></div>
  <div class="sidebar-account"><button class="sidebar-logout" id="logout" type="button" title="Выйти из панели">Выйти</button></div>
</aside>
<div class="wrap">
  <header class="top">
    <div class="top-identity"><h1 id="title"></h1></div>
    <button class="search" id="pal" type="button" aria-label="Поиск и команды" aria-keyshortcuts="Control+K Meta+K"><span id="si" class="search-glyph"></span><span class="search-label">Поиск и команды</span><kbd>Ctrl K</kbd></button>
    <div class="tl"><div class="top-panel-version" id="top-panel-version" hidden>
      <button class="top-panel-version-trigger" type="button" data-panel-version-trigger aria-label="Версия панели" aria-haspopup="dialog" aria-expanded="false" aria-controls="top-panel-version-menu">
        <span class="top-panel-version-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8 4.5v11L12 22l-8-4.5v-11L12 2Z"/><path d="m12 12 8-5.5M12 12 4 6.5M12 12v10"/></svg></span>
        <span class="top-panel-version-label" data-panel-version-number>Nexus</span>
      </button>
      <section class="top-panel-version-menu" id="top-panel-version-menu" data-panel-version-menu role="dialog" aria-label="Версия панели" hidden>
        <header class="top-panel-version-head">
          <div class="top-panel-version-identity">
            <strong data-panel-version-heading>Версия панели</strong>
            <div class="top-panel-version-build"><b data-panel-version-installed>Nexus</b><small data-panel-version-revision>—</small></div>
          </div>
          <button class="top-panel-version-close" type="button" data-panel-version-close aria-label="Закрыть" title="Закрыть">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>
          </button>
        </header>
        <div class="top-panel-version-feedback">
          <span class="top-panel-version-state-dot" aria-hidden="true"></span>
          <p class="top-panel-version-message" data-panel-version-status role="status" aria-live="polite"></p>
        </div>
        <div class="top-panel-version-actions">
          <button type="button" data-panel-version-update hidden>Обновить панель</button>
          <button type="button" data-panel-version-reload hidden>Перезагрузить страницу</button>
        </div>
        <p class="top-panel-version-update-status" data-panel-version-update-status role="status" aria-live="polite"></p>
        <footer class="top-panel-version-footer">
          <p class="top-panel-version-caption" data-panel-version-caption></p>
        </footer>
      </section>
    </div><button class="ib" id="theme" aria-label="Сменить тему"></button><button class="ib" id="bell" type="button" aria-label="Уведомления" aria-haspopup="dialog" aria-expanded="false"></button><div class="top-language" id="top-language">
      <button class="ib top-language-trigger" id="language-trigger" type="button" aria-label="Язык интерфейса" aria-haspopup="true" aria-expanded="false" aria-controls="language-menu"></button>
      <div class="top-language-menu" id="language-menu" role="group" aria-label="Выбор языка" hidden>
        <button type="button" data-panel-language="ru" aria-pressed="false">Русский <span>RU</span></button>
        <button type="button" data-panel-language="en" aria-pressed="false">English <span>EN</span></button>
      </div></div><button class="btn" type="button" data-nu id="addb" aria-label="Добавить пользователя"></button></div>
  </header>
  <main id="view" class="view"></main>
</div>
</div>

<dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>
