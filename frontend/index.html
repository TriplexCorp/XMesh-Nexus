<div class="app">
<aside data-ui-surface="panel">
  <div class="brand"><div class="logo" id="lg">X</div><b class="bt" id="bn">XMesh Nexus</b></div>
  <nav id="nav" aria-label="Разделы"></nav>
  <div class="core"><div class="ct"><span class="dot" id="cd" style="--c:var(--mu);animation:none"></span><div><b>Xray-core</b><small id="cs">API не подключён</small></div></div><button id="restart" aria-label="Настройки Xray-core"></button><small id="core-rail-version" class="core-rail-version" aria-live="polite">—</small></div>
  <div class="sidebar-account"><button class="sidebar-logout" id="logout" type="button" title="Выйти из панели">Выйти</button></div>
</aside>
<div class="wrap">
  <header class="top">
    <div class="top-identity"><h1 id="title"></h1></div>
    <button class="search" id="pal" type="button" aria-label="Поиск и команды"><span id="si" class="search-glyph"></span><span class="search-label">Поиск и команды</span><kbd>Ctrl K</kbd></button>

      <div class="top-language-menu" id="language-menu" role="group" aria-label="Выбор языка" hidden>
        <button type="button" data-panel-language="ru" aria-pressed="false">Русский <span>RU</span></button>
        <button type="button" data-panel-language="en" aria-pressed="false">English <span>EN</span></button>
      </div></div><button class="btn" type="button" data-nu id="addb" aria-label="Добавить пользователя"></button></div>
  </header>
  <main id="view" class="view"></main>
</div>
