<!doctype html>
<html lang="ru" data-theme="dark" data-accent="emerald" data-surface="solid" data-density="comfortable" data-font="onest" data-borders="soft" data-glow="normal" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0e14">
<title>Вход — XMesh Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400..800&family=Golos+Text:wght@400..800&family=Rubik:wght@400..800&family=Nunito+Sans:wght@400..800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Roboto:wght@400..800&family=PT+Sans:wght@400;700&family=Montserrat:wght@400..800&family=Ubuntu:wght@400;500;700&family=Open+Sans:wght@400..800&family=Source+Sans+3:wght@400..800&family=Fira+Sans:wght@400;500;600;700&family=Jost:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/auth/login.css?v=dfbc0f42de4e">
<script src="/js/core/i18n.js?v=25dd92d07557" defer></script>
<script src="/js/auth/login.js?v=af0aec0a43d9" defer></script>
</head>
<body>
<main class="login-shell">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true">X</div>
    <p class="eyebrow">XMESH NEXUS <span>·</span> ADMIN ACCESS</p>
    <h1 id="login-title">Вход в панель</h1>
    <p class="intro">Авторизуйтесь, чтобы получить доступ к инфраструктуре.</p>
    <form id="login-form" autocomplete="on">
      <div id="password-step">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" maxlength="128" required autocapitalize="none" spellcheck="false">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      </div>
      <div id="mfa-step" hidden>
        <label for="mfa-code">Код подтверждения</label>
        <input id="mfa-code" name="mfa_code" inputmode="text" autocomplete="one-time-code"
          autocapitalize="off" spellcheck="false" placeholder="123456 или резервный код" maxlength="40">
        <p class="mfa-hint">Откройте приложение-аутентификатор. Если телефон недоступен, используйте один из сохранённых резервных кодов.</p>
      </div>
      <p id="login-error" class="error" role="alert" aria-live="polite"></p>
      <button id="submit" type="submit">Войти <span aria-hidden="true">↗</span></button>
      <button id="mfa-back" type="button" hidden>Другой аккаунт</button>
    </form>
    <p class="security-note"><span class="status-dot"></span> Защищённая сессия · XMesh Nexus</p>
  </section>
  <p class="footer">PRIVATE INFRASTRUCTURE <span>—</span> AUTHORIZED ACCESS ONLY</p>
</main>
</body>
</html>
