# XSP-v2 dedicated Node ingress — P0-C2-B/D2 narrow staging routes.
# C2-A identity proof remains available as a diagnostic-only endpoint.
# The only application operations mounted here are the exact state-changing ACK
# POST and the exact read-only historical receipt-recovery POST below.
worker_processes 1;
pid /tmp/xmesh-xsp-v2-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8444 ssl;
        server_name node-ingress.xsp.invalid;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768;
        ssl_session_tickets off;
        ssl_session_cache off;
        ssl_early_data off;

        ssl_certificate /run/xmesh-ingress-certs/fullchain.pem;
        ssl_certificate_key /run/xmesh-ingress-certs/privkey.pem;
        ssl_client_certificate /run/xmesh-ingress-certs/client-ca.pem;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        client_max_body_size 16k;
        client_body_timeout 5s;
        send_timeout 5s;

        location = /__xsp_v2_identity_probe {
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host xsp-v2-origin;
            proxy_set_header X-XSP-V2-Client-Verify $ssl_client_verify;
            proxy_set_header X-XSP-V2-Client-Cert $ssl_client_escaped_cert;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_pass http://unix:/run/xmesh-origin/xsp-v2-origin.sock:/identity-probe;
        }

        location = /api/v2/node/keys/rotation/ack {
            if ($request_method != POST) {
                return 405;
            }
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }
            if ($http_content_type != "application/json") {
                return 415;
            }
            if ($http_transfer_encoding != "") {
                return 400;
            }
            if ($http_content_length = "") {
                return 411;
            }

            # Strip every caller header. Only the request body plus Nginx-generated
            # evidence from this verified TLS session crosses the protected UDS.
            proxy_pass_request_headers off;
            proxy_request_buffering on;
            proxy_set_header Host xsp-v2-origin;
            proxy_set_header X-XSP-V2-Client-Verify $ssl_client_verify;
            proxy_set_header X-XSP-V2-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header Content-Type application/json;
            proxy_set_header Content-Length $content_length;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_pass http://unix:/run/xmesh-origin/xsp-v2-origin.sock:/api/v2/node/keys/rotation/ack;
        }

        location = /api/v2/node/keys/rotation/ack/recover {
            if ($request_method != POST) {
                return 405;
            }
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }
            if ($http_content_type != "application/json") {
                return 415;
            }
            if ($http_transfer_encoding != "") {
                return 400;
            }
            if ($http_content_length = "") {
                return 411;
            }

            # Historical recovery is a distinct read-only application operation.
            # It receives the exact original signed ACK bytes and the same
            # ingress-generated verified-client identity evidence. No caller
            # recovery header is trusted or forwarded.
            proxy_pass_request_headers off;
            proxy_request_buffering on;
            proxy_set_header Host xsp-v2-origin;
            proxy_set_header X-XSP-V2-Client-Verify $ssl_client_verify;
            proxy_set_header X-XSP-V2-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header Content-Type application/json;
            proxy_set_header Content-Length $content_length;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_pass http://unix:/run/xmesh-origin/xsp-v2-origin.sock:/api/v2/node/keys/rotation/ack/recover;
        }

        location / {
            return 404;
        }
    }
}
