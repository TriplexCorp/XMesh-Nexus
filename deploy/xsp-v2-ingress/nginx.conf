# XSP-v2 dedicated Node ingress — P0-C2-A identity/origin boundary proof.
# The only forwarded path is a test-only identity probe over a Unix socket.
# ACK and legacy application routes remain inert 404 and are not mounted.
worker_processes 1;
pid /tmp/xmesh-xsp-v2-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8444 ssl;
        server_name node-ingress.xsp.invalid;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768;
        ssl_session_tickets off;
        ssl_session_cache off;
        ssl_early_data off;

        ssl_certificate /run/xmesh-ingress-certs/fullchain.pem;
        ssl_certificate_key /run/xmesh-ingress-certs/privkey.pem;

        # Request a client certificate for C2-A identity proof while preserving
        # the C1 server-authenticated diagnostic handshake on all inert paths.
        # The exact identity is pinned again by SPKI at the UDS origin.
        ssl_client_certificate /run/xmesh-ingress-certs/client-ca.pem;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        client_max_body_size 16k;

        location = /__xsp_v2_identity_probe {
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            # Do not forward any caller-controlled headers/body. The origin
            # receives only Nginx-generated evidence from this verified TLS
            # connection, over a local Unix-domain socket.
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host xsp-v2-origin;
            proxy_set_header X-XSP-V2-Client-Verify $ssl_client_verify;
            proxy_set_header X-XSP-V2-Client-Cert $ssl_client_escaped_cert;
            proxy_http_version 1.1;
            proxy_pass http://unix:/run/xmesh-origin/xsp-v2-origin.sock:/identity-probe;
        }

        location / {
            return 404;
        }
    }
}
