worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;

    # The product ingress runs as uid/gid 10003 with a read-only root filesystem.
    # Debian Nginx otherwise resolves its compiled temp paths outside our writable
    # tmpfs and exits after startup with EACCES. Keep every HTTP temp path inside
    # the dedicated /tmp tmpfs, matching the already-proven staging ingress.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8444 ssl;
        server_name node-ingress.xsp.invalid;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768;
        ssl_certificate /run/xmesh-ingress-certs/fullchain.pem;
        ssl_certificate_key /run/xmesh-ingress-certs/privkey.pem;
        ssl_client_certificate /run/xmesh-ingress-certs/client-ca.pem;
        ssl_verify_client on;
        ssl_verify_depth 1;
        ssl_session_tickets off;
        ssl_session_cache off;

        location = /api/v2/product/activate {
            limit_except POST { deny all; }
            proxy_set_header Content-Type application/json;
            proxy_set_header X-XSP-V2-Client-Verify $ssl_client_verify;
            proxy_set_header X-XSP-V2-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://xsp-v2-product-gateway:8081/activate;
            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
            proxy_buffering off;
        }

        location = /api/v2/product/tunnel {
            limit_except POST { deny all; }
            proxy_set_header Content-Type application/json;
            proxy_set_header X-XSP-V2-Client-Verify $ssl_client_verify;
            proxy_set_header X-XSP-V2-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://xsp-v2-product-gateway:8081/tunnel;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        location / { return 404; }
    }
}
