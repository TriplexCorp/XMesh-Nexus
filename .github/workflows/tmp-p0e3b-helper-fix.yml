name: Temporary P0-E3b helper fix

on:
  push:
    branches: [feat/xsp-v2-p0e3b-coordinated-backup-restore]
    paths:
      - ".github/workflows/tmp-p0e3b-helper-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xsp-v2-p0e3b-coordinated-backup-restore
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Patch exact init argument guard and format
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/xsp-v2-p0e3b-agent-helper.go')
          s = p.read_text()
          old = 'if len(args) != 3 || args[0] != "--root" || args[2] == "" {'
          new = 'if len(args) != 2 || args[0] != "--root" || args[1] == "" {'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          gofmt -w scripts/xsp-v2-p0e3b-agent-helper.go
          git diff --check
          git diff --exit-code -- .github/workflows/tmp-p0e3b-helper-fix.yml
      - name: Commit helper fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/xsp-v2-p0e3b-agent-helper.go
          git commit -m 'fix(xsp-v2): correct E3b Agent helper init guard'
          git push origin HEAD:feat/xsp-v2-p0e3b-coordinated-backup-restore
