name: One-shot rustfmt repair
on:
  push:
    branches:
      - fix/backend-ci-finalmask-and-format-20261026
    paths:
      - .github/workflows/format-repair-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format the Rust sources (without disabling CI checks)
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --all
          git add -u backend/src
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Apply rustfmt to backend source files"
            git push origin HEAD:refs/heads/fix/backend-ci-finalmask-and-format-20261026
          fi
