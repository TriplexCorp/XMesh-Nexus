name: Temporary P0-E3b final PostgreSQL readiness fix

on:
  push:
    branches: [feat/xsp-v2-p0e3b-coordinated-backup-restore]
    paths: [".github/workflows/tmp-p0e3b-final-readiness-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xsp-v2-p0e3b-coordinated-backup-restore
      - name: Wait for final post-tune PostgreSQL server
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py"); s=p.read_text(); old="            for _ in range(160):\n                probe = command(\n                    \"docker\", \"exec\", db, \"pg_isready\", \"-U\", \"postgres\", \"-d\", \"xmesh\",\n                    check=False, timeout=10,\n                )\n                if probe.returncode == 0:\n                    return\n                time.sleep(0.25)\n            logs = command(\"docker\", \"logs\", \"--tail\", \"120\", db, check=False)\n            raise RuntimeError(f\"PostgreSQL did not become ready: {(logs.stdout + logs.stderr)[-3000:]}\")"; new="            for _ in range(240):\n                logs = command(\"docker\", \"logs\", \"--tail\", \"220\", db, check=False)\n                combined = (logs.stdout or \"\") + (logs.stderr or \"\")\n                probe = command(\n                    \"docker\", \"exec\", db, \"pg_isready\", \"-U\", \"postgres\", \"-d\", \"xmesh\",\n                    check=False, timeout=10,\n                )\n                # TimescaleDB init starts a temporary server, runs/tunes extensions,\n                # shuts it down, then starts the final server. Do not accept the\n                # temporary readiness window: require the second ready transition.\n                if combined.count(\"database system is ready to accept connections\") >= 2 and probe.returncode == 0:\n                    time.sleep(0.25)\n                    stable = command(\n                        \"docker\", \"exec\", db, \"pg_isready\", \"-U\", \"postgres\", \"-d\", \"xmesh\",\n                        check=False, timeout=10,\n                    )\n                    if stable.returncode == 0:\n                        return\n                time.sleep(0.25)\n            logs = command(\"docker\", \"logs\", \"--tail\", \"220\", db, check=False)\n            raise RuntimeError(f\"final PostgreSQL server did not become ready: {(logs.stdout + logs.stderr)[-5000:]}\")"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          python3 -m py_compile scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py
          git diff --check
      - name: Commit final readiness fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py
          git commit -m 'fix(xsp-v2): wait for final TimescaleDB startup in E3b'
          git push origin HEAD:feat/xsp-v2-p0e3b-coordinated-backup-restore
