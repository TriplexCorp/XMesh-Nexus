name: Temporary Agent v6.0.7 fresh-updater codemod
on:
  push:
    branches:
      - fix/agent-v6.0.7-fresh-updater-20261102
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-v6.0.7-fresh-updater-20261102
      - name: Apply production updater fix
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]; then exit 0; fi
          python3 scripts/tmp_agent_v607_anchor_fix.py
          python3 scripts/tmp_agent_v607_codemod.py
          bash -n deploy/node-control-agent.sh deploy/update-node-control-agent.sh deploy/install-node-metrics-agent.sh
          node scripts/check-agent-update.js
          git diff --check
      - name: Commit codemod
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'xmesh-ci-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add AGENT_VERSION backend/src/node_runtime.rs deploy/install-node-metrics-agent.sh deploy/node-control-agent.sh deploy/update-node-control-agent.sh deploy/xsp-v2-product-gateway/main.go docs/AGENT_RELEASE_POLICY.md scripts/check-agent-update-base.js scripts/check-agent-update.js
          git commit -m 'fix(agent): make signed updates use fresh target-bound updater'
          git push origin HEAD:fix/agent-v6.0.7-fresh-updater-20261102
