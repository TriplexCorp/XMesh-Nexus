name: XSP-v2 Hybrid TLS Probe (test-only)
on:
  push:
    branches: [main]
    paths:
      - "scripts/check-xsp-hybrid-tls.py"
      - "scripts/check-xsp-nginx-isolated.py"
      - "scripts/check-xsp-v2-ingress-runtime.js"
      - "scripts/check-xsp-v2-c2b-ack-runtime.js"
      - "scripts/test-xsp-v2-ingress-process.py"
      - "scripts/test-xsp-v2-c2b-ack-process.py"
      - "scripts/generate-xsp-v2-mldsa-test-certs.go"
      - "deploy/xsp-v2-node-ingress.nginx.conf.example"
      - "deploy/xsp-v2-ingress/**"
      - ".github/workflows/xsp-hybrid-tls.yml"
      - "docs/XSP_V2_TLS_PROBE.md"
  pull_request:
    paths:
      - "scripts/check-xsp-hybrid-tls.py"
      - "scripts/check-xsp-nginx-isolated.py"
      - "scripts/check-xsp-v2-ingress-runtime.js"
      - "scripts/check-xsp-v2-c2b-ack-runtime.js"
      - "scripts/test-xsp-v2-ingress-process.py"
      - "scripts/test-xsp-v2-c2b-ack-process.py"
      - "scripts/generate-xsp-v2-mldsa-test-certs.go"
      - "deploy/xsp-v2-node-ingress.nginx.conf.example"
      - "deploy/xsp-v2-ingress/**"
      - ".github/workflows/xsp-hybrid-tls.yml"
      - "docs/XSP_V2_TLS_PROBE.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tls-hybrid:
    runs-on: ubuntu-latest
    container: rust:1.99-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Checkout XMesh-Node test-only Go TLS probe
        uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Node
          path: xmesh-node
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install OpenSSL 3.5+ and Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openssl nginx ca-certificates python3
          openssl version
      - name: Format, compile and unit-test Rust C2-A origin probe
        run: |
          rustup component add rustfmt
          rustfmt --edition 2024 --check deploy/xsp-v2-ingress/origin_probe.rs
          rustc --edition=2024 --test deploy/xsp-v2-ingress/origin_probe.rs -o "$RUNNER_TEMP/xsp-origin-probe-tests"
          "$RUNNER_TEMP/xsp-origin-probe-tests"
      - name: Build isolated Go TLS probe
        run: |
          cd xmesh-node/security/xspv2/poc-go
          go build -o "$RUNNER_TEMP/xsp-tlsprobe" ./cmd/tlsprobe
      - name: Validate loopback-only Nginx staging template with actual TLS handshake
        run: python3 scripts/check-xsp-nginx-isolated.py
      - name: Verify actual group, trust chain, hostname, and reject classical downgrade
        run: |
          XSP_GO_TLS_PROBE="$RUNNER_TEMP/xsp-tlsprobe" python3 scripts/check-xsp-hybrid-tls.py

  ingress-process-e2e:
    name: PQ client identity and Unix origin boundary E2E
    needs: tls-hybrid
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout XMesh-Node strict Go TLS probe
        uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Node
          path: xmesh-node
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Enforce C2-A source/runtime isolation contract
        run: node scripts/check-xsp-v2-ingress-runtime.js
      - name: Build strict Node TLS/mTLS probe
        run: |
          cd xmesh-node/security/xspv2/poc-go
          go build -o "$RUNNER_TEMP/xsp-tlsprobe" ./cmd/tlsprobe
      - name: Exercise hybrid mTLS identity and protected Unix origin hop
        run: |
          python3 scripts/test-xsp-v2-ingress-process.py --go-probe "$RUNNER_TEMP/xsp-tlsprobe"

  c2b-ack-e2e:
    name: C2-B narrow staging ACK route E2E
    needs: ingress-process-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Enforce C2-B exact-route and production-isolation contract
        run: node scripts/check-xsp-v2-c2b-ack-runtime.js
      - name: Exercise exact ACK gate behind the proven mTLS to Unix boundary
        run: python3 scripts/test-xsp-v2-c2b-ack-process.py
