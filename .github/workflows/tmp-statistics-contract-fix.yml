name: Temporary statistics contract migration

on:
  push:
    branches:
      - integration/argon-frontend-recovery-20261102
    paths:
      - '.github/workflows/tmp-statistics-contract-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/argon-frontend-recovery-20261102
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Repair Statistics animations and shared contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('frontend/styles/features/statistics/statistics.css')
          s=p.read_text()

          refresh='''#stats-user-refresh.is-refreshing .stats-refresh-icon {\n  animation:stats-user-refresh-spin .8s linear infinite;\n}\n'''
          if '@keyframes stats-user-refresh-spin' not in s:
              if refresh not in s:
                  raise SystemExit('refresh animation marker not found')
              s=s.replace(refresh, refresh + '''@keyframes stats-user-refresh-spin {\n  to {\n    transform:rotate(360deg);\n  }\n}\n''', 1)

          live='''  animation:stats-live-pulse 2s ease-out infinite;\n}\n'''
          if '@keyframes stats-live-pulse' not in s:
              if live not in s:
                  raise SystemExit('live pulse marker not found')
              s=s.replace(live, live + '''@keyframes stats-live-pulse {\n  0% {\n    box-shadow:0 0 0 0 currentColor;\n    opacity:1;\n  }\n  70% {\n    box-shadow:0 0 0 .45rem transparent;\n    opacity:.85;\n  }\n  100% {\n    box-shadow:0 0 0 0 transparent;\n    opacity:1;\n  }\n}\n''', 1)

          s=s.replace('''@media (prefers-reduced-motion:reduce) {\n#stats-user-refresh.is-refreshing .stats-refresh-icon {\n  animation-duration:2s;\n}\n}\n''', '''@media (prefers-reduced-motion:reduce) {\n#stats-user-refresh.is-refreshing .stats-refresh-icon {\n  animation:none;\n}\n}\n''', 1)
          p.write_text(s)

          t=Path('scripts/check-statistics-feedback.js')
          c=t.read_text()
          period_old="matches(css,/body > \\.xm-period-portal\\s*\\{[\\s\\S]*?position:fixed[\\s\\S]*?z-index:200000/);"
          period_new="matches(css,/\\.xm-period-portal\\s*\\{[\\s\\S]*?position:fixed[\\s\\S]*?z-index:var\\(--nx-z-tooltip\\)/,'Detached period menu must use the shared popover stacking token');"
          if period_old not in c and period_new not in c:
              raise SystemExit('period portal assertion marker not found')
          c=c.replace(period_old,period_new,1)

          size_old="matches(css,/--scrollbar-size:9px/);"
          size_new="rejects(css,/--scrollbar-size:9px/,'Statistics must not pin a legacy global scrollbar size token');"
          if size_old not in c and size_new not in c:
              raise SystemExit('scrollbar size assertion marker not found')
          c=c.replace(size_old,size_new,1)
          t.write_text(c)
          PY
      - name: Validate Statistics contract
        run: |
          node scripts/check-statistics-feedback.js
          git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet -- frontend/styles/features/statistics/statistics.css scripts/check-statistics-feedback.js; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'Xmesh Creator'
          git config user.email 'Aselis3d@gmail.com'
          git add frontend/styles/features/statistics/statistics.css scripts/check-statistics-feedback.js
          git commit -m 'fix(frontend): complete Statistics native-dialog contract repair'
          git push origin HEAD:integration/argon-frontend-recovery-20261102
