name: Temporary Frontend Architecture Gate

on:
  push:
    branches:
      - tmp/frontend-recovery-runner-20261102

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/argon-frontend-recovery-20261102
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run canonical UI architecture gate
        run: node scripts/check-ui-system.js
      - name: Check cache graph and syntax
        run: |
          node scripts/update-ui-cache.cjs --check
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
