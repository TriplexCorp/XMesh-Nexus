name: Temporary Frontend Recovery Diagnostics

on:
  push:
    branches:
      - tmp/frontend-recovery-runner-20261102

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/argon-frontend-recovery-20261102
      - name: Inspect remaining runtime conflicts
        shell: bash
        run: |
          echo '=== legacy positional important ==='
          grep -n -B 8 -A 14 'top:50%!important' frontend/styles/legacy/styles.css || true
          echo '=== node single-page contract ==='
          grep -n -B 8 -A 16 'node-explorer-pages\|data-single-page\|dataset.singlePage' frontend/js/core/app.js frontend/styles/features/nodes/nodes.css frontend/styles/legacy/styles.css || true
          echo '=== workspace ownership refs ==='
          grep -RIn 'nexus-v3-workspaces' frontend scripts .github || true
          echo '=== public portal entry refs ==='
          grep -RIn 'subscription-public.css' frontend scripts backend .github || true
