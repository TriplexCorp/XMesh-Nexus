name: Temporary Rust ingress docs checkpoint

on:
  push:
    branches:
      - docs/xsp-rust-ingress-checkpoint

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/xsp-rust-ingress-checkpoint
          fetch-depth: 0

      - name: Patch authoritative docs
        run: python3 scripts/tmp_sync_rust_ingress_docs.py

      - name: Verify, self-clean and push
        run: |
          git diff --check
          rm .github/workflows/tmp-docs-rust-ingress-checkpoint.yml
          rm scripts/tmp_sync_rust_ingress_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md docs/ENTERPRISE_ROADMAP.md .github/workflows/tmp-docs-rust-ingress-checkpoint.yml scripts/tmp_sync_rust_ingress_docs.py
          git diff --cached --check
          git commit -m "docs(xsp-v2): checkpoint Rust ingress hardening"
          git push origin HEAD:docs/xsp-rust-ingress-checkpoint
