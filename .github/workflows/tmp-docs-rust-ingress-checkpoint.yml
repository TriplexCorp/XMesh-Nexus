name: Temporary Rust ingress docs checkpoint

on:
  push:
    branches: [docs/xsp-rust-ingress-checkpoint]
    paths:
      - ".github/workflows/tmp-docs-rust-ingress-checkpoint.yml"

permissions:
  contents: write

jobs:
  patch-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/xsp-rust-ingress-checkpoint
          fetch-depth: 0

      - name: Synchronize authoritative README and Roadmap checkpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          readmes = ["README.md", "README.en.md"]

          top_review = """**Latest verified Nexus P0-E review-preparation checkpoint:** [`7b84a9e45f9e9cf815b95a06d1560f84d8d3f0a2`](https://github.com/TriplexCorp/XMesh-Nexus/commit/7b84a9e45f9e9cf815b95a06d1560f84d8d3f0a2), merge of [PR #135](https://github.com/TriplexCorp/XMesh-Nexus/pull/135). Node PR #51 plus Nexus PRs #133–#134 close bounded default-off redacted observability, and PR #135 freezes the exact Node/Nexus evidence package for independent security review. **The independent security review itself is still OPEN, and P0-E4a remains CURRENT/OPEN until five representative physical abrupt-power runs are actually executed and independently reviewed.**"""

          hardening_checkpoint = """**Latest verified staging ingress hardening checkpoint:** [`03679120726ff06005eff903909b262fb1271960`](https://github.com/TriplexCorp/XMesh-Nexus/commit/03679120726ff06005eff903909b262fb1271960), merge of [PR #140](https://github.com/TriplexCorp/XMesh-Nexus/pull/140), on top of [PR #139](https://github.com/TriplexCorp/XMesh-Nexus/pull/139) merge [`36ee6f7a5b1686f9c0d51beda5d24e84830982c7`](https://github.com/TriplexCorp/XMesh-Nexus/commit/36ee6f7a5b1686f9c0d51beda5d24e84830982c7). PR #139 replaces the C2-A Python origin probe with a dependency-free Rust implementation; PR #140 replaces the C2-B/C/D Python ACK/recovery origin state machine with an isolated Rust 2024 crate while preserving the reviewed UDS peer-credential/SPKI identity boundary, strict ACK/freshness/recovery semantics, exact C2-C framing, response-loss fault domains, thread-per-connection behavior and Unix listen backlog of 32. Exact-head PR #140 Backend CI, Hybrid TLS, C2-C authorization, expired recovery, lost-response/race, transport-negative/no-legacy and PostgreSQL rollback workflows all completed **success**. **This is implementation hardening only, not production activation or independent review sign-off.**"""

          freeze_notice = """PRs #139 and #140 are security-relevant staging-runtime changes made after PR #135 froze Nexus target `5cdb7825fcc51f8a7d296b992a7da4492ed2ce8e`. The PR #135 package therefore remains a historical review-preparation baseline but no longer covers current `main`; the repo-side P0-E review gate requires a refreshed exact target including merge `03679120726ff06005eff903909b262fb1271960` (or later reviewed remediation) before independent findings/sign-off can close P0-E."""

          pr135_bullet = """- **Nexus PR #135 / independent security-review handoff freeze:** Nexus merge `7b84a9e45f9e9cf815b95a06d1560f84d8d3f0a2` freezes exact review targets Nexus `5cdb7825fcc51f8a7d296b992a7da4492ed2ce8e` + Node `083dc181c5e175f89007f4b93111cd5c45a69d97`, 11 mandatory review domains and the evidence index while explicitly keeping independent review, physical qualification, production activation and `strict-pq` OPEN/OFF. This is preparation, not external sign-off."""

          rust_bullets = """- **Nexus PR #139 / C2-A Rust origin hardening:** Nexus merge `36ee6f7a5b1686f9c0d51beda5d24e84830982c7` removes the Python C2-A origin runtime and replaces it with a dependency-free Rust verifier preserving Linux `SO_PEERCRED`, pinned ingress UID/GID, exact client SPKI SHA-256, fixed trusted Node identity and UDS-only handling. The runtime image contains neither Python nor a Rust toolchain; default Compose/install remain unchanged.
- **Nexus PR #140 / C2-B/C/D Rust ACK/recovery hardening:** Nexus merge `03679120726ff06005eff903909b262fb1271960` removes the Python ACK/recovery runtime and replaces it with an isolated Rust 2024/`serde` implementation. Strict schema/duplicate-field rejection, ACK metadata/freshness binding, historical recovery-after-expiry, protected C2-C UDS framing/peercred, exact raw ACK forwarding, response-size/trailing-byte checks, the three disposable response-loss fault domains, thread-per-connection behavior and the reviewed listen backlog of 32 are preserved. The full exact-head C2-B/C/D regression matrix is green and the runtime contains no Python interpreter. These post-#135 security-relevant changes require a refreshed independent-review freeze for current `main`."""

          old_closing = """Closing the repo-side P0-E review gate now requires an independently attributable security-review result and sign-off for those frozen revisions, or a newly frozen target after any security-relevant remediation. The five real E4a physical-power experiments and their independent evidence review remain the parallel external/hardware blocker. Neither the handoff nor green CI counts as independent review or authorizes production rollout."""
          new_closing = """Because PRs #139/#140 are security-relevant runtime hardening after that freeze, current `main` is no longer covered by the PR #135 target. Closing the repo-side P0-E review gate now requires a refreshed exact freeze that includes those merged Rust changes (or later reviewed remediation), followed by independently attributable findings, remediation disposition and sign-off. The five real E4a physical-power experiments and their independent evidence review remain the parallel external/hardware blocker. Neither the handoff, Rust migration nor green CI counts as independent review or authorizes production rollout."""

          for path in readmes:
              replace_once(path, top_review, top_review + "\n\n" + hardening_checkpoint)
              replace_once(
                  path,
                  "The production-capable Agent path remains default-disabled and `strict-pq` remains OFF.",
                  "The production-capable Agent path remains default-disabled and `strict-pq` remains OFF.\n\n" + freeze_notice,
              )
              replace_once(path, pr135_bullet, pr135_bullet + "\n" + rust_bullets)
              replace_once(path, old_closing, new_closing)

          roadmap = "docs/ENTERPRISE_ROADMAP.md"
          roadmap_review = """- **Latest verified Nexus P0-E review-preparation checkpoint:** [`7b84a9e45f9e9cf815b95a06d1560f84d8d3f0a2`](https://github.com/TriplexCorp/XMesh-Nexus/commit/7b84a9e45f9e9cf815b95a06d1560f84d8d3f0a2), merge of [PR #135](https://github.com/TriplexCorp/XMesh-Nexus/pull/135). Node PR #51 plus Nexus PRs #133–#134 close bounded default-off redacted observability; PR #135 freezes the exact Node/Nexus evidence package for external independent security review. The current repo-side P0-E release gate is independent security-review findings/sign-off. P0-E4a remains OPEN until five representative physical abrupt-power experiments are executed and independently reviewed."""
          roadmap_rust = """- **Latest staging ingress/runtime hardening / Nexus PRs #139–#140:** PR #139 merge [`36ee6f7a5b1686f9c0d51beda5d24e84830982c7`](https://github.com/TriplexCorp/XMesh-Nexus/commit/36ee6f7a5b1686f9c0d51beda5d24e84830982c7) replaces the C2-A Python origin verifier with dependency-free Rust while preserving the reviewed `SO_PEERCRED`/UID/GID/SPKI/fixed-Node/UDS trust boundary. PR #140 merge [`03679120726ff06005eff903909b262fb1271960`](https://github.com/TriplexCorp/XMesh-Nexus/commit/03679120726ff06005eff903909b262fb1271960) replaces the C2-B/C/D Python ACK/recovery origin with an isolated Rust 2024/`serde` implementation while preserving strict schema/freshness/recovery binding, protected C2-C framing and peer credentials, exact raw ACK forwarding, bounded response handling, response-loss fault domains, thread-per-connection behavior and Unix backlog 32. Exact-head Backend CI, Hybrid TLS, C2-C authorization, expired recovery, lost-response/race, transport-negative/no-legacy and PostgreSQL rollback workflows are green. These are security-relevant post-#135 changes, so the PR #135 frozen Nexus target does **not** cover current `main`; a refreshed review freeze is required before independent sign-off can close P0-E."""
          replace_once(roadmap, roadmap_review, roadmap_review + "\n" + roadmap_rust)

          replace_once(
              roadmap,
              "| P0-C2-A ingress→origin trust boundary | **P0 COMPLETE — isolated staging/process** | PR #66 |",
              "| P0-C2-A ingress→origin trust boundary | **P0 COMPLETE — isolated staging/process; Rust runtime hardened** | PR #66 proof + PR #139 Rust origin implementation hardening; C2-A runtime contains no Python |",
          )
          replace_once(
              roadmap,
              "| P0-C2-B narrow staging ACK route | **P0 COMPLETE — isolated staging/process** | PR #69 |",
              "| P0-C2-B narrow staging ACK route | **P0 COMPLETE — isolated staging/process; Rust runtime hardened** | PR #69 proof + PR #140 Rust ACK/recovery origin hardening; C2-B/C/D origin runtime contains no Python |",
          )
          replace_once(
              roadmap,
              "| Independent security review | **CURRENT repo-side release sub-gate — external sign-off required** | PR #135 freezes exact Node/Nexus targets and evidence package; independent findings, remediation disposition and sign-off must come from an external reviewer |",
              "| Independent security review | **CURRENT repo-side release sub-gate — refreshed freeze + external sign-off required** | PR #135 freeze predates security-relevant PRs #139/#140; freeze current exact Node/Nexus targets, then obtain independent findings, remediation disposition and sign-off |",
          )
          replace_once(
              roadmap,
              "| **P0-E recovery/security release gates** | **CURRENT P0** | Remaining blockers: real E4a physical-power matrix + independent evidence review, and independent architecture/security findings/sign-off; observability and review handoff are complete |",
              "| **P0-E recovery/security release gates** | **CURRENT P0** | Remaining blockers: real E4a physical-power matrix + independent evidence review, plus refreshed post-#140 review freeze and independent architecture/security findings/sign-off; observability and the earlier review handoff are complete |",
          )

          c2_heading = """## Completed P0-C2-D — integrated real-Node proof

"""
          c2_hardening = """### Post-C2 Rust origin/runtime hardening — COMPLETE

PR #139 replaces the C2-A Python origin process with a dependency-free Rust implementation while preserving the existing hybrid-mTLS→UDS trust boundary: Linux `SO_PEERCRED`, pinned ingress UID/GID, exact client SPKI SHA-256, fixed trusted Node identity and UDS-only handling remain authoritative. The dedicated C2-A runtime image contains neither Python nor a Rust toolchain.

PR #140 then replaces the larger C2-B/C/D Python ACK/recovery origin state machine with an isolated Rust 2024 crate. Strict typed `serde` decoding rejects unknown/duplicate fields; ACK Node/issuer/method/path/epoch/freshness binding, historical recovery only after expiry, protected `XSP2C2C1` / `XSP2C2H1` / `XSP2C2R1` framing, C2-C peercred `10001:10001`, exact raw ACK forwarding, response-size/trailing-byte checks, the three disposable response-loss fault domains, thread-per-connection behavior and the reviewed Unix backlog of 32 are preserved. The exact-head PR #140 Hybrid TLS, C2-B, C2-C, recovery, race/outage, transport-negative/no-legacy, PostgreSQL rollback and Backend CI matrix completed success.

These changes harden the implementation of already-complete isolated C2 boundaries; they do not create a new production activation claim or weaken any prior acceptance invariant. Because they landed after the PR #135 independent-review freeze, current `main` must be re-frozen for external review before the repo-side P0-E review gate can close.

"""
          replace_once(roadmap, c2_heading, c2_heading + c2_hardening)

          old_review_block = """The current repo-side release blocker is therefore the **independent security review findings and sign-off** for those frozen revisions, or a newly frozen target after any security-relevant remediation. The real five-run E4a physical-power matrix and independent evidence review remain the parallel external/hardware blocker. Neither the handoff nor green CI counts as independent review or authorizes rollout."""
          new_review_block = """PRs #139 and #140 landed after that freeze and change the security-sensitive staging origin/ACK/recovery runtime implementation. The PR #135 package remains useful historical review-preparation evidence, but its frozen Nexus target no longer represents current `main`.

The current repo-side release blocker is therefore a **refreshed exact review freeze that includes the merged Rust ingress/runtime hardening, followed by independent security-review findings, remediation disposition and sign-off**. The real five-run E4a physical-power matrix and independent evidence review remain the parallel external/hardware blocker. Neither the earlier handoff, the Rust migration nor green CI counts as independent review or authorizes rollout."""
          replace_once(roadmap, old_review_block, new_review_block)

          replace_once(
              roadmap,
              "- Bounded fuzz, NIST-vector, observability and review-handoff gates do not replace independent security review.",
              "- Bounded fuzz, NIST-vector, observability and review-handoff gates do not replace independent security review.\n- The PR #135 frozen Nexus review target predates PRs #139/#140; current `main` requires a refreshed exact freeze before independent sign-off can apply to the release candidate.",
          )
          PY

          git diff --check
          rm .github/workflows/tmp-docs-rust-ingress-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md docs/ENTERPRISE_ROADMAP.md .github/workflows/tmp-docs-rust-ingress-checkpoint.yml
          git diff --cached --check
          git commit -m "docs(xsp-v2): checkpoint Rust ingress hardening"
          git push origin HEAD:docs/xsp-rust-ingress-checkpoint
