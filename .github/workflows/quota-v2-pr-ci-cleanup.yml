name: Quota V2 cancel superseded PR runs
on:
  push:
    branches:
      - security/quota-v2-attested-cap-issuer
permissions:
  contents: read
  actions: write
concurrency:
  group: quota-v2-nexus-pr-ci-cleanup
  cancel-in-progress: true
jobs:
  cancel-superseded:
    if: github.repository == 'TriplexCorp/XMesh-Nexus' && github.ref == 'refs/heads/security/quota-v2-attested-cap-issuer'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Cancel only superseded runs of Nexus PR 553
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          
          REPO = "TriplexCorp/XMesh-Nexus"
          BRANCH = "security/quota-v2-attested-cap-issuer"
          PR_NUMBER = 553
          HEAD = os.environ["GITHUB_SHA"]
          RUN_ID = int(os.environ["GITHUB_RUN_ID"])
          TOKEN = os.environ["GH_TOKEN"]
          ACTIVE = {"queued", "in_progress", "waiting", "pending", "requested"}
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          assert os.environ["GITHUB_REF"] == "refs/heads/" + BRANCH
          assert re.fullmatch(r"[a-f0-9]{40}", HEAD)
          
          root = "https://api.github.com/repos/" + REPO
          headers = {
              "Authorization": "Bearer " + TOKEN,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "xmesh-quota-v2-pr-ci-gc",
          }
          
          def api(path, method="GET"):
              request = Request(root + path, method=method, headers=headers)
              try:
                  with urlopen(request, timeout=30) as response:
                      data = response.read()
                      return json.loads(data) if data and method == "GET" else None
              except HTTPError as error:
                  if method == "POST" and error.code in (409, 422):
                      print("Already final or not cancelable:", path, "HTTP", error.code, flush=True)
                      return None
                  raise
          
          def assert_current_head():
              latest = api("/branches/" + quote(BRANCH, safe=""))["commit"]["sha"]
              if latest != HEAD:
                  raise SystemExit("Branch advanced: do not cancel runs on a newer revision")
          
          assert_current_head()
          targets = []
          for page in range(1, 16):
              batch = api("/actions/runs?branch=" + quote(BRANCH, safe="") +
                          "&per_page=100&page=" + str(page))["workflow_runs"]
              for run in batch:
                  if run.get("status") not in ACTIVE or run.get("id") == RUN_ID:
                      continue
                  if run.get("head_branch") != BRANCH or run.get("head_sha") == HEAD:
                      continue
                  head_repo = run.get("head_repository") or {}
                  if head_repo.get("full_name") != REPO:
                      continue
                  if run.get("event") == "pull_request":
                      prs = run.get("pull_requests") or []
                      if not any(p.get("number") == PR_NUMBER and
                                 p.get("head", {}).get("ref") == BRANCH and
                                 p.get("head", {}).get("repo", {}).get("name") == "XMesh-Nexus"
                                 for p in prs):
                          continue
                  elif run.get("event") != "push":
                      continue
                  targets.append((run["id"], run["status"], run.get("head_sha", "")))
              if len(batch) < 100:
                  break
          
          targets = sorted(set(targets), key=lambda x: x[1] != "in_progress")
          print("Obsolete Nexus #553 CI runs:", len(targets), "current SHA:", HEAD, flush=True)
          for index, (run_id, state, old_sha) in enumerate(targets):
              if index % 15 == 0:
                  assert_current_head()
              api("/actions/runs/" + str(run_id) + "/cancel", method="POST")
              print("Cancelled obsolete run:", run_id, state, old_sha[:12], flush=True)
              time.sleep(0.5)
          print("Only stale same-PR runs were targeted; current checks preserved.", flush=True)
          PY
