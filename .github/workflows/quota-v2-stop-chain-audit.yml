name: Quota v2 independent NONFINAL stop-chain audit
on:
  pull_request:
    paths:
      - 'scripts/quota_v2_stop_chain_audit.py'
      - 'scripts/quota_v2_rollover_audit.py'
      - 'scripts/quota_v2_prepared_registration.py'
      - 'scripts/quota_v2_external_wal_witness.py'
      - 'scripts/test-quota-v2-stop-chain-audit.py'
      - 'scripts/test-quota-v2-rollover-audit.py'
      - 'scripts/test-quota-v2-signed-nonfinal-sql-isolation.py'
      - 'scripts/test-quota-v2-nonfinal-rollover-postgres.py'
      - 'scripts/test-quota-v2-prepared-registration.py'
      - 'scripts/test-quota-v2-external-wal-witness.py'
      - 'scripts/test-quota-v2-shadow-carryforward-postgres.py'
      - 'backend/migrations/0132_quota_v2_terminal_settlement_quarantine.sql'
      - 'backend/migrations/0133_quota_v2_nonfinal_rollover_prepare.sql'
      - 'backend/migrations/0134_quota_v2_shadow_carryforward_watermarks.sql'
      - 'backend/migrations/0135_quota_v2_external_wal_birth_anchors.sql'
      - '.github/workflows/quota-v2-stop-chain-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/quota_v2_stop_chain_audit.py'
      - 'scripts/quota_v2_rollover_audit.py'
      - 'scripts/quota_v2_prepared_registration.py'
      - 'scripts/quota_v2_external_wal_witness.py'
      - 'scripts/test-quota-v2-stop-chain-audit.py'
      - 'scripts/test-quota-v2-rollover-audit.py'
      - 'scripts/test-quota-v2-signed-nonfinal-sql-isolation.py'
      - 'scripts/test-quota-v2-nonfinal-rollover-postgres.py'
      - 'scripts/test-quota-v2-prepared-registration.py'
      - 'scripts/test-quota-v2-external-wal-witness.py'
      - 'scripts/test-quota-v2-shadow-carryforward-postgres.py'
      - 'backend/migrations/0132_quota_v2_terminal_settlement_quarantine.sql'
      - 'backend/migrations/0133_quota_v2_nonfinal_rollover_prepare.sql'
      - 'backend/migrations/0134_quota_v2_shadow_carryforward_watermarks.sql'
      - 'backend/migrations/0135_quota_v2_external_wal_birth_anchors.sql'
      - '.github/workflows/quota-v2-stop-chain-audit.yml'
permissions:
  contents: read
jobs:
  verify-nonfinal-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quota_test
          POSTGRES_PASSWORD: quota_test_disposable
          POSTGRES_DB: quota_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      XMESH_AUDIT_DISPOSABLE: '1'
      QUOTA_TEST_DSN: postgresql://quota_test:quota_test_disposable@127.0.0.1:5432/quota_test
    steps:
      - name: Check out Nexus independent verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out exact reviewed Node NONFINAL signed-stop implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: TriplexCorp/XMesh-Node
          ref: 165c4759bc89a1077b76129c520b1b8c7dca9cb4
          path: .ci-reviewed-node
      - name: Refuse drift from immutable signed receipt producer
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .ci-reviewed-node rev-parse HEAD)" = "165c4759bc89a1077b76129c520b1b8c7dca9cb4"
          test "$(tr -d '\r\n' < .ci-reviewed-node/AGENT_VERSION)" = "control-v6.0.24"
          test -f .ci-reviewed-node/experiments/quota-v2-physical-stop/stop_chain.py
          test -f .ci-reviewed-node/experiments/quota-v2-physical-stop/rollover_prepare.py
          test -f .ci-reviewed-node/experiments/quota-v2-physical-stop/witness_inventory.py
          test -f .ci-reviewed-node/experiments/quota-v2-physical-stop/verify_nexus_wal_anchor.py
          test -f .ci-reviewed-node/experiments/xray-dataplane-fence/sign_observation.py
          python3 -m py_compile scripts/quota_v2_stop_chain_audit.py scripts/test-quota-v2-stop-chain-audit.py scripts/quota_v2_rollover_audit.py scripts/test-quota-v2-rollover-audit.py scripts/quota_v2_prepared_registration.py scripts/test-quota-v2-prepared-registration.py
          python3 scripts/test-quota-v2-stop-chain-audit.py
          python3 scripts/test-quota-v2-rollover-audit.py
          echo 'Nexus independently validates signed Node v2 stop and conservative rollover prepare; no unlock or refunds'
      - name: Apply hypothetical SQL accounting + permanent production quarantine
        run: |
          python3 -m pip install 'psycopg[binary]==3.2.3' --break-system-packages
          python3 - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ["QUOTA_TEST_DSN"]) as c:
              for name in (
                  "0125_quota_v2_reservations.sql",
                  "0126_quota_v2_revocation_requests.sql",
                  "0127_quota_v2_revocation_freeze.sql",
                  "0128_quota_v2_conservative_burn.sql",
                  "0129_quota_v2_terminal_settlement.sql",
                  "0132_quota_v2_terminal_settlement_quarantine.sql",
                  "0133_quota_v2_nonfinal_rollover_prepare.sql",
                  "0134_quota_v2_shadow_carryforward_watermarks.sql",
                  "0135_quota_v2_external_wal_birth_anchors.sql",
              ):
                  c.execute((Path("backend/migrations") / name).read_text())
          PY
      - name: Genuine Node-signed NONFINAL stop remains SQL-unsettleable
        run: python3 scripts/test-quota-v2-signed-nonfinal-sql-isolation.py
      - name: Verified signed rollover candidates stage exactly once without altering any bytes
        run: python3 scripts/test-quota-v2-nonfinal-rollover-postgres.py
      - name: Immutable Nexus Ed25519 prepared-only registration receipt and six competing signers
        run: python3 scripts/test-quota-v2-prepared-registration.py
      - name: Shadow watermark is exactly-once max-not-sum, immutable and unspendable
        run: python3 scripts/test-quota-v2-shadow-carryforward-postgres.py
      - name: Signed full Xray WAL birth registry anchored externally with no rollback or unsafe release
        run: |
          python3 -m py_compile scripts/quota_v2_external_wal_witness.py scripts/test-quota-v2-external-wal-witness.py
          python3 scripts/test-quota-v2-external-wal-witness.py
