name: XSP-v2 C2-D2 Lost Response and Race E2E (test-only)
on:
  push:
    branches: [main]
    paths:
      - "backend/c2c/**"
      - "backend/src/bin/xsp_v2_c2c.rs"
      - "backend/src/bin/xsp_v2_c2c_fixture.rs"
      - "backend/src/xsp_v2_**"
      - "backend/Dockerfile.xsp-c2c"
      - "backend/Dockerfile.xsp-signer"
      - "deploy/postgres/20-create-xsp-v2-signer-role.sql"
      - "deploy/postgres/21-create-xsp-v2-c2c-role.sql"
      - "deploy/xsp-v2-ingress/**"
      - "scripts/generate-xsp-v2-mldsa-test-certs.go"
      - "scripts/xsp-v2-c2d-node-client_test.go"
      - "scripts/xsp-v2-c2d-race_test.go"
      - "scripts/test-xsp-v2-c2d2-lost-response-races.py"
      - ".github/workflows/xsp-c2d2-failure-matrix.yml"
  pull_request:
    paths:
      - "backend/c2c/**"
      - "backend/src/bin/xsp_v2_c2c.rs"
      - "backend/src/bin/xsp_v2_c2c_fixture.rs"
      - "backend/src/xsp_v2_**"
      - "backend/Dockerfile.xsp-c2c"
      - "backend/Dockerfile.xsp-signer"
      - "deploy/postgres/20-create-xsp-v2-signer-role.sql"
      - "deploy/postgres/21-create-xsp-v2-c2c-role.sql"
      - "deploy/xsp-v2-ingress/**"
      - "scripts/generate-xsp-v2-mldsa-test-certs.go"
      - "scripts/xsp-v2-c2d-node-client_test.go"
      - "scripts/xsp-v2-c2d-race_test.go"
      - "scripts/test-xsp-v2-c2d2-lost-response-races.py"
      - ".github/workflows/xsp-c2d2-failure-matrix.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check D2 failure, outage/restart and race contracts
        run: |
          python3 -m py_compile scripts/test-xsp-v2-c2d2-lost-response-races.py
          test -f deploy/xsp-v2-ingress/origin-ack-rs/src/main.rs
          test -f scripts/xsp-v2-c2d-race_test.go
          test -z "$(gofmt -d scripts/xsp-v2-c2d-race_test.go)"
          ! grep -R --line-number --fixed-strings 'strict-pq=on' scripts/test-xsp-v2-c2d2-lost-response-races.py scripts/xsp-v2-c2d-race_test.go
          ! grep -R --line-number -E '(-p|--publish)[ =]' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'request.Host = serverName' scripts/xsp-v2-c2d-node-client_test.go
          grep -Fq 'XSP_V2_C2D_TEST_FAULT' deploy/xsp-v2-ingress/origin-ack-rs/src/main.rs
          grep -Fq 'drop-before-c2c' deploy/xsp-v2-ingress/origin-ack-rs/src/main.rs scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'drop-on-c2c-failure' deploy/xsp-v2-ingress/origin-ack-rs/src/main.rs scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'drop-after-c2c-success' deploy/xsp-v2-ingress/origin-ack-rs/src/main.rs scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'test_fault != TestFault::None && c2c_gate != "staging-only"' deploy/xsp-v2-ingress/origin-ack-rs/src/main.rs
          grep -Fq 'thread::spawn(move || handle_connection' deploy/xsp-v2-ingress/origin-ack-rs/src/main.rs
          grep -Fq 'reloadVerifiedPermitForReceiptRetry' scripts/xsp-v2-c2d-race_test.go
          ! grep -Fq 'c2dRecoverHistoricalPermitForDurableReceipt' scripts/xsp-v2-c2d-race_test.go scripts/xsp-v2-c2d-node-client_test.go
          grep -Fq 'TestC2DExactFreshOutageFailsClosed' scripts/xsp-v2-c2d-race_test.go scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'TestC2DExactFreshNetworkRetry' scripts/xsp-v2-c2d-race_test.go scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'TestC2DExactDuplicateNetworkRace' scripts/xsp-v2-c2d-race_test.go scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'TestC2DFreshMismatchedRetryRejected' scripts/xsp-v2-c2d-race_test.go scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'TestC2DExpiredNetworkRecovery' scripts/test-xsp-v2-c2d2-lost-response-races.py
          test "$(grep -Fc 'XSP_V2_C2D_HISTORICAL_RECOVERY' scripts/test-xsp-v2-c2d2-lost-response-races.py)" -eq 2
          grep -Fq 'stop_now(origin)' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'stop_now(c2c)' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'stop_now(db)' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'stop_now(signer)' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'docker", "start", db' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'node_xsp_replay_nonces' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'revoked_at IS NULL' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'C2-C process must not listen on TCP' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq 'NetworkMode") != "none"' scripts/test-xsp-v2-c2d2-lost-response-races.py
          grep -Fq '/run/xmesh-signer-keys' scripts/test-xsp-v2-c2d2-lost-response-races.py

  full-process-e2e:
    name: Real Node lost-response, outage/restart and duplicate-race convergence
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Checkout XMesh-Node verified staging client
        uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 0ae78244ef0ef763bea6ce198dde6e83eb11ff1f
          path: xmesh-node
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify Node staging module before cross-repo E2E
        working-directory: xmesh-node/security/xspv2/poc-go
        run: go test ./...
      - name: Exercise integrated lost-response, outage/restart and duplicate/race matrix
        run: python3 scripts/test-xsp-v2-c2d2-lost-response-races.py --node-repo xmesh-node
