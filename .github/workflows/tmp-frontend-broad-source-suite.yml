name: Temporary FinalMask contract patch

on:
  push:
    branches:
      - integration/argon-frontend-recovery-20261102
    paths:
      - '.github/workflows/tmp-frontend-broad-source-suite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: integration/argon-frontend-recovery-20261102
      - name: Replace legacy FinalMask specificity assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-xray-tool-actions.js')
          s=p.read_text()
          old="""assert.ok(studioCss.includes('width:min(84rem,calc(100vw - 2rem))!important'),\n 'FinalMask width must win against the global dialog constraint');"""
          new="""assert.ok(studioCss.includes('width:min(84rem,calc(100vw - 2rem))'),\n 'FinalMask must keep its wide viewport-bounded layout');\nassert.ok(!/dialog\\.xm-studio-modal\\.xm-studio-modal--cards\\{[^}]*width:[^}]*!important/s.test(studioCss),\n 'FinalMask width must not depend on legacy !important specificity hacks');"""
          if old not in s:
              if new in s:
                  print('FinalMask contract already migrated')
                  raise SystemExit(0)
              raise SystemExit('expected legacy FinalMask assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate migrated contract
        run: |
          node scripts/check-xray-tool-actions.js
          git diff --check
      - name: Commit source-contract migration
        run: |
          if git diff --quiet -- scripts/check-xray-tool-actions.js; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'Xmesh Creator'
          git config user.email 'Aselis3d@gmail.com'
          git add scripts/check-xray-tool-actions.js
          git commit -m 'test(frontend): drop legacy FinalMask specificity contract'
          git push origin HEAD:integration/argon-frontend-recovery-20261102
