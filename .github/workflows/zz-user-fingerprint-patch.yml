name: Temporary user fingerprint patch

on:
  push:
    branches:
      - feat/user-fingerprint-override-20261031

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/user-fingerprint-override-20261031
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          overlay = r'''\
'use strict';

// Per-user uTLS fingerprint override for the existing user card.
// Empty value is an explicit inheritance mode: user -> host -> chrome.
(()=>{
  const fallback=['chrome','firefox','safari','ios','android','edge','360','qq','random','randomized','randomizednoalpn','unsafe'];
  const values=()=>Array.from(new Set(typeof XRAY_FP!=='undefined'?XRAY_FP:fallback));
  const findUser=id=>typeof DB!=='undefined'&&Array.isArray(DB.users)
    ?DB.users.find(user=>String(user.id)===String(id))
    :null;

  function inject(form){
    if(!form||form.dataset.userFingerprintInjected==='1')return;
    const fields=form.querySelector('.user-edit-fields');
    const user=findUser(form.dataset.id);
    if(!fields||!user)return;

    const label=document.createElement('label');
    label.className='f user-fingerprint-field';
    const title=document.createElement('span');
    title.textContent='uTLS fingerprint';
    const select=document.createElement('select');
    select.dataset.userFingerprint='';
    select.setAttribute('aria-label','Индивидуальный uTLS fingerprint');

    const inherited=document.createElement('option');
    inherited.value='';
    inherited.textContent='По умолчанию';
    select.append(inherited);
    for(const value of values()){
      const option=document.createElement('option');
      option.value=value;
      option.textContent=value;
      select.append(option);
    }
    select.value=typeof user.fingerprint==='string'?user.fingerprint:'';

    const help=document.createElement('small');
    help.textContent='«По умолчанию» наследует fingerprint хоста. Если у хоста fingerprint не задан, используется chrome.';
    label.append(title,select,help);

    const strategy=form.querySelector('[name="strategy"]')?.closest('.f');
    if(strategy)strategy.insertAdjacentElement('afterend',label);
    else fields.append(label);
    form.dataset.userFingerprintInjected='1';
  }

  function scan(root=document){
    if(root.matches?.('form[data-k="uedit"]'))inject(root);
    root.querySelectorAll?.('form[data-k="uedit"]').forEach(inject);
  }

  scan();
  new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{
    if(node.nodeType===1)scan(node);
  }))).observe(document.documentElement,{childList:true,subtree:true});

  // Keep app.js unchanged: enrich only the existing user-edit update payload.
  if(typeof api!=='undefined'&&api.update&&!api.update.__userFingerprintOverride){
    const original=api.update.bind(api);
    const wrapped=async (collection,id,patch,...rest)=>{
      if(collection==='users'&&patch&&typeof patch==='object'&&!Array.isArray(patch)){
        const form=[...document.querySelectorAll('form[data-k="uedit"]')]
          .find(candidate=>String(candidate.dataset.id)===String(id));
        const select=form?.querySelector('[data-user-fingerprint]');
        if(select)patch={...patch,fingerprint:select.value};
      }
      return original(collection,id,patch,...rest);
    };
    wrapped.__userFingerprintOverride=true;
    api.update=wrapped;
  }
})();
'''
          Path('user-fingerprint-override.js').write_text(overlay, encoding='utf-8')

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          needle='<script src="app.js?v=20261027-profile-attest-repair-513"></script>'
          replacement=needle+'\n<script src="/user-fingerprint-override.js?v=20261031-user-fp-inherit-v1"></script>'
          assert needle in text, 'app.js script marker changed'
          assert 'user-fingerprint-override.js' not in text, 'overlay already loaded'
          index.write_text(text.replace(needle,replacement,1),encoding='utf-8')

          docker=Path('backend/Dockerfile')
          text=docker.read_text(encoding='utf-8')
          needle='client-routing.js client-routing.css app.js node-bootstrap-v6.js unified-selects.js /app/static/'
          replacement='client-routing.js client-routing.css app.js user-fingerprint-override.js node-bootstrap-v6.js unified-selects.js /app/static/'
          assert needle in text, 'Docker static COPY marker changed'
          docker.write_text(text.replace(needle,replacement,1),encoding='utf-8')

          subs=Path('backend/src/user_subscriptions.rs')
          text=subs.read_text(encoding='utf-8')
          needle='''fn nonempty<'a>(obj: &'a Value, key: &str) -> Option<&'a str> {\n    obj.get(key)\n        .and_then(Value::as_str)\n        .filter(|s| !s.is_empty())\n}\n'''
          helper=needle+'''\n// User-level fingerprint is an optional client override. Empty/absent means\n// inherit the endpoint fingerprint; legacy endpoints without one fall back to chrome.\nfn client_host_for_user(user: &Value, host: &Value) -> Value {\n    let mut effective = host.clone();\n    let fingerprint = nonempty(user, "fingerprint")\n        .or_else(|| nonempty(user, "fp"))\n        .or_else(|| nonempty(host, "fp"))\n        .or_else(|| nonempty(host, "fingerprint"))\n        .unwrap_or("chrome");\n    effective["fp"] = json!(fingerprint);\n    effective\n}\n'''
          assert needle in text, 'nonempty helper marker changed'
          assert 'fn client_host_for_user(' not in text, 'client_host_for_user already exists'
          text=text.replace(needle,helper,1)

          old='let outbound_stream = crate::subscription_transport::client_stream(inbound, host, device)?;'
          new='''let client_host = client_host_for_user(user, host);\n    let outbound_stream =\n        crate::subscription_transport::client_stream(inbound, &client_host, device)?;'''
          assert text.count(old)==1, f'unexpected VLESS client_stream call count: {text.count(old)}'
          text=text.replace(old,new,1)

          old='let stream = crate::subscription_transport::client_stream(inbound, host, device)?;'
          new='''let client_host = client_host_for_user(user, host);\n    let stream = crate::subscription_transport::client_stream(inbound, &client_host, device)?;'''
          assert text.count(old)==1, f'unexpected generic client_stream call count: {text.count(old)}'
          text=text.replace(old,new,1)
          subs.write_text(text,encoding='utf-8')

          check=Path('scripts/check-user-fingerprint-ownership.js')
          check.write_text(r'''#!/usr/bin/env node
'use strict';
const fs=require('node:fs');
const assert=require('node:assert/strict');
const overlay=fs.readFileSync('user-fingerprint-override.js','utf8');
const subscription=fs.readFileSync('backend/src/user_subscriptions.rs','utf8');
const hostEditor=fs.readFileSync('xray-studio-hosts.js','utf8');
const index=fs.readFileSync('index.html','utf8');
const docker=fs.readFileSync('backend/Dockerfile','utf8');

assert.match(overlay,/inherited\.textContent='По умолчанию'/,'User fingerprint selector must expose a visible default option');
assert.match(overlay,/наследует fingerprint хоста/,'Default mode must explain host inheritance');
assert.match(overlay,/data-user-fingerprint/,'User card must expose the per-user fingerprint control');
assert.match(overlay,/fingerprint:select\.value/,'User edit save must persist the per-user override');
assert.match(index,/user-fingerprint-override\.js/,'User fingerprint overlay must load after app.js');
assert.match(docker,/app\.js user-fingerprint-override\.js node-bootstrap-v6\.js/,'Backend image must package the overlay');
assert.match(hostEditor,/data-endpoint="fp"/,'Host fingerprint editor remains available');
assert.match(subscription,/fn client_host_for_user\(user: &Value, host: &Value\) -> Value/,'Subscription backend must build an effective host per user');
assert.match(subscription,/nonempty\(user, "fingerprint"\)[\s\S]*nonempty\(host, "fp"\)[\s\S]*unwrap_or\("chrome"\)/,
  'Fingerprint precedence must be user > host > chrome');
assert.equal((subscription.match(/client_host_for_user\(user, host\)/g)||[]).length,2,
  'Both VLESS and generic proxy subscription paths must apply the per-user override');
console.log('Per-user fingerprint override: user > host > default chrome.');
''',encoding='utf-8')
          PY

      - name: Check JavaScript and regression contract
        run: |
          node --check user-fingerprint-override.js
          node scripts/check-user-fingerprint-ownership.js

      - name: Format and check backend
        run: |
          cargo fmt --manifest-path backend/Cargo.toml -- --check
          cargo check --manifest-path backend/Cargo.toml

      - name: Commit focused result and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/zz-user-fingerprint-patch.yml
          git add user-fingerprint-override.js index.html backend/Dockerfile backend/src/user_subscriptions.rs scripts/check-user-fingerprint-ownership.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(users): restore per-user fingerprint override'
          git push origin HEAD:feat/user-fingerprint-override-20261031
