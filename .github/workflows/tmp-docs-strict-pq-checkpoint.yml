name: Temporary docs strict-PQ checkpoint sync

on:
  push:
    branches:
      - docs/strict-pq-approval-checkpoint

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/strict-pq-approval-checkpoint
      - name: Synchronize README and Roadmap checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_sha = "0bab1a48cff570b3abe405bcda4dc242b23b8a4b"
          pr = "155"
          dedicated = "41035081951"
          backend = "41035081996"

          paragraph = (
              f"**Latest verified strict-PQ activation-approval checkpoint:** "
              f"[`{main_sha}`](https://github.com/TriplexCorp/XMesh-Nexus/commit/{main_sha}), merge of "
              f"[PR #{pr}](https://github.com/TriplexCorp/XMesh-Nexus/pull/{pr}). "
              f"Post-merge activation-contract run `{dedicated}` and Backend CI `{backend}` completed **success**. "
              "The gate binds one exact release candidate to externally expected independent-security-review, "
              "physical-qualification and rollout-plan verifier digests, the final post-P0-E canary, an explicit "
              "named-Node scope of at most 50 Nodes and a maximum 24-hour approval window. Contract policy itself "
              "cannot be weakened through an alternate contract. It keeps `automaticFallback=false`, forbids "
              "classical-only downgrade, separates `strictPqAction=enable` from `legacyXMESH1Action=retain`, and even "
              "an eligible approval reports `strictPQEnabled=false`, `productionActivation=false`, "
              "`legacyXMESH1Retired=false` and `requiresSeparateExecution=true`. **This is non-executing authorization "
              "tooling only; it does not activate production.**\n\n"
          )

          old_status = (
              "The disposable release-canary rehearsal harness and production rollout-plan acceptance tooling are COMPLETE as preparation only; "
              "the exact post-P0-E release candidate must rerun the canary and then supply a separately reviewed real rollout/rollback plan before activation can be considered."
          )
          new_status = (
              old_status + " The explicit strict-PQ activation-approval gate is also COMPLETE as non-executing release tooling; "
              "even an eligible approval still requires a separate execution step, does not enable production itself and does not retire XMESH1."
          )

          for name in ("README.md", "README.en.md"):
              p = Path(name)
              text = p.read_text()
              if "Latest verified strict-PQ activation-approval checkpoint" not in text:
                  anchor = "**Latest verified staging ingress hardening checkpoint:**"
                  if anchor not in text:
                      raise SystemExit(f"{name}: staging checkpoint anchor missing")
                  text = text.replace(anchor, paragraph + anchor, 1)
              if old_status in text:
                  text = text.replace(old_status, new_status, 1)
              elif new_status not in text:
                  raise SystemExit(f"{name}: release-status anchor missing")
              p.write_text(text)

          rp = Path("docs/ENTERPRISE_ROADMAP.md")
          text = rp.read_text()
          bullet = (
              f"- **Explicit strict-PQ activation approval / Nexus PR #155:** merge "
              f"[`{main_sha}`](https://github.com/TriplexCorp/XMesh-Nexus/commit/{main_sha}) adds the final non-executing repo-side "
              "authorization gate before any production strict-PQ execution. Post-merge activation-contract run "
              f"`{dedicated}` and Backend CI `{backend}` are **success**. Eligibility is fail-closed against one exact candidate, "
              "externally expected security-review/physical-qualification/rollout-plan evidence digests, the final post-P0-E canary, "
              "at most 50 explicitly named Nodes and a maximum 24-hour window. Alternate contracts cannot widen those bounds or weaken "
              "the forbidden-field policy. The gate forbids automatic fallback/classical-only downgrade, keeps first activation separate "
              "from XMESH1 retirement, and still forces `strictPQEnabled=false`, `productionActivation=false`, "
              "`legacyXMESH1Retired=false`, `requiresSeparateExecution=true`. This completes repo-side approval tooling only; #137/#138 "
              "and exact-candidate final release evidence remain external blockers.\n"
          )
          if "Explicit strict-PQ activation approval / Nexus PR #155" not in text:
              anchor = "- **Latest staging ingress/runtime hardening / Nexus PRs #139–#140:**"
              if anchor not in text:
                  raise SystemExit("Roadmap: staging hardening anchor missing")
              text = text.replace(anchor, bullet + anchor, 1)
          rp.write_text(text)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md docs/ENTERPRISE_ROADMAP.md
          if git diff --cached --quiet; then
            echo "Documentation already synchronized"
            exit 0
          fi
          git commit -m "docs(xsp-v2): record strict-PQ approval checkpoint"
          git push origin HEAD:docs/strict-pq-approval-checkpoint
