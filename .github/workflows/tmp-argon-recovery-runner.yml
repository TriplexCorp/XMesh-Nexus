name: Temporary Argon recovery runner

on:
  push:
    branches:
      - integration/argon-frontend-recovery-20261102

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: integration/argon-frontend-recovery-20261102
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Apply patcher
        run: python3 scripts/tmp-argon-recovery.py
      - name: Refresh content cache keys
        run: node scripts/update-ui-cache.cjs
      - name: Verify source contracts
        run: |
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/check-ui-system.js
          node scripts/check-node-create-action.js
          node scripts/check-modal-motion.js
          node scripts/check-static-assets.js
          git diff --check
      - name: Commit verified fixes
        run: |
          git config user.name 'XMesh frontend integration'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git add frontend scripts .github/workflows/backend-ci.yml
          git commit -m 'fix(frontend): integrate verified Argon recovery fixes'
          git push origin HEAD:integration/argon-frontend-recovery-20261102
