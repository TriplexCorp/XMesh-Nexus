name: Temporary v6.0.6 future repair
'on':
  push:
    branches:
      - fix/agent-v6.0.6-future-repair
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-v6.0.6-future-repair
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 scripts/tmp-v606-future-repair.py
          if git diff --quiet; then
            echo 'No codemod changes left.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENT_VERSION backend/src/node_runtime.rs deploy/install-node-metrics-agent.sh deploy/node-control-agent.sh deploy/update-node-control-agent.sh deploy/xsp-v2-product-gateway/main.go docs/AGENT_RELEASE_POLICY.md scripts/check-agent-update-base.js scripts/check-agent-update.js
          git commit -m 'chore: apply v6.0.6 future repair'
          git push origin HEAD:fix/agent-v6.0.6-future-repair
