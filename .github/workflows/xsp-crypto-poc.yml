name: XSP-v2 Crypto PoC (Rust/OpenSSL 3.5)
on:
  push:
    branches: [main]
    paths:
      - "security/xspv2/poc-rust/**"
      - "backend/src/xsp_v2_api.rs"
      - "backend/src/xsp_v2_enrollment.rs"
      - "backend/src/xsp_v2_rotation.rs"
      - "backend/src/xsp_v2_signed_cutover.rs"
      - "backend/src/xsp_v2_candidate_binding.rs"
      - "backend/src/xsp_v2_db_candidate_snapshot.rs"
      - "backend/src/xsp_v2_permit_ledger_writer.rs"
      - "backend/src/xsp_v2_ack_ledger_validator.rs"
      - "backend/src/xsp_v2_ack_epoch_commit.rs"
      - "backend/src/xsp_v2_commit_receipt.rs"
      - "backend/src/xsp_v2_signed_receipt_outbox.rs"
      - "backend/src/xsp_v2_signer.rs"
      - "backend/Dockerfile.xsp-signer"
      - "compose.yaml"
      - "deploy/postgres/20-create-xsp-v2-signer-role.sql"
      - "scripts/provision-xsp-v2-signer-db-role.sh"
      - "scripts/provision-xsp-v2-signer-keys.sh"
      - "backend/migrations/0105_node_xsp_signed_commit_receipt_outbox.sql"
      - "backend/migrations/0106_node_xsp_signed_receipt_truncate_guard.sql"
      - "docs/XSP_V2_COMMIT_RECEIPT_VECTORS.json"
      - "docs/XSP_V2_CUTOVER_CANDIDATE_VECTORS.json"
      - "backend/migrations/0102_node_xsp_rotation_preparations.sql"
      - "scripts/make-xsp-owner-proof-fixture.py"
      - "backend/migrations/0100_node_xsp_owner_key_approval.sql"
      - "backend/src/main.rs"
      - "backend/Cargo.toml"
      - "docs/XSP_V2_CRYPTO_POC.json"
      - "docs/XSP_V2_VECTORS.json"
      - ".github/workflows/xsp-crypto-poc.yml"
  pull_request:
    paths:
      - "security/xspv2/poc-rust/**"
      - "backend/src/xsp_v2_api.rs"
      - "backend/src/xsp_v2_signed_cutover.rs"
      - "backend/src/xsp_v2_candidate_binding.rs"
      - "backend/src/xsp_v2_db_candidate_snapshot.rs"
      - "backend/src/xsp_v2_permit_ledger_writer.rs"
      - "backend/src/xsp_v2_ack_ledger_validator.rs"
      - "backend/src/xsp_v2_ack_epoch_commit.rs"
      - "backend/src/xsp_v2_commit_receipt.rs"
      - "backend/src/xsp_v2_signed_receipt_outbox.rs"
      - "backend/src/xsp_v2_signer.rs"
      - "backend/Dockerfile.xsp-signer"
      - "compose.yaml"
      - "deploy/postgres/20-create-xsp-v2-signer-role.sql"
      - "scripts/provision-xsp-v2-signer-db-role.sh"
      - "scripts/provision-xsp-v2-signer-keys.sh"
      - "backend/migrations/0105_node_xsp_signed_commit_receipt_outbox.sql"
      - "backend/migrations/0106_node_xsp_signed_receipt_truncate_guard.sql"
      - "docs/XSP_V2_COMMIT_RECEIPT_VECTORS.json"
      - "docs/XSP_V2_CUTOVER_CANDIDATE_VECTORS.json"
      - "backend/src/xsp_v2_enrollment.rs"
      - "backend/src/xsp_v2_rotation.rs"
      - "backend/migrations/0102_node_xsp_rotation_preparations.sql"
      - "scripts/make-xsp-owner-proof-fixture.py"
      - "backend/migrations/0100_node_xsp_owner_key_approval.sql"
      - "backend/src/main.rs"
      - "backend/Cargo.toml"
      - "docs/XSP_V2_CRYPTO_POC.json"
      - "docs/XSP_V2_VECTORS.json"
      - ".github/workflows/xsp-crypto-poc.yml"
permissions:
  contents: read
jobs:
  crypto:
    runs-on: ubuntu-latest
    container: rust:1.99-trixie
    services:
      postgres:
        image: timescale/timescaledb:2.30.0-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: xsp-ci-throwaway
          POSTGRES_DB: xsp_cutover_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d xsp_cutover_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch XMesh-Node test-only Go verifier
        uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Node
          path: xmesh-node
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install OpenSSL 3.5 development headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libssl-dev python3
          openssl version
      - name: Cross-verify OpenSSL deterministic signatures against Go's public digest fixtures
        run: python3 scripts/check-xsp-crypto-openssl.py
      - name: Validate isolated Rust ML-DSA provider, hybrid signatures and negative cases
        run: |
          cargo test --manifest-path security/xspv2/poc-rust/Cargo.toml --all-targets
      - name: Cross-verify real Go and Rust signed artifacts in BOTH directions
        run: |
          cd xmesh-node/security/xspv2/poc-go
          go build -o "$RUNNER_TEMP/xsp-go-interop" ./cmd/interop
          cd "$GITHUB_WORKSPACE"
          cargo build --manifest-path security/xspv2/poc-rust/Cargo.toml --bin interop
          XSP_GO_CLI="$RUNNER_TEMP/xsp-go-interop" XSP_RUST_CLI="$GITHUB_WORKSPACE/security/xspv2/poc-rust/target/debug/interop" python3 scripts/check-xsp-cross-language.py
      - name: Generate one-use Go encrypted-vault proof for Rust cross-language enrollment test
        run: |
          cd xmesh-node/security/xspv2/poc-go
          go build -o "$RUNNER_TEMP/xsp-keytool" ./cmd/keytool
          cd "$GITHUB_WORKSPACE"
          XSP_GO_KEYTOOL="$RUNNER_TEMP/xsp-keytool" python3 scripts/make-xsp-owner-proof-fixture.py
      - name: Compile and run experimental XSP-v2 heartbeat verifier tests (no production switch)
        run: |
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_api::tests
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_enrollment::tests
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_rotation::tests
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_candidate_binding::tests
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_db_candidate_snapshot::tests
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_permit_ledger_writer::tests
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_ack_ledger_validator::tests
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_ack_epoch_commit::tests
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_commit_receipt::tests
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_signed_receipt_outbox::tests
          XSP_V2_REQUIRE_PQ_CUTOVER_TESTS=1 cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_signed_cutover::signed_tests
      - name: Verify real dual-signed ACK via Rust verifier and disposable PostgreSQL
        env:
          XSP_V2_TEST_DATABASE_URL: postgres://postgres:xsp-ci-throwaway@postgres:5432/xsp_cutover_ci
          XSP_V2_REQUIRE_PQ_DB_TESTS: "1"
        run: |
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xmesh-api -- xsp_v2_signed_cutover::signed_tests::real_postgres_signed_ack_commit_and_fail_closed --exact --nocapture
      - name: Verify Rust PoC and experimental backend formatting
        run: |
          rustup component add rustfmt clippy
          cargo fmt --manifest-path security/xspv2/poc-rust/Cargo.toml --all -- --check
          cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - name: Strict experimental XSP-v2 backend Clippy
        run: |
          cargo clippy --manifest-path backend/Cargo.toml --all-targets --features xsp-v2-experimental -- -D warnings -D clippy::pedantic -D clippy::nursery -F unsafe-code
