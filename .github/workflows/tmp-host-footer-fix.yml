name: tmp host footer fix

on:
  push:
    branches:
      - integration/argon-frontend-recovery-20261102

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/argon-frontend-recovery-20261102
      - name: Keep host footer inside dialog viewport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/styles/features/hosts/hosts.css')
          s = p.read_text()
          old = '''dialog.host-wide>form.box>.act {
            position:static;
            flex:0 0 auto;
            margin:0;
            padding:11px 0 0;
            border-top:1px solid var(--nx-border);
            background:var(--nx-panel-bg);
            z-index:auto;
          }'''
          new = '''dialog.host-wide>form.box>.act {
            position:sticky;
            bottom:0;
            flex:0 0 auto;
            margin:0;
            padding:11px 0 0;
            border-top:1px solid var(--nx-border);
            background:var(--nx-panel-bg);
            z-index:5;
          }'''
          if old not in s:
              print('Host footer already migrated; no change needed.')
          else:
              p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit runtime fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/styles/features/hosts/hosts.css
          git commit -m "fix(ui): keep host dialog footer viewport-safe"
          git push origin HEAD:integration/argon-frontend-recovery-20261102
