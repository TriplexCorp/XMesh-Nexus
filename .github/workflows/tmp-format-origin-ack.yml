name: Temporary format Rust origin ACK gate
on:
  push:
    branches: [refactor/xsp-origin-ack-rust]
    paths:
      - ".github/workflows/tmp-format-origin-ack.yml"
permissions:
  contents: write
jobs:
  format-and-clean:
    runs-on: ubuntu-latest
    container: rust:1.99-trixie
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/xsp-origin-ack-rust
          fetch-depth: 0
      - name: Apply exact Rust 1.99 formatting and remove this helper
        run: |
          rustup component add rustfmt
          cargo fmt --manifest-path deploy/xsp-v2-ingress/origin-ack-rs/Cargo.toml --all
          rm .github/workflows/tmp-format-origin-ack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/xsp-v2-ingress/origin-ack-rs/src/main.rs .github/workflows/tmp-format-origin-ack.yml
          git diff --cached --check
          git commit -m "style(xsp-v2): rustfmt ACK gate"
          git push origin HEAD:refactor/xsp-origin-ack-rust
