name: XSP-v2 P0-E3b Backup Set Preflight

on:
  push:
    branches: [main]
    paths:
      - "backend/src/bin/xsp_v2_recovery_bundle.rs"
      - "backend/src/bin/xsp_v2_recovery_checkpoint.rs"
      - "backend/Cargo.toml"
      - "docs/XSP_V2_P0E_COORDINATED_BACKUP_RESTORE.md"
      - ".github/workflows/xsp-p0e3b-backup-set-preflight.yml"
  pull_request:
    paths:
      - "backend/src/bin/xsp_v2_recovery_bundle.rs"
      - "backend/src/bin/xsp_v2_recovery_checkpoint.rs"
      - "backend/Cargo.toml"
      - "docs/XSP_V2_P0E_COORDINATED_BACKUP_RESTORE.md"
      - ".github/workflows/xsp-p0e3b-backup-set-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-unit:
    runs-on: ubuntu-latest
    container: rust:1.99-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL 3.5 development headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libssl-dev
          openssl version
      - name: Enforce offline fail-closed source boundary
        run: |
          set -euo pipefail
          src=backend/src/bin/xsp_v2_recovery_bundle.rs
          ! grep -E 'reqwest|TcpStream|axum|Router|sqlx|Command::|UPDATE |INSERT |DELETE |TRUNCATE ' "$src"
          ! grep -F 'strict-pq=on' "$src" docs/XSP_V2_P0E_COORDINATED_BACKUP_RESTORE.md
          grep -Fq 'create_new(true)' "$src"
          grep -Fq 'backup epoch is below E3a recovery floor' "$src"
          grep -Fq 'missing, altered or mixed-generation backup component detected' "$src"
          grep -Fq 'backup set must contain exactly four required components' "$src"
          grep -Fq 'postgres-dump' "$src"
          grep -Fq 'agent-state' "$src"
          grep -Fq 'signer-identity' "$src"
          grep -Fq 'mtls-identity' "$src"
      - name: Re-run real E3a dual-signature witness tests
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ML-DSA-65 -outform DER -out /tmp/xsp-p0e3b-mldsa65.der
          XMESH_P0E3A_TEST_MLDSA65_DER=/tmp/xsp-p0e3b-mldsa65.der \
            cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental \
            --bin xsp-v2-recovery-checkpoint -- --nocapture
          rm -f /tmp/xsp-p0e3b-mldsa65.der
      - name: Run backup-set positive and negative tests
        run: |
          cargo test --manifest-path backend/Cargo.toml --features xsp-v2-experimental \
            --bin xsp-v2-recovery-bundle -- --nocapture
      - name: Check formatting
        run: |
          rustup component add rustfmt
          cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - name: Strict Clippy
        run: |
          rustup component add clippy
          cargo clippy --manifest-path backend/Cargo.toml --features xsp-v2-experimental \
            --bin xsp-v2-recovery-bundle --tests -- -D warnings -D clippy::pedantic -D clippy::nursery -F unsafe-code

  real-backup-components:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build only the offline E3b verifier
        run: cargo build --manifest-path backend/Cargo.toml --features xsp-v2-experimental --bin xsp-v2-recovery-bundle
      - name: Create real PostgreSQL, Agent, signer and mTLS backup components
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/p0e3b"
          mkdir -p "$work/agent/cutover" "$work/agent/keys" "$work/signer" "$work/mtls"
          chmod 700 "$work/agent" "$work/agent/cutover" "$work/agent/keys" "$work/signer" "$work/mtls"

          db=xsp-p0e3b-db-$RANDOM
          trap 'docker rm -f "$db" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$db" -e POSTGRES_PASSWORD=p0e3b -e POSTGRES_DB=xmesh postgres:18 >/dev/null
          for _ in $(seq 1 80); do
            docker exec "$db" pg_isready -U postgres -d xmesh >/dev/null 2>&1 && break
            sleep 0.25
          done
          docker exec -i "$db" psql -U postgres -d xmesh -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE recovery_fixture(node_id bigint PRIMARY KEY, key_epoch bigint NOT NULL, receipt_sha256 text NOT NULL);
          INSERT INTO recovery_fixture VALUES (41, 7, repeat('11', 32));
          SQL
          docker exec "$db" pg_dump -U postgres -d xmesh -Fc -f /tmp/current.dump
          docker cp "$db:/tmp/current.dump" "$work/postgres.dump"
          test -s "$work/postgres.dump"
          pg_restore --list "$work/postgres.dump" >/dev/null

          printf 'agent-floor=7\n' > "$work/agent/keys/node-request.vault.min-epoch"
          printf 'encrypted-agent-vault-fixture\n' > "$work/agent/keys/node-request.vault"
          printf 'authoritative-receipt-digest=%064d\n' 0 > "$work/agent/cutover/xsp2-verified-commit-receipt.fixture"
          chmod 600 "$work/agent/keys/"* "$work/agent/cutover/"*
          tar --sort=name --numeric-owner --owner=0 --group=0 -C "$work" -cf "$work/agent.tar" agent

          openssl genpkey -algorithm ED25519 -out "$work/signer/panel-ed25519.pem"
          openssl genpkey -algorithm ED25519 -out "$work/signer/recovery-test-second.pem"
          chmod 600 "$work/signer/"*.pem
          tar --sort=name --numeric-owner --owner=0 --group=0 -C "$work" -cf "$work/signer.tar" signer

          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -subj '/CN=node-ingress.xsp.invalid' -days 1 \
            -keyout "$work/mtls/client-key.pem" -out "$work/mtls/client.pem" >/dev/null 2>&1
          chmod 600 "$work/mtls/client-key.pem"
          chmod 644 "$work/mtls/client.pem"
          tar --sort=name --numeric-owner --owner=0 --group=0 -C "$work" -cf "$work/mtls.tar" mtls

          cat > "$work/checkpoint.json" <<'JSON'
          {"schema":"xsp2-owner-offhost-recovery-checkpoint-1","nodeId":41,"minimumEpoch":7,"receiptSha256Hex":"1111111111111111111111111111111111111111111111111111111111111111","signedReceiptBase64":"eA=="}
          JSON

          tool=backend/target/debug/xsp-v2-recovery-bundle
          "$tool" create --node-id 41 --key-epoch 7 --checkpoint "$work/checkpoint.json" \
            --postgres-dump "$work/postgres.dump" --agent-state "$work/agent.tar" \
            --signer-identity "$work/signer.tar" --mtls-identity "$work/mtls.tar" \
            --out "$work/manifest.json"
          "$tool" verify --manifest "$work/manifest.json" --checkpoint "$work/checkpoint.json" \
            --postgres-dump "$work/postgres.dump" --agent-state "$work/agent.tar" \
            --signer-identity "$work/signer.tar" --mtls-identity "$work/mtls.tar"

          cp "$work/agent.tar" "$work/agent-old.tar"
          printf 'mixed-generation' >> "$work/agent-old.tar"
          if "$tool" verify --manifest "$work/manifest.json" --checkpoint "$work/checkpoint.json" \
            --postgres-dump "$work/postgres.dump" --agent-state "$work/agent-old.tar" \
            --signer-identity "$work/signer.tar" --mtls-identity "$work/mtls.tar"; then
            echo 'mixed-generation Agent archive was accepted' >&2
            exit 1
          fi
          if "$tool" verify --manifest "$work/manifest.json" --checkpoint "$work/checkpoint.json" \
            --postgres-dump "$work/postgres.dump" --agent-state "$work/agent.tar" \
            --signer-identity "$work/missing-signer.tar" --mtls-identity "$work/mtls.tar"; then
            echo 'missing signer identity was accepted' >&2
            exit 1
          fi
          echo 'P0-E3B BACKUP SET PREFLIGHT: PASS'
