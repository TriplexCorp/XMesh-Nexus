name: Quota WAL authenticated transport
on:
  pull_request:
    paths:
      - 'backend/src/quota_wal_transport.rs'
      - 'backend/src/node_auth.rs'
      - 'backend/src/node_policy.rs'
      - 'backend/src/main.rs'
      - 'compose.yaml'
      - 'deploy/node-control-agent.sh'
      - 'deploy/xsp-v2-product-gateway/main.go'
      - 'backend/migrations/0135_quota_v2_external_wal_birth_anchors.sql'
      - 'backend/migrations/0136_quota_v2_external_wal_birth_sources.sql'
      - 'scripts/test-quota-wal-transport.py'
      - 'scripts/test-quota-wal-reconcile.py'
      - 'scripts/run-quota-wal-transport-audit.sh'
      - '.github/workflows/quota-wal-transport.yml'
permissions:
  contents: read
jobs:
  signed-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      XMESH_AUDIT_DISPOSABLE: '1'
      QUOTA_TEST_DSN: postgresql://quota_test:quota_test_disposable@127.0.0.1:5432/quota_test
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: timescale/timescaledb:2.30.0-pg18
        env:
          POSTGRES_USER: quota_test
          POSTGRES_PASSWORD: quota_test_disposable
          POSTGRES_DB: quota_test
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8
        ports: ['127.0.0.1:6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: TriplexCorp/XMesh-Node
          ref: 19d9c3b9afb4be1dc3265be412244f3e3fc1a6f9
          path: .ci-reviewed-node
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .ci-reviewed-node/agent/xspv2/go.mod
          cache: false
      - name: Build and verify the pinned staging Agent
        working-directory: .ci-reviewed-node/agent/xspv2
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          version="$(tr -d '\r\n' < ../../AGENT_VERSION)"
          test "$revision" = '19d9c3b9afb4be1dc3265be412244f3e3fc1a6f9'
          test "$version" = 'control-v6.0.25'
          go build -trimpath -ldflags "-X main.version=$version -X main.sourceRevision=$revision" \
            -o "$RUNNER_TEMP/wal-product-agent" ./cmd/xmesh-agent-xspv2-product
          "$RUNNER_TEMP/wal-product-agent" --identity | python3 -c '
          import hashlib, json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          assert json.load(sys.stdin) == {
              "version": sys.argv[2], "sourceRevision": sys.argv[3],
              "artifactSha256": hashlib.sha256(path.read_bytes()).hexdigest(),
          }' "$RUNNER_TEMP/wal-product-agent" "$version" "$revision"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the real Nexus API
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo build --manifest-path backend/Cargo.toml --bin xmesh-api
      - name: Exercise HTTP authentication, durable ACK and independent Node verification
        run: |
          python3 -m venv "$RUNNER_TEMP/quota-wal"
          source "$RUNNER_TEMP/quota-wal/bin/activate"
          python -m pip install 'psycopg[binary]==3.2.3'
          bash scripts/run-quota-wal-transport-audit.sh backend/target/debug/xmesh-api --with-reconcile
