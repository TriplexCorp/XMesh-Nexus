name: Temporary P0-E4a qualification-review docs checkpoint

on:
  push:
    branches:
      - docs/p0e4a-qualification-review-checkpoint

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0e4a-qualification-review-checkpoint
          fetch-depth: 0

      - name: Patch authoritative docs
        run: python3 scripts/tmp_sync_p0e4a_qualification_review_docs.py

      - name: Verify, self-clean and push
        run: |
          git diff --check
          rm .github/workflows/tmp-docs-p0e4a-qualification-review-checkpoint.yml
          rm scripts/tmp_sync_p0e4a_qualification_review_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md docs/ENTERPRISE_ROADMAP.md .github/workflows/tmp-docs-p0e4a-qualification-review-checkpoint.yml scripts/tmp_sync_p0e4a_qualification_review_docs.py
          git diff --cached --check
          git commit -m "docs(xsp-v2): checkpoint P0-E4a qualification-review acceptance"
          git push origin HEAD:docs/p0e4a-qualification-review-checkpoint
