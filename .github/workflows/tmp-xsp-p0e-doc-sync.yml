name: Temporary XSP-v2 P0-E docs sync

on:
  push:
    branches:
      - docs/xsp-v2-security-review-current

permissions:
  contents: write

jobs:
  sync-docs:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/xsp-v2-security-review-current
          fetch-depth: 0

      - name: Apply exact status replacements
        run: python3 scripts/tmp-xsp-p0e-doc-sync.py

      - name: Remove temporary sync helpers
        run: rm .github/workflows/tmp-xsp-p0e-doc-sync.yml scripts/tmp-xsp-p0e-doc-sync.py

      - name: Commit synchronized docs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/tmp-xsp-p0e-doc-sync.yml \
            README.en.md \
            README.md \
            docs/ENTERPRISE_ROADMAP.md \
            scripts/tmp-xsp-p0e-doc-sync.py | sort)"
          test "$changed" = "$expected"
          git commit -m 'docs(xsp-v2): mark observability complete and review current'
          git push origin HEAD:docs/xsp-v2-security-review-current
