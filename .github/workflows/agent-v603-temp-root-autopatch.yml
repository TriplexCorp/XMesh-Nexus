name: Agent v6.0.3 release alignment

on:
  push:
    branches:
      - fix/agent-v6.0.3-private-tmp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/agent-v6.0.3-private-tmp
          fetch-depth: 0
      - name: Apply bounded release alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          Path('AGENT_VERSION').write_text('control-v6.0.3\n',encoding='utf-8')
          replace('docs/AGENT_RELEASE_POLICY.md','Current target: **`control-v6.0.2`**.','Current target: **`control-v6.0.3`**.')
          replace('backend/src/node_runtime.rs','pub const CONTROL_AGENT_VERSION: &str = "control-v6.0.2";','pub const CONTROL_AGENT_VERSION: &str = "control-v6.0.3";')

          for path in ['deploy/install-node-metrics-agent.sh','deploy/update-node-control-agent.sh']:
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if 'control-v6.0.2' not in text:
                  raise SystemExit(f'{path}: old target missing')
              p.write_text(text.replace('control-v6.0.2','control-v6.0.3').replace('v6.0.2','v6.0.3'),encoding='utf-8')

          p=Path('deploy/node-control-agent.sh')
          text=p.read_text(encoding='utf-8')
          if text.count('control-v6.0.2') < 2:
              raise SystemExit('node-control-agent: expected current target/bootstrap markers')
          p.write_text(text.replace('control-v6.0.2','control-v6.0.3'),encoding='utf-8')

          gateway=Path('deploy/xsp-v2-product-gateway/main.go')
          g=gateway.read_text(encoding='utf-8')
          g=g.replace('targetAgentVersion     = "control-v6.0.2"','targetAgentVersion     = "control-v6.0.3"',1)
          g=g.replace('previousAgentVersion   = "control-v6.0.1"','previousAgentVersion   = "control-v6.0.2"',1)
          gateway.write_text(g,encoding='utf-8')

          check=Path('scripts/check-agent-update.js')
          c=check.read_text(encoding='utf-8')
          c=c.replace("assert.equal(agentVersionRaw,'control-v6.0.2','Nexus target Agent version must be control-v6.0.2');","assert.equal(agentVersionRaw,'control-v6.0.3','Nexus target Agent version must be control-v6.0.3');",1)
          c=c.replace('targetAgentVersion\\s*=\\s*"control-v6[.]0[.]2"','targetAgentVersion\\s*=\\s*"control-v6[.]0[.]3"',1)
          c=c.replace('previousAgentVersion\\s*=\\s*"control-v6[.]0[.]1"','previousAgentVersion\\s*=\\s*"control-v6[.]0[.]2"',1)
          check.write_text(c,encoding='utf-8')

          base=Path('scripts/check-agent-update-base.js')
          b=base.read_text(encoding='utf-8').replace('control-v6.0.2','control-v6.0.3').replace('control-v6[.]0[.]2','control-v6[.]0[.]3')
          base.write_text(b,encoding='utf-8')
          PY
          bash -n deploy/node-control-agent.sh deploy/update-node-control-agent.sh deploy/install-node-metrics-agent.sh
          node scripts/check-agent-update.js
          git diff --check
      - name: Commit bounded alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-v603-temp-root-autopatch.yml
          git add -A
          git commit -m 'release(agent): target control-v6.0.3 for private TMPDIR repair'
          git push origin HEAD:fix/agent-v6.0.3-private-tmp
