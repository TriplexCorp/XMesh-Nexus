name: Quota V2 installed two-Node Genesis signed cap and lease recovery (disposable)
on:
  pull_request:
    paths:
      - 'backend/src/quota_v2*.rs'
      - 'backend/src/quota_v2_cap_delivery/**'
      - 'backend/src/quota_wal_transport/**'
      - 'backend/src/quota_xray_genesis.rs'
      - 'backend/src/node_runtime_legacy.rs'
      - 'backend/src/main.rs'
      - 'backend/src/bin/quota_v2_ci_signed_cap.rs'
      - 'backend/Cargo.toml'
      - 'backend/migrations/014*.sql'
      - 'backend/migrations/015*.sql'
      - 'backend/migrations/016*.sql'
      - 'deploy/xsp-v2-product-gateway/**'
      - 'scripts/run-quota-wal-transport-audit.sh'
      - 'scripts/test-quota-wal-installed.py'
      - 'scripts/test-quota-wal-product-tunnel.py'
      - 'scripts/quota_v2_installed_genesis_lease.py'
      - 'scripts/quota_v2_installed_live_vless.py'
      - 'scripts/quota_v2_installed_generations*.py'
      - 'scripts/quota_v2_release_candidate.py'
      - 'scripts/test-quota-v2-release-candidate.py'
      - 'scripts/quota-wal-systemd.Dockerfile'
      - '.github/workflows/quota-v2-installed-genesis-leases.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  installed-leases:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [lease-recovery, managed-generations, agent-sigkill]
    timeout-minutes: 50
    env:
      XMESH_AUDIT_DISPOSABLE: '1'
      XMESH_TEST_INSTALLED_GENERATIONS: ${{ matrix.scenario != 'lease-recovery' && '1' || '0' }}
      XMESH_TEST_INSTALLED_CRASHES: ${{ matrix.scenario == 'agent-sigkill' && '1' || '0' }}
      XMESH_TEST_INSTALLED_REBOOT: ${{ matrix.scenario == 'lease-recovery' && '1' || '0' }}
      XMESH_INSTALLED_NODE_REF: af27466877f0268ee8198fab9ba132c0075e156d
      XMESH_INSTALLED_GENESIS_LEASE: '1'
      QUOTA_TEST_DSN: postgresql://quota_test:quota_test_disposable@127.0.0.1:5432/quota_wal_installed
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: timescale/timescaledb:2.30.0-pg18
        env:
          POSTGRES_USER: quota_test
          POSTGRES_PASSWORD: quota_test_disposable
          POSTGRES_DB: quota_wal_installed
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8
        ports: ['127.0.0.1:6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TriplexCorp/XMesh-Node
          ref: af27466877f0268ee8198fab9ba132c0075e156d
          path: .ci-reviewed-node
          persist-credentials: false
      - name: Verify exact draft Agent source
        run: |
          test "$(git -C .ci-reviewed-node rev-parse HEAD)" = 'af27466877f0268ee8198fab9ba132c0075e156d'
          test "$(cat .ci-reviewed-node/AGENT_VERSION)" = 'control-v6.0.27'
          python3 scripts/test-quota-v2-release-candidate.py
          python3 -m py_compile scripts/quota_v2_release_candidate.py scripts/test-quota-wal-installed.py scripts/quota_v2_installed_genesis_lease.py scripts/quota_v2_installed_live_vless.py scripts/quota_v2_installed_generations.py scripts/quota_v2_installed_generations_faults.py scripts/quota_v2_installed_generations_client.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the real Nexus API
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo build --manifest-path backend/Cargo.toml --bin xmesh-api
      - name: Build the pinned older Nexus for schema downgrade verification
        if: matrix.scenario == 'agent-sigkill'
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/nexus-before-generations"
          revision=cf7a3092dbe4f18abd383e228c5cbc461ec07972
          git fetch --depth=1 origin "$revision"
          git worktree add --detach "$old" FETCH_HEAD
          test "$(git -C "$old" rev-parse HEAD)" = "$revision"
          mv backend/target/debug/xmesh-api "$RUNNER_TEMP/xmesh-api-current"
          cargo build --manifest-path "$old/backend/Cargo.toml" --target-dir "$PWD/backend/target" --bin xmesh-api
          mv backend/target/debug/xmesh-api "$RUNNER_TEMP/xmesh-api-before-generations"
          mv "$RUNNER_TEMP/xmesh-api-current" backend/target/debug/xmesh-api
          echo "XMESH_TEST_OLD_NEXUS=$RUNNER_TEMP/xmesh-api-before-generations" >> "$GITHUB_ENV"
      - name: Prepare disposable test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/quota-wal"
          "$RUNNER_TEMP/quota-wal/bin/pip" install 'psycopg[binary]==3.2.3'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .ci-reviewed-node/agent/xspv2/go.mod
          cache: false
      - name: Build the reviewed instrumented Xray and record its binary hash
        env:
          GOTOOLCHAIN: go1.27.4
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/xray-source"
          bundle="$RUNNER_TEMP/xray-image"
          git init "$source"
          git -C "$source" fetch --depth=1 https://github.com/XTLS/Xray-core.git a4a3dff5b20c2faae567b742c172c7b95e75c083
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = a4a3dff5b20c2faae567b742c172c7b95e75c083
          python3 .ci-reviewed-node/experiments/xray-dataplane-fence/apply-experiment.py "$source"
          mkdir "$bundle"
          (cd "$source" && CGO_ENABLED=0 go build -trimpath -o "$bundle/xray" ./main)
          printf 'FROM scratch\nCOPY xray /xray\nENTRYPOINT ["/xray"]\n' > "$bundle/Dockerfile"
          docker build --iidfile "$bundle/image-id" "$bundle"
          read -r hash _ < <(sha256sum "$bundle/xray")
          echo "Instrumented Xray SHA-256 $hash"
          echo "XMESH_WAL_XRAY_BINARY=$bundle/xray" >> "$GITHUB_ENV"
          echo "XMESH_WAL_XRAY_IMAGE=$(cat "$bundle/image-id")" >> "$GITHUB_ENV"
          echo "XMESH_WAL_XRAY_SHA256=$hash" >> "$GITHUB_ENV"
      - name: Require stable VLESS cutover across real successor network namespace
        env:
          XMESH_DISPOSABLE_XRAY_PATCH_EXPERIMENT: '1'
          XMESH_QUOTA_V2_CROSS_NETNS: '1'
        run: |
          set -euo pipefail
          # This is a disposable Node-signed dataplane test, NOT a claim
          # that the complete installed Nexus XSP/2 lifecycle is proven.
          if ! command -v ip >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq iproute2
          fi
          python3 .ci-reviewed-node/experiments/xray-dataplane-fence/test_xray_live_ingress_cutover.py "$XMESH_WAL_XRAY_BINARY"
      - name: Build real strict XSP/2 gateway fixture
        working-directory: deploy/xsp-v2-product-gateway
        run: go test -mod=readonly -c -o "$RUNNER_TEMP/wal-tunnel-fixture"
      - name: Two clean installed Nodes, real isolated Xray, signed VLESS caps, immutable reserve replay and PostgreSQL restart
        env:
          XMESH_WAL_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          XMESH_INSTALLED_NEXUS_REF: ${{ github.event.pull_request.head.sha }}
          XMESH_RELEASE_QUALIFICATION_SCENARIO: ${{ matrix.scenario }}
          XMESH_RELEASE_QUALIFICATION_EVIDENCE: ${{ runner.temp }}/quota-v2-release-qualification/installed-evidence.json
          XMESH_QUOTA_V2_NODE_CALENDAR_STAGING: '1'
          XMESH_QUOTA_V2_CDN_CALENDAR_STAGING: '1'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/quota-wal/bin/activate"
          export XMESH_WAL_TUNNEL_FIXTURE="$RUNNER_TEMP/wal-tunnel-fixture"
          bash scripts/run-quota-wal-transport-audit.sh backend/target/debug/xmesh-api --with-installed
      - name: Save exact installed Agent identity after successful scenario
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quota-v2-release-qualification-${{ matrix.scenario }}
          path: ${{ runner.temp }}/quota-v2-release-qualification/installed-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Save verified public quota evidence
        if: always() && matrix.scenario != 'lease-recovery'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quota-v2-generations-evidence-${{ matrix.scenario }}
          path: ${{ runner.temp }}/quota-v2-generations-evidence

  qualify-installed-matrix:
    name: Cross-scenario immutable Agent and Xray consistency (staging only)
    needs: installed-leases
    # GitHub treats a skipped required check as passing. Never skip the gate
    # when one of the three real two-Node scenarios fails.
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: All three installed scenarios must have passed
        env:
          INSTALLED_RESULT: ${{ needs.installed-leases.result }}
        run: test "$INSTALLED_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: quota-v2-release-qualification-*
          path: ${{ runner.temp }}/quota-v2-installed-matrix
          merge-multiple: false
      - name: Refuse mixed revisions, mixed binaries and incomplete matrix
        env:
          XMESH_INSTALLED_NEXUS_REF: ${{ github.event.pull_request.head.sha }}
          XMESH_INSTALLED_NODE_REF: af27466877f0268ee8198fab9ba132c0075e156d
          XMESH_INSTALLED_MATRIX_PATH: ${{ runner.temp }}/quota-v2-installed-matrix
        run: |
          set -euo pipefail
          python3 scripts/test-quota-v2-release-candidate.py
          python3 scripts/quota_v2_release_candidate.py \
            --matrix-only \
            --node-revision "$XMESH_INSTALLED_NODE_REF" \
            --nexus-revision "$XMESH_INSTALLED_NEXUS_REF" \
            --evidence \
              "$XMESH_INSTALLED_MATRIX_PATH/quota-v2-release-qualification-lease-recovery/installed-evidence.json" \
              "$XMESH_INSTALLED_MATRIX_PATH/quota-v2-release-qualification-managed-generations/installed-evidence.json" \
              "$XMESH_INSTALLED_MATRIX_PATH/quota-v2-release-qualification-agent-sigkill/installed-evidence.json" \
            | tee "$RUNNER_TEMP/quota-v2-matrix-consistency.json"
          # Matrix consistency is not a signed release or production authority.
      - name: Save staging-only cross-scenario consistency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quota-v2-installed-matrix-consistency
          path: ${{ runner.temp }}/quota-v2-matrix-consistency.json
          if-no-files-found: error
          retention-days: 30
