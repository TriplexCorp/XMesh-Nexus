name: XSP-v2 Final Release Canary v2

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/xsp-v2-final-release-canary-v2.contract.json"
      - ".github/workflows/xsp-v2-final-release-canary-v2.yml"
  push:
    branches: [main]
    paths:
      - "deploy/xsp-v2-final-release-canary-v2.contract.json"
      - ".github/workflows/xsp-v2-final-release-canary-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xsp-v2-final-release-canary-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NEXUS_REVISION: 12b3170996bc062ee16c79659a6378e5e425fd0e
  RELEASE_NODE_REVISION: 34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb
  SECURITY_REVIEW_SHA256: 9248968847310be749d79da79cf692767ca3d04b806da06ce97a3d8cf871f92c
  KVM_DURABILITY_RESULT_SHA256: fd8ef8e680e999bb95ef5b081806eb24a32f1537a7d1f6cd678ecd41591c6a0f
  PROVIDER_STORAGE_ACCEPTANCE_SHA256: 49a311a8bf871c6afcaa5841622b9f1e28e74675452671abc4e970f644dec604

jobs:
  source-contract:
    name: Exact candidate and accepted security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final-canary v2 contract and accepted AI-assisted review
        run: |
          set -Eeuo pipefail
          python3 -m json.tool deploy/xsp-v2-final-release-canary-v2.contract.json >/dev/null
          python3 scripts/verify-xsp-v2-p0e-ai-assisted-security-review-result.py \
            --result deploy/xsp-v2-p0e-ai-assisted-security-review-result.json \
            --require-closure-eligible >/tmp/security-review-verification.json
          test "$(sha256sum deploy/xsp-v2-p0e-ai-assisted-security-review-result.json | awk '{print $1}')" = "$SECURITY_REVIEW_SHA256"
          python3 - <<'PY'
          import json,os
          c=json.load(open('deploy/xsp-v2-final-release-canary-v2.contract.json'))
          assert c['schema']=='xsp2-final-release-canary-contract-2'
          assert c['resultSchema']=='xsp2-final-release-canary-result-2'
          assert c['releaseCandidate']=={
            'nexusRevision':os.environ['RELEASE_NEXUS_REVISION'],
            'nodeRevision':os.environ['RELEASE_NODE_REVISION'],
          }
          assert c['prerequisiteEvidence']=={
            'securityAssuranceModel':'ai-assisted-internal-plus-release-owner-risk-acceptance',
            'securityReviewResultSha256':os.environ['SECURITY_REVIEW_SHA256'],
            'kvmDurabilityResultSha256':os.environ['KVM_DURABILITY_RESULT_SHA256'],
            'providerStorageAcceptanceSha256':os.environ['PROVIDER_STORAGE_ACCEPTANCE_SHA256'],
          }
          assert c['requiredDomains']==[
            'install-upgrade-lost-response-restart-rollback',
            'coordinated-backup-restore-recovery',
            'node-local-redacted-observability',
            'nexus-durable-redacted-observability',
          ]
          assert c['successState']=={
            'finalCanaryPassed':True,
            'productionExecutionPerformed':False,
            'legacyProtocolRetired':False,
          }
          v=json.load(open('/tmp/security-review-verification.json'))
          assert v['closureEligible'] is True
          assert v['reviewerIndependent'] is False
          assert v['releaseOwnerRiskAccepted'] is True
          assert v['requiresRefreeze'] is False
          PY

  agent-lifecycle:
    name: Real install, upgrade, retry, restart and rollback
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      agent_artifact_sha256: ${{ steps.candidate.outputs.agent_artifact_sha256 }}
      nexus_image_sha256: ${{ steps.candidate.outputs.nexus_image_sha256 }}
    env:
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_DB_PASSWORD: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      REDIS_PASSWORD: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: 9876543210abcdef9876543210abcdef9876543210abcdef9876543210abcdef
      TOTP_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      SUBSCRIPTION_ENCRYPTION_KEY: "1234567812345678123456781234567812345678123456781234567812345678"
      COOKIE_SECURE: "false"
      DASHBOARD_PATH: /dashboard/0123456789abcdef0123456789abcdef0123456789abcdef
      XSP_V2_P0D_AGENT_MIGRATION: staging-only
      P0D_NODE_SOURCE_REVISION: 34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb
      P0D_AGENT_VERSION_A: final-canary-candidate
      P0D_AGENT_VERSION_B: final-canary-rollback-probe
    steps:
      - name: Check out exact reviewed XMesh-Nexus runtime
        uses: actions/checkout@v4
        with:
          ref: 12b3170996bc062ee16c79659a6378e5e425fd0e
      - name: Check out exact reviewed XMesh-Node source
        uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb
          path: xmesh-node
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify exact source revisions and build Agent artifacts
        working-directory: xmesh-node/agent/xspv2
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P0D_NODE_SOURCE_REVISION"
          test "$(go version | awk '{print $3}')" = "go1.27.3"
          go test ./... -count=1
          go build -trimpath -ldflags "-X main.version=$P0D_AGENT_VERSION_A -X main.sourceRevision=$P0D_NODE_SOURCE_REVISION" -o /tmp/xmesh-agent-a ./cmd/xmesh-agent-xspv2
          go build -trimpath -ldflags "-X main.version=$P0D_AGENT_VERSION_B -X main.sourceRevision=$P0D_NODE_SOURCE_REVISION" -o /tmp/xmesh-agent-b ./cmd/xmesh-agent-xspv2
          /tmp/xmesh-agent-a --identity
          /tmp/xmesh-agent-b --identity
      - name: Populate content-addressed disposable artifact source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_NEXUS_REVISION"
          mkdir -p deploy/runtime/xsp-v2-agent-artifacts
          digest_a="$(sha256sum /tmp/xmesh-agent-a | awk '{print $1}')"
          digest_b="$(sha256sum /tmp/xmesh-agent-b | awk '{print $1}')"
          test "$digest_a" != "$digest_b"
          install -m 0755 /tmp/xmesh-agent-a "deploy/runtime/xsp-v2-agent-artifacts/$digest_a.bin"
          install -m 0755 /tmp/xmesh-agent-b "deploy/runtime/xsp-v2-agent-artifacts/$digest_b.bin"
          printf '%s\n' "$DASHBOARD_PATH" > deploy/runtime/dashboard-path
          chmod 0666 deploy/runtime/dashboard-path
          echo "P0D_AGENT_ARTIFACT_A=$PWD/deploy/runtime/xsp-v2-agent-artifacts/$digest_a.bin" >> "$GITHUB_ENV"
          echo "P0D_AGENT_ARTIFACT_B=$PWD/deploy/runtime/xsp-v2-agent-artifacts/$digest_b.bin" >> "$GITHUB_ENV"
          printf '%s\n' "$digest_b" | sudo tee /tmp/xmesh-p0d-e2e-fail-digest >/dev/null
          sudo install -o root -g root -m 0755 scripts/xsp-agent-e2e-sha256sum /usr/local/bin/sha256sum
      - name: Start exact disposable Nexus
        run: docker compose up --build -d
      - name: Wait for disposable Nexus readiness
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null && exit 0
            sleep 2
          done
          docker compose logs --tail=180 panel
          exit 1
      - name: Bind candidate artifact and Nexus image digests
        id: candidate
        run: |
          set -Eeuo pipefail
          agent="$(sha256sum /tmp/xmesh-agent-a | awk '{print $1}')"
          image_id="$(docker compose images -q panel | head -n1)"
          test -n "$image_id"
          image="$(docker image inspect "$image_id" --format '{{.Id}}')"
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$agent" =~ ^[0-9a-f]{64}$ ]]
          echo "agent_artifact_sha256=$agent" >> "$GITHUB_OUTPUT"
          echo "nexus_image_sha256=$image" >> "$GITHUB_OUTPUT"
          echo "candidate agent=$agent"
          echo "candidate nexus image=$image"
      - name: Reuse real signed Agent migration lifecycle proof
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/test-xsp-agent-real-e2e.py
          bash -n deploy/xsp-v2-agent-staged-apply.sh
          python3 scripts/test-xsp-agent-real-e2e.py
      - name: Prove migration gate returns to default-off
        run: |
          set -Eeuo pipefail
          XSP_V2_P0D_AGENT_MIGRATION= docker compose up -d --no-deps --force-recreate panel
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null && break
            sleep 1
          done
          test "$(docker compose exec -T panel sh -c 'printf %s "$XSP_V2_P0D_AGENT_MIGRATION"')" = ""
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --tail=240
      - name: Destroy disposable lifecycle environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  coordinated-recovery:
    name: Real coordinated backup and restore recovery
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out exact reviewed XMesh-Nexus runtime
        uses: actions/checkout@v4
        with:
          ref: 12b3170996bc062ee16c79659a6378e5e425fd0e
      - name: Check out exact reviewed XMesh-Node source
        uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb
          path: xmesh-node
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify exact Nexus checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_NEXUS_REVISION"
      - name: Re-run exact-candidate Agent regression before recovery
        working-directory: xmesh-node/agent/xspv2
        run: go test ./... -count=1
      - name: Reuse real E3b coordinated backup/restore proof
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py
          python3 scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py --node-repo xmesh-node

  redacted-observability:
    name: Node-local and Nexus durable-state observability
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xmesh_canary_observe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xmesh_canary_observe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xmesh_canary_observe
      NODE_REPO: xmesh-node
    steps:
      - name: Check out exact reviewed XMesh-Nexus runtime
        uses: actions/checkout@v4
        with:
          ref: 12b3170996bc062ee16c79659a6378e5e425fd0e
      - name: Check out exact reviewed XMesh-Node source
        uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb
          path: xmesh-node
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact Nexus checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_NEXUS_REVISION"
      - name: Prove both observability surfaces remain default-off, read-only and redacted
        run: bash scripts/test-xsp-v2-canary-observability.sh

  final-result:
    name: Emit final canary evidence
    needs: [source-contract, agent-lifecycle, coordinated-recovery, redacted-observability]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every exact-candidate canary domain to pass
        env:
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          LIFECYCLE_RESULT: ${{ needs.agent-lifecycle.result }}
          RECOVERY_RESULT: ${{ needs.coordinated-recovery.result }}
          OBSERVABILITY_RESULT: ${{ needs.redacted-observability.result }}
          AGENT_ARTIFACT_SHA256: ${{ needs.agent-lifecycle.outputs.agent_artifact_sha256 }}
          NEXUS_IMAGE_SHA256: ${{ needs.agent-lifecycle.outputs.nexus_image_sha256 }}
          HARNESS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$SOURCE_RESULT" = success
          test "$LIFECYCLE_RESULT" = success
          test "$RECOVERY_RESULT" = success
          test "$OBSERVABILITY_RESULT" = success
          [[ "$AGENT_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$NEXUS_IMAGE_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          cat > final-release-canary-result-v2.json <<JSON
          {
            "schema": "xsp2-final-release-canary-result-2",
            "harnessRevision": "$HARNESS_REVISION",
            "releaseCandidate": {
              "nexusRevision": "$RELEASE_NEXUS_REVISION",
              "nodeRevision": "$RELEASE_NODE_REVISION",
              "nexusImageSha256": "$NEXUS_IMAGE_SHA256",
              "agentArtifactSha256": "$AGENT_ARTIFACT_SHA256"
            },
            "prerequisiteEvidence": {
              "securityReviewResultSha256": "$SECURITY_REVIEW_SHA256",
              "kvmDurabilityResultSha256": "$KVM_DURABILITY_RESULT_SHA256",
              "providerStorageAcceptanceSha256": "$PROVIDER_STORAGE_ACCEPTANCE_SHA256"
            },
            "domains": {
              "sourceContract": "$SOURCE_RESULT",
              "agentLifecycle": "$LIFECYCLE_RESULT",
              "coordinatedRecovery": "$RECOVERY_RESULT",
              "redactedObservability": "$OBSERVABILITY_RESULT"
            },
            "finalCanaryPassed": true,
            "productionExecutionPerformed": false,
            "legacyProtocolRetired": false
          }
          JSON
          python3 -m json.tool final-release-canary-result-v2.json >/dev/null
          cat final-release-canary-result-v2.json
          sha256sum final-release-canary-result-v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: xsp-v2-final-release-canary-result-v2
          path: final-release-canary-result-v2.json
          if-no-files-found: error
          retention-days: 30
