name: Temporary P0-E3b DB resource fix

on:
  push:
    branches: [feat/xsp-v2-p0e3b-coordinated-backup-restore]
    paths: [".github/workflows/tmp-p0e3b-db-resource-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xsp-v2-p0e3b-coordinated-backup-restore
      - name: Bound disposable TimescaleDB and make cleanup robust
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py"); s=p.read_text(); old="                \"-e\", \"TIMESCALEDB_TELEMETRY=off\",\n                \"timescale/timescaledb:2.30.0-pg18\","; new="                \"-e\", \"TIMESCALEDB_TELEMETRY=off\",\n                \"-e\", \"TS_TUNE_MEMORY=512MB\",\n                \"-e\", \"TS_TUNE_NUM_CPUS=2\",\n                \"timescale/timescaledb:2.30.0-pg18\","; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          python3 -c 'from pathlib import Path; p=Path("scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py"); s=p.read_text(); old="with tempfile.TemporaryDirectory(prefix=\"xsp-p0e3b-\") as tmp_raw:"; new="with tempfile.TemporaryDirectory(prefix=\"xsp-p0e3b-\", ignore_cleanup_errors=True) as tmp_raw:"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          python3 -m py_compile scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py
          git diff --check
      - name: Commit resource fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py
          git commit -m 'fix(xsp-v2): bound E3b disposable DB resources'
          git push origin HEAD:feat/xsp-v2-p0e3b-coordinated-backup-restore
