name: One-time Rust formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rustfmt-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply repository Rust formatting
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --all
          git diff --check
          if git diff --quiet -- backend; then
            echo "All Rust files are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'backend/**/*.rs'
          git commit -m "style(rust): apply rustfmt to backend"
          git push origin HEAD:main
