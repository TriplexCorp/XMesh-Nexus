name: Temporary JS regression diagnosis
# Recheck node-editor layout semantics after managed TLS grouping
on:
  push:
    branches:
      - fix/backend-ci-finalmask-and-format-20261026
    paths:
      - .github/workflows/js-regression-diagnosis.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Evaluate all committed frontend regression scripts independently
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,sys
          workflow=pathlib.Path('.github/workflows/backend-ci.yml').read_text()
          tests=re.findall(r'run: node (scripts/[\w.-]+\.js)',workflow)
          failed=[]
          for path in dict.fromkeys(tests):
              result=subprocess.run(['node',path],text=True,capture_output=True)
              if result.returncode:
                  failed.append(path)
                  print('\nFAIL:',path,'\n',result.stdout[-1000:],result.stderr[-3000:],flush=True)
              else:
                  print('PASS:',path,flush=True)
          print('\nTOTAL',len(tests),'FAILED',len(failed),'\n'+'\n'.join(failed),flush=True)
          sys.exit(bool(failed))
          PY
