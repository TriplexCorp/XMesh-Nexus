name: Temporary P0-E canary rehearsal docs sync

on:
  push:
    branches:
      - docs/p0e-canary-rehearsal-checkpoint

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0e-canary-rehearsal-checkpoint
          fetch-depth: 0

      - name: Patch authoritative docs
        run: python3 scripts/tmp_sync_p0e_canary_rehearsal_docs.py

      - name: Verify, self-clean and push
        run: |
          git diff --check
          rm .github/workflows/tmp-sync-p0e-canary-rehearsal-docs.yml
          rm scripts/tmp_sync_p0e_canary_rehearsal_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md docs/ENTERPRISE_ROADMAP.md .github/workflows/tmp-sync-p0e-canary-rehearsal-docs.yml scripts/tmp_sync_p0e_canary_rehearsal_docs.py
          git diff --cached --check
          git commit -m "docs(xsp-v2): checkpoint disposable canary rehearsal"
          git push origin HEAD:docs/p0e-canary-rehearsal-checkpoint
