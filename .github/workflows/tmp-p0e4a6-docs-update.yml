name: Temporary P0-E4a6 Docs Update

on:
  push:
    branches:
      - docs/p0e4a6-checkpoint-physical-runs-current

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply asserted documentation update
        run: |
          set -euo pipefail
          python3 scripts/tmp-p0e4a6-docs-update.py
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "README.en.md" -o "${changed[0]}" = "README.md" -o "${changed[0]}" = "docs/ENTERPRISE_ROADMAP.md"
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' README.en.md README.md docs/ENTERPRISE_ROADMAP.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit documentation checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md docs/ENTERPRISE_ROADMAP.md
          git commit -m 'docs(xsp-v2): checkpoint P0-E4a6 and keep physical qualification open'
          git push origin HEAD:docs/p0e4a6-checkpoint-physical-runs-current
