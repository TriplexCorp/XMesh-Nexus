name: Temporary P0-E3b docs checkpoint

on:
  push:
    branches: [docs/p0e3b-checkpoint-p0e4a-current]
    paths:
      - "scripts/tmp-update-p0e3b-docs.py"
      - ".github/workflows/tmp-p0e3b-docs-checkpoint.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0e3b-checkpoint-p0e4a-current
      - name: Update README and Roadmap checkpoint
        run: |
          set -euo pipefail
          python3 scripts/tmp-update-p0e3b-docs.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' README.en.md README.md docs/ENTERPRISE_ROADMAP.md | sort)"
          test "$changed" = "$expected"
          git config user.name "Xmesh Creator"
          git config user.email "Aselis3d@gmail.com"
          git add README.md README.en.md docs/ENTERPRISE_ROADMAP.md
          git diff --cached --quiet && { echo 'no docs changes' >&2; exit 1; }
          git commit -m "docs(xsp-v2): checkpoint P0-E3b and start P0-E4a"
          git push origin HEAD:docs/p0e3b-checkpoint-p0e4a-current
