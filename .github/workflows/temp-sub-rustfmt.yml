name: Temporary Sub Rust formatter
on:
  push:
    branches: [feat/managed-sub-server-updates]
permissions:
  contents: write
jobs:
  format-sub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/managed-sub-server-updates
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format new Sub API module
        run: rustfmt --edition 2024 backend/src/sub_server.rs
      - name: Commit formatting only
        run: |
          git add backend/src/sub_server.rs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(sub): format new management API module"
          git push origin HEAD:feat/managed-sub-server-updates
