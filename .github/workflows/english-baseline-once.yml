name: One-shot English baseline synchronization
on:
  push:
    branches:
      - fix/backend-ci-finalmask-and-format-20261026
    paths:
      - .github/workflows/english-baseline-once.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile recorded translation debt with current UI
        run: |
          node scripts/check-english-coverage.js --update-baseline
          git add scripts/english-coverage-baseline.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Synchronize current English localization debt baseline"
            git push origin HEAD:refs/heads/fix/backend-ci-finalmask-and-format-20261026
          fi
