name: Quota v2 signed two-node API acceptance
on:
  pull_request:
    paths:
      - 'backend/src/quota_v2.rs'
      - 'backend/src/node_runtime_legacy.rs'
      - 'backend/src/main.rs'
      - 'backend/migrations/0130_quota_v2_authenticated_protocol_observations.sql'
      - 'backend/migrations/0131_quota_v2_authenticated_agent_release_observations.sql'
      - 'docs/QUOTA_V2_FLEET_READINESS.md'
      - 'backend/migrations/0125_quota_v2_reservations.sql'
      - 'backend/migrations/0132_quota_v2_terminal_settlement_quarantine.sql'
      - 'deploy/node-metrics-agent.sh'
      - 'scripts/test-quota-v2-e2e.py'
      - 'scripts/test-quota-v2-flag-transition.py'
      - '.github/workflows/quota-v2-e2e.yml'
permissions:
  contents: read
jobs:
  signed-two-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      XMESH_AUDIT_DISPOSABLE: '1'
      XMESH_TEST_URL: http://127.0.0.1:8080
      COMPOSE_PROJECT_NAME: xmesh-quota-v2
      XMESH_QUOTA_V2_ENABLED: '1'
      ADMIN_USERNAME: audit-owner
      COOKIE_SECURE: 'false'
      PANEL_DOMAIN: ci.example.invalid
      DASHBOARD_PATH: /dashboard/quota-v2-disposable
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - name: Check out the proposed Nexus implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out pinned matching Node v2 guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: TriplexCorp/XMesh-Node
          ref: e110052345c1e0a89d793f7061326bbbf7687240
          path: node-agent
      - name: Pin compatible Agent and guard for quota-v2 rehearsal
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C node-agent rev-parse HEAD)" = "e110052345c1e0a89d793f7061326bbbf7687240"
          test "$(tr -d '\r\n' < node-agent/AGENT_VERSION)" = "control-v6.0.27"
          test -f node-agent/deploy/xmesh-policy-guard.py
          test -f node-agent/deploy/xmesh-policy-guard-base.py
          test -f node-agent/experiments/xray-dataplane-fence/durable_fence.go.txt
          test -f node-agent/experiments/xray-dataplane-fence/durable_counter_taint.go.txt
          test -f node-agent/experiments/xray-dataplane-fence/durable_counter_taint_test.go.txt
          test -f node-agent/experiments/xray-dataplane-fence/meter_floor.py
          test -f node-agent/experiments/xray-dataplane-fence/test_meter_floor.py
          test -f node-agent/experiments/xray-dataplane-fence/observed_checkpoint.go.txt
          python3 -m py_compile node-agent/deploy/xmesh-policy-guard.py node-agent/deploy/xmesh-policy-guard-base.py
          python3 node-agent/experiments/xray-dataplane-fence/test_meter_floor.py
          python3 node-agent/experiments/xray-dataplane-fence/test_signed_nonfinal_observation.py
          test -f node-agent/scripts/quota-v2-local-audit.py
          python3 -m py_compile node-agent/scripts/quota-v2-local-audit.py
          # Fail cutover on STOPPED managed containers even when Docker ps --all lists their names.
          python3 node-agent/tests/test_quota_v2_local_audit.py
          # The signed v1 policy is normal while the production flag is 0;
          # both runtime-only and applied-v2 CLI phases have independent tests.
          python3 node-agent/tests/test_quota_v2_offline_policy_cutoff.py
          # Node 6.0.24 also rejects any stale user rollback after an early failure.
          python3 node-agent/tests/test_quota_v2_prestop_capture.py
          echo 'Pinned reviewed Node control-v6.0.27: strict nonfinal meter invariants; refunds remain disabled'
      - name: Generate disposable secrets and feature-gated service
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD REDIS_PASSWORD ADMIN_PASSWORD TOTP_ENCRYPTION_KEY SUBSCRIPTION_ENCRYPTION_KEY XSP_V2_PRODUCT_INTERNAL_TOKEN; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          mkdir -p deploy/runtime
          printf '%s\n' "$DASHBOARD_PATH" > deploy/runtime/dashboard-path
          chmod 0666 deploy/runtime/dashboard-path
          cat >compose.override.yaml <<'YAML'
          services:
            panel:
              environment:
                XMESH_QUOTA_V2_ENABLED: "1"
          YAML
      - name: Build real API and isolated backing stores
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose up --build -d db redis panel
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs --tail=120 panel
          exit 1
      - name: Test real Ed25519 Nexus API, separate Node guards and PostgreSQL conservation
        run: |
          set -Eeuo pipefail
          test "$XMESH_TEST_URL" = http://127.0.0.1:8080
          test "$XMESH_AUDIT_DISPOSABLE" = 1
          python3 scripts/test-quota-v2-e2e.py
      - name: Reset ONLY disposable PostgreSQL volumes for flag-transition rehearsal
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$XMESH_AUDIT_DISPOSABLE" = 1
          test "$COMPOSE_PROJECT_NAME" = xmesh-quota-v2
          # The full two-node test above has durable v2 reservations. Start
          # another EMPTY disposable ledger to exercise initial feature=0.
          # Otherwise the new permanent rollback latch rightly forbids v1.
          docker compose down --volumes --remove-orphans
          docker compose up -d db redis panel
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs --tail=120 panel
          exit 1
      - name: Rehearse v1-to-v2 and reject unsafe flag rollback against persisted Node
        run: |
          set -Eeuo pipefail
          test "$XMESH_AUDIT_DISPOSABLE" = 1
          python3 -m py_compile scripts/test-quota-v2-flag-transition.py
          python3 scripts/test-quota-v2-flag-transition.py
      - name: Collect failure diagnostics
        if: failure()
        run: docker compose logs --tail=160
      - name: Destroy disposable services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
