name: XSP-v2 P0-E Independent Security Review Result Contract

on:
  pull_request:
    paths:
      - "deploy/xsp-v2-p0e-independent-security-review-result.contract.json"
      - "scripts/verify-xsp-v2-p0e-independent-security-review-result.py"
      - "docs/XSP_V2_P0E_INDEPENDENT_SECURITY_REVIEW_RESULT.md"
      - ".github/workflows/xsp-p0e-independent-security-review-result.yml"
  push:
    branches: [main]
    paths:
      - "deploy/xsp-v2-p0e-independent-security-review-result.contract.json"
      - "scripts/verify-xsp-v2-p0e-independent-security-review-result.py"
      - "docs/XSP_V2_P0E_INDEPENDENT_SECURITY_REVIEW_RESULT.md"
      - ".github/workflows/xsp-p0e-independent-security-review-result.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-result-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile verifier and validate exact v5 KVM acceptance binding
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify-xsp-v2-p0e-independent-security-review-result.py
          python3 - <<'PY'
          import json
          x=json.load(open('deploy/xsp-v2-p0e-independent-security-review-result.contract.json'))
          assert x['schema']=='xsp2-p0e-independent-security-review-result-contract-1'
          assert x['resultSchema']=='xsp2-p0e-independent-security-review-result-1'
          assert x['frozenTarget']=={
            'nexus':{
              'repository':'TriplexCorp/XMesh-Nexus',
              'sourceRevision':'12b3170996bc062ee16c79659a6378e5e425fd0e',
            },
            'node':{
              'repository':'TriplexCorp/XMesh-Node',
              'sourceRevision':'34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb',
            },
          }
          assert x['reviewerBundle']=={
            'workflowRun':41054352179,
            'deterministicTarSha256':'9d213e9281f0ffbbc3da21f9f3814d6e7fbef1e6b5273f6e9cb12175c63273c4',
            'payloadSha256':'7b118084777d59e1ef1791d6375c32c1c44cf6bcdf9a03a2b0648a7ad9f263f2',
          }
          assert len(x['requiredReviewDomains'])==11
          assert len(set(x['requiredReviewDomains']))==11
          assert x['independentReviewRequired'] is True
          assert x['automaticIssueClosure'] is False
          assert x['closurePolicy']=={
            'eligibleDecisions':['approve','approve-with-findings'],
            'allDomainsMustAvoidFail':True,
            'releaseBlockingFindingsMustBeRemediated':True,
            'securityRelevantCodeChangeRequiresRefreeze':True,
          }
          assert set(x['requiredFalseClaims'])=={
            'physicalPowerLossQualified','productionActivation','strictPQEnabled'
          }
          PY

      - name: Generate synthetic contract fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json
          from pathlib import Path

          c=json.load(open('deploy/xsp-v2-p0e-independent-security-review-result.contract.json'))
          domains=[{
            'domain': d,
            'disposition':'pass',
            'summary':f'Synthetic CI disposition for {d}.',
            'evidence':[f'synthetic-ci:{d}'],
          } for d in c['requiredReviewDomains']]
          base={
            'schema':c['resultSchema'],
            'target':copy.deepcopy(c['frozenTarget']),
            'reviewer':{
              'name':'Synthetic External Reviewer',
              'organization':'Synthetic Independent Review Lab',
              'independent':True,
            },
            'reviewDate':'2026-10-30',
            'reviewDomains':domains,
            'findings':[],
            'signoff':{
              'decision':'approve',
              'statement':'Synthetic contract fixture only; not a real security review.',
              'signerName':'Synthetic External Reviewer',
              'signerOrganization':'Synthetic Independent Review Lab',
              'signedAt':'2026-10-30T00:00:00Z',
            },
            'claims':{
              'physicalPowerLossQualified':False,
              'productionActivation':False,
              'strictPQEnabled':False,
            },
          }
          out=Path('/tmp/xsp-review-result-fixtures'); out.mkdir()
          def write(name,obj):
            (out/name).write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')

          write('eligible.json',base)

          rejection=copy.deepcopy(base)
          rejection['reviewDomains'][0]['disposition']='fail'
          rejection['signoff']['decision']='reject'
          rejection['findings']=[{
            'id':'SYN-001','severity':'high','status':'open',
            'releaseBlocking':True,'securityRelevantCodeChange':False,
            'title':'Synthetic release blocker',
            'domains':[c['requiredReviewDomains'][0]],
            'evidence':['synthetic-ci:finding'],
            'disposition':'Synthetic rejection fixture only.',
          }]
          write('rejection.json',rejection)

          wrong=copy.deepcopy(base); wrong['target']['nexus']['sourceRevision']='0'*40; write('wrong-sha.json',wrong)
          missing=copy.deepcopy(base); missing['reviewDomains'].pop(); write('missing-domain.json',missing)
          duplicate=copy.deepcopy(base); duplicate['reviewDomains'][-1]['domain']=duplicate['reviewDomains'][0]['domain']; write('duplicate-domain.json',duplicate)
          nonind=copy.deepcopy(base); nonind['reviewer']['independent']=False; write('non-independent.json',nonind)
          badclaim=copy.deepcopy(base); badclaim['claims']['strictPQEnabled']=True; write('bad-claim.json',badclaim)

          unresolved=copy.deepcopy(base)
          unresolved['signoff']['decision']='approve-with-findings'
          unresolved['findings']=[{
            'id':'SYN-002','severity':'medium','status':'open',
            'releaseBlocking':True,'securityRelevantCodeChange':False,
            'title':'Synthetic unresolved release blocker',
            'domains':[c['requiredReviewDomains'][1]],
            'evidence':['synthetic-ci:finding'],
            'disposition':'Synthetic unresolved fixture only.',
          }]
          write('unresolved-blocker.json',unresolved)

          refreeze=copy.deepcopy(base)
          refreeze['signoff']['decision']='approve-with-findings'
          refreeze['findings']=[{
            'id':'SYN-003','severity':'low','status':'remediated',
            'releaseBlocking':False,'securityRelevantCodeChange':True,
            'title':'Synthetic security-relevant remediation',
            'domains':[c['requiredReviewDomains'][2]],
            'evidence':['synthetic-ci:finding'],
            'disposition':'Synthetic changed-code fixture; must re-freeze.',
          }]
          write('requires-refreeze.json',refreeze)
          PY

      - name: Prove closure-eligible approval validates
        run: |
          set -euo pipefail
          python3 scripts/verify-xsp-v2-p0e-independent-security-review-result.py \
            --result /tmp/xsp-review-result-fixtures/eligible.json \
            --require-closure-eligible | tee /tmp/eligible.json
          grep -Fq '"closureEligible": true' /tmp/eligible.json
          grep -Fq '"reviewedDomainCount": 11' /tmp/eligible.json

      - name: Prove valid rejection cannot satisfy closure gate
        run: |
          set -euo pipefail
          python3 scripts/verify-xsp-v2-p0e-independent-security-review-result.py \
            --result /tmp/xsp-review-result-fixtures/rejection.json | tee /tmp/rejection.json
          grep -Fq '"validReviewResult": true' /tmp/rejection.json
          grep -Fq '"closureEligible": false' /tmp/rejection.json
          if python3 scripts/verify-xsp-v2-p0e-independent-security-review-result.py \
            --result /tmp/xsp-review-result-fixtures/rejection.json \
            --require-closure-eligible; then
            echo 'rejection unexpectedly satisfied closure gate' >&2
            exit 1
          fi

      - name: Prove malformed, stale and unsafe claims fail closed
        run: |
          set -euo pipefail
          for fixture in wrong-sha missing-domain duplicate-domain non-independent bad-claim; do
            if python3 scripts/verify-xsp-v2-p0e-independent-security-review-result.py \
              --result "/tmp/xsp-review-result-fixtures/${fixture}.json"; then
              echo "${fixture} unexpectedly validated" >&2
              exit 1
            fi
          done

      - name: Prove unresolved blocker and changed-code remediation cannot close
        run: |
          set -euo pipefail
          for fixture in unresolved-blocker requires-refreeze; do
            python3 scripts/verify-xsp-v2-p0e-independent-security-review-result.py \
              --result "/tmp/xsp-review-result-fixtures/${fixture}.json" \
              | tee "/tmp/${fixture}.json"
            grep -Fq '"closureEligible": false' "/tmp/${fixture}.json"
            if python3 scripts/verify-xsp-v2-p0e-independent-security-review-result.py \
              --result "/tmp/xsp-review-result-fixtures/${fixture}.json" \
              --require-closure-eligible; then
              echo "${fixture} unexpectedly satisfied closure gate" >&2
              exit 1
            fi
          done
          grep -Fq '"requiresRefreeze": true' /tmp/requires-refreeze.json

      - name: Verify v5 rebinding changes acceptance tooling only
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/xsp-p0e-independent-security-review-result.yml \
            deploy/xsp-v2-p0e-independent-security-review-result.contract.json \
            docs/XSP_V2_P0E_INDEPENDENT_SECURITY_REVIEW_RESULT.md | sort)"
          test "$changed" = "$expected"

      - name: State bounded evidence only
        run: |
          echo 'PASS: independent-review result acceptance is bound to the exact v5 KVM review package and authoritative post-merge reviewer bundle.'
          echo 'Synthetic fixtures are contract tests only; issue #137 still requires a real attributable independent result.'
          echo 'Issue #138 is the separate KVM five-run crash-consistency gate; physicalPowerLossQualified remains false for kvm-vps.'
          echo 'strict-pq remains OFF; production rollout remains NOT AUTHORIZED.'
