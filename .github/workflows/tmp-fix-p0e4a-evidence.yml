name: Temporary P0-E4a Evidence Fix

on:
  push:
    branches: [feat/xsp-v2-p0e4a-evidence-bundle]
    paths:
      - '.github/workflows/tmp-fix-p0e4a-evidence.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xsp-v2-p0e4a-evidence-bundle
      - name: Replace invalid os.stat_result helpers with stat predicates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/xsp-v2-p0e4a-evidence-bundle.py')
          s=p.read_text()
          assert s.count('import re\n') == 1
          assert s.count('not info.is_file()') == 1
          assert s.count('not root_info.is_dir()') == 1
          s=s.replace('import re\n','import re\nimport stat\n',1)
          s=s.replace('not info.is_file()','not stat.S_ISREG(info.st_mode)',1)
          s=s.replace('not root_info.is_dir()','not stat.S_ISDIR(root_info.st_mode)',1)
          p.write_text(s)
          PY
          python3 -m py_compile scripts/xsp-v2-p0e4a-evidence-bundle.py scripts/test-xsp-v2-p0e4a-evidence-bundle.py
          python3 scripts/test-xsp-v2-p0e4a-evidence-bundle.py -v
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'Xmesh Creator'
          git config user.email 'Aselis3d@gmail.com'
          git add scripts/xsp-v2-p0e4a-evidence-bundle.py
          git commit -m 'fix(xsp-v2): use stat predicates for evidence files'
          git push origin HEAD:feat/xsp-v2-p0e4a-evidence-bundle
