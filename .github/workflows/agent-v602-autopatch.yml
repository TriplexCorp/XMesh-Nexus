name: Agent v6.0.2 bounded autopatch

on:
  push:
    branches:
      - fix/agent-updater-bootstrap-v6.0.2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/agent-updater-bootstrap-v6.0.2
          fetch-depth: 0
      - name: Apply bounded repair patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          Path('AGENT_VERSION').write_text('control-v6.0.2\n',encoding='utf-8')
          replace('docs/AGENT_RELEASE_POLICY.md','Current target: **`control-v6.0.1`**.','Current target: **`control-v6.0.2`**.')
          replace('backend/src/node_runtime.rs','pub const CONTROL_AGENT_VERSION: &str = "control-v6.0.1";','pub const CONTROL_AGENT_VERSION: &str = "control-v6.0.2";')

          for path in ['deploy/install-node-metrics-agent.sh','deploy/update-node-control-agent.sh']:
              p=Path(path); text=p.read_text(encoding='utf-8')
              if 'v6.0.1' not in text:
                  raise SystemExit(f'{path}: v6.0.1 target not found')
              p.write_text(text.replace('v6.0.1','v6.0.2'),encoding='utf-8')

          agent=Path('deploy/node-control-agent.sh')
          text=agent.read_text(encoding='utf-8')
          if text.count('AGENT_VERSION="control-v6.0.1"') != 1:
              raise SystemExit('node-control-agent: unexpected Agent version marker count')
          text=text.replace('AGENT_VERSION="control-v6.0.1"','AGENT_VERSION="control-v6.0.2"')
          text=text.replace('for required in flock python3 sha256sum readlink timeout; do','for required in curl flock python3 sha256sum readlink systemd-run timeout; do',1)
          anchor=''' timeout 20 "$binary" --check-state "$base/xsp-v2" >/dev/null\n}\nstop_xray(){'''
          repair=''' timeout 20 "$binary" --check-state "$base/xsp-v2" >/dev/null\n}\nUPDATER_RESULT_UNIT=xmesh-node-agent-upgrade.service\nUPDATER_ERROR=''\nrun_agent_updater(){\n local static_unit=xmesh-node-agent-upgrade.service transient_unit=xmesh-node-agent-upgrade-repair\n local updater=/usr/local/sbin/xmesh-update-agent bootstrap='' rc=0\n UPDATER_ERROR=''\n if systemctl cat "$static_unit" >/dev/null 2>&1 && [[ -f "$updater" && ! -L "$updater" && -x "$updater" ]];then\n  UPDATER_RESULT_UNIT="$static_unit"\n  timeout 650 systemctl start --wait "$static_unit"\n  return $?\n fi\n install -d -m 0700 /run/xmesh-node-control || { UPDATER_ERROR='Cannot prepare Agent updater repair state';return 1; }\n if [[ ! -f "$updater" || -L "$updater" || ! -x "$updater" ]];then\n  bootstrap=/run/xmesh-node-control/update-node-control-agent.bootstrap\n  rm -f "$bootstrap"\n  if ! curl --proto '=https' --tlsv1.2 -fsSL --max-time 30 https://raw.githubusercontent.com/TriplexCorp/XMesh-Nexus/main/deploy/update-node-control-agent.sh -o "$bootstrap";then\n   UPDATER_ERROR='Agent updater missing and verified bootstrap download failed';return 1\n  fi\n  if ! bash -n "$bootstrap" || ! grep -Fq 'AGENT_VERSION="control-v6.0.2"' "$bootstrap" || ! grep -Fq 'xmesh-node-agent-upgrade.service' "$bootstrap";then\n   rm -f "$bootstrap";UPDATER_ERROR='Downloaded Agent updater failed bootstrap validation';return 1\n  fi\n  chmod 0700 "$bootstrap"\n  updater="$bootstrap"\n fi\n UPDATER_RESULT_UNIT="$transient_unit"\n systemctl reset-failed "$transient_unit" >/dev/null 2>&1 || true\n if timeout 650 systemd-run --quiet --wait --collect --pipe --unit="$transient_unit" \\\n  --property=Type=oneshot --property=TimeoutStartSec=650s \\\n  --property=NoNewPrivileges=true --property=PrivateTmp=true \\\n  --property=ProtectSystem=strict --property=ProtectHome=true \\\n  --property=ProtectKernelModules=true --property=ProtectKernelTunables=true \\\n  --property=ProtectControlGroups=true --property=RestrictSUIDSGID=true \\\n  --property=LockPersonality=true \\\n  --property=ReadWritePaths=/usr/local/sbin --property=ReadWritePaths=/usr/local/bin \\\n  --property=ReadWritePaths=/usr/local/libexec --property=ReadWritePaths=/etc/systemd/system \\\n  --property=ReadWritePaths=/var/lib/xmesh-node-control --property=ReadWritePaths=/var/lib/xmesh-xray-sync \\\n  --property=ReadWritePaths=/var/lib/xmesh-agent --property=ReadWritePaths=-/opt/xmesh-node \\\n  --property=ReadWritePaths=-/root/XMesh-Node --property=ReadWritePaths=/run \\\n  "$updater" --remote;then\n  rc=0\n else\n  rc=$?\n  UPDATER_ERROR='Agent updater repair service failed; inspect xmesh-node-agent-upgrade-repair'\n fi\n [[ -z "$bootstrap" ]] || rm -f "$bootstrap"\n return "$rc"\n}\nstop_xray(){'''
          if text.count(anchor) != 1:
              raise SystemExit('node-control-agent: repair insertion anchor not unique')
          text=text.replace(anchor,repair,1)
          old='''  if ! stage_agent_release_identity "$release_version" "$source_revision" "$artifact_sha256";then\n   detail='Invalid or unstorable Agent release identity'\n  elif ! systemctl cat xmesh-node-agent-upgrade.service >/dev/null 2>&1;then\n   detail='Agent updater service missing; update the control Agent first'\n  elif timeout 650 systemctl start --wait xmesh-node-agent-upgrade.service && verify_staged_agent_package "$release_version" "$source_revision" "$artifact_sha256";then\n   success=true;detail='Staged Agent package activated and exact release identity verified'\n  else\n   unit_result="$(systemctl show --property=Result --value xmesh-node-agent-upgrade.service 2>/dev/null || true)";[[ "$unit_result" =~ ^[a-zA-Z0-9_-]{1,40}$ ]] || unit_result=unknown\n   detail="Staged Agent apply failed (systemd: $unit_result); previous package remains/restored"\n  fi\n else\n  if ! systemctl cat xmesh-node-agent-upgrade.service >/dev/null 2>&1;then\n   detail='Agent updater service missing; reinstall control-v4 first'\n  elif timeout 650 systemctl start --wait xmesh-node-agent-upgrade.service && grep -Fxq "AGENT_VERSION=\\"$target_version\\"" /usr/local/sbin/xmesh-node-control;then\n   success=true;detail='Agent installed and version verified'\n  else\n   unit_result="$(systemctl show --property=Result --value xmesh-node-agent-upgrade.service 2>/dev/null || true)";[[ "$unit_result" =~ ^[a-zA-Z0-9_-]{1,40}$ ]] || unit_result=unknown\n   detail="Agent update failed (systemd: $unit_result); journalctl -u xmesh-node-agent-upgrade.service"\n  fi\n fi'''
          new='''  if ! stage_agent_release_identity "$release_version" "$source_revision" "$artifact_sha256";then\n   detail='Invalid or unstorable Agent release identity'\n  elif run_agent_updater && verify_staged_agent_package "$release_version" "$source_revision" "$artifact_sha256";then\n   success=true;detail='Staged Agent package activated and exact release identity verified'\n  else\n   if [[ -n "$UPDATER_ERROR" ]];then\n    detail="$UPDATER_ERROR"\n   else\n    unit_result="$(systemctl show --property=Result --value "$UPDATER_RESULT_UNIT" 2>/dev/null || true)";[[ "$unit_result" =~ ^[a-zA-Z0-9_-]{1,40}$ ]] || unit_result=unknown\n    detail="Staged Agent apply failed (systemd: $unit_result); previous package remains/restored"\n   fi\n  fi\n else\n  if run_agent_updater && grep -Fxq "AGENT_VERSION=\\"$target_version\\"" /usr/local/sbin/xmesh-node-control;then\n   success=true;detail='Agent installed and version verified'\n  else\n   if [[ -n "$UPDATER_ERROR" ]];then\n    detail="$UPDATER_ERROR"\n   else\n    unit_result="$(systemctl show --property=Result --value "$UPDATER_RESULT_UNIT" 2>/dev/null || true)";[[ "$unit_result" =~ ^[a-zA-Z0-9_-]{1,40}$ ]] || unit_result=unknown\n    detail="Agent update failed (systemd: $unit_result); inspect $UPDATER_RESULT_UNIT"\n   fi\n  fi\n fi'''
          if text.count(old) != 1:
              raise SystemExit('node-control-agent: old updater dispatch block not found exactly once')
          agent.write_text(text.replace(old,new,1),encoding='utf-8')

          gateway=Path('deploy/xsp-v2-product-gateway/main.go')
          g=gateway.read_text(encoding='utf-8')
          g=g.replace('targetAgentVersion     = "control-v6.0.1"','targetAgentVersion     = "control-v6.0.2"',1)
          g=g.replace('previousAgentVersion   = "control-v6.0.0"','previousAgentVersion   = "control-v6.0.1"\n\trepairAgentVersion     = "control-v6.0.0"',1)
          g=g.replace('versionOK := req.ReleaseIdentity.Version == targetAgentVersion || req.ReleaseIdentity.Version == previousAgentVersion','versionOK := req.ReleaseIdentity.Version == targetAgentVersion || req.ReleaseIdentity.Version == previousAgentVersion || req.ReleaseIdentity.Version == repairAgentVersion',1)
          gateway.write_text(g,encoding='utf-8')

          check=Path('scripts/check-agent-update.js')
          c=check.read_text(encoding='utf-8')
          c=c.replace("assert.equal(agentVersionRaw,'control-v6.0.1','Nexus target Agent version must be control-v6.0.1');","assert.equal(agentVersionRaw,'control-v6.0.2','Nexus target Agent version must be control-v6.0.2');",1)
          c=c.replace('targetAgentVersion\\s*=\\s*"control-v6[.]0[.]1"','targetAgentVersion\\s*=\\s*"control-v6[.]0[.]2"',1)
          c=c.replace('previousAgentVersion\\s*=\\s*"control-v6[.]0[.]0"','previousAgentVersion\\s*=\\s*"control-v6[.]0[.]1"',1)
          needle="  'rolling upgrade must keep the immediately previous Agent release enrollable');"
          replacement=needle+"\nassert.match(gateway,/repairAgentVersion\\s*=\\s*\"control-v6[.]0[.]0\"/,\n  'v6.0.0 bootstrap-hole nodes remain temporarily repairable');"
          if c.count(needle)!=1: raise SystemExit('check-agent-update.js: previous-version assertion anchor missing')
          c=c.replace(needle,replacement,1)
          check.write_text(c,encoding='utf-8')

          base=Path('scripts/check-agent-update-base.js')
          b=base.read_text(encoding='utf-8').replace('control-v6.0.1','control-v6.0.2').replace('control-v6[.]0[.]1','control-v6[.]0[.]2')
          insertion="assert.match(agent,/verify_staged_agent_package\\(\\)/);"
          extra=insertion+"\nassert.match(agent,/run_agent_updater\\(\\)/,'Agent must self-heal a missing updater unit');\nassert.match(agent,/systemd-run[\\s\\S]*xmesh-node-agent-upgrade-repair/,'Missing static updater unit must use a fixed hardened transient repair service');\nassert.match(agent,/raw[.]githubusercontent[.]com\\/TriplexCorp\\/XMesh-Nexus\\/main\\/deploy\\/update-node-control-agent[.]sh/,'Missing updater executable must have a fixed-source bootstrap path');"
          if b.count(insertion)!=1: raise SystemExit('check-agent-update-base.js: agent invariant anchor missing')
          b=b.replace(insertion,extra,1)
          base.write_text(b,encoding='utf-8')

          # No stale advertised target may remain in the release-control surfaces.
          stale=[]
          for path in [
              'AGENT_VERSION','docs/AGENT_RELEASE_POLICY.md','backend/src/node_runtime.rs',
              'deploy/node-control-agent.sh','deploy/install-node-metrics-agent.sh',
              'deploy/update-node-control-agent.sh','scripts/check-agent-update.js',
              'scripts/check-agent-update-base.js','deploy/xsp-v2-product-gateway/main.go']:
              data=Path(path).read_text(encoding='utf-8')
              if 'control-v6.0.1' in data and path != 'deploy/xsp-v2-product-gateway/main.go':
                  stale.append(path)
          if stale:
              raise SystemExit('stale control-v6.0.1 targets remain: '+', '.join(stale))
          PY

          bash -n deploy/node-control-agent.sh deploy/update-node-control-agent.sh deploy/install-node-metrics-agent.sh
          node scripts/check-agent-update.js
          git diff --check
      - name: Commit bounded repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-v602-autopatch.yml
          git add -A
          git commit -m 'fix(agent): self-heal missing updater bootstrap and release v6.0.2'
          git push origin HEAD:fix/agent-updater-bootstrap-v6.0.2
