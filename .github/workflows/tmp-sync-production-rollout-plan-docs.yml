name: Temporary production rollout-plan docs sync

on:
  push:
    branches:
      - docs/production-rollout-plan-checkpoint

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/production-rollout-plan-checkpoint
          fetch-depth: 0

      - name: Patch authoritative docs
        run: python3 scripts/tmp_sync_production_rollout_plan_docs.py

      - name: Verify, self-clean and push
        run: |
          git diff --check
          rm .github/workflows/tmp-sync-production-rollout-plan-docs.yml
          rm scripts/tmp_sync_production_rollout_plan_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md docs/ENTERPRISE_ROADMAP.md .github/workflows/tmp-sync-production-rollout-plan-docs.yml scripts/tmp_sync_production_rollout_plan_docs.py
          git diff --cached --check
          git commit -m "docs(xsp-v2): checkpoint production rollout-plan gate"
          git push origin HEAD:docs/production-rollout-plan-checkpoint
