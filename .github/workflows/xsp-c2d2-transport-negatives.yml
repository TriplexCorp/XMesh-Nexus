name: XSP-v2 C2-D2 Transport Negative and No-Legacy E2E (test-only)
on:
  push:
    branches: [main]
    paths:
      - "backend/c2c/**"
      - "backend/src/bin/xsp_v2_c2c.rs"
      - "backend/src/bin/xsp_v2_c2c_fixture.rs"
      - "backend/src/xsp_v2_**"
      - "backend/Dockerfile.xsp-c2c"
      - "backend/Dockerfile.xsp-signer"
      - "deploy/postgres/20-create-xsp-v2-signer-role.sql"
      - "deploy/postgres/21-create-xsp-v2-c2c-role.sql"
      - "deploy/xsp-v2-ingress/**"
      - "scripts/generate-xsp-v2-mldsa-test-certs.go"
      - "scripts/test-xsp-v2-c2d2-transport-negatives.py"
      - ".github/workflows/xsp-c2d2-transport-negatives.yml"
  pull_request:
    paths:
      - "backend/c2c/**"
      - "backend/src/bin/xsp_v2_c2c.rs"
      - "backend/src/bin/xsp_v2_c2c_fixture.rs"
      - "backend/src/xsp_v2_**"
      - "backend/Dockerfile.xsp-c2c"
      - "backend/Dockerfile.xsp-signer"
      - "deploy/postgres/20-create-xsp-v2-signer-role.sql"
      - "deploy/postgres/21-create-xsp-v2-c2c-role.sql"
      - "deploy/xsp-v2-ingress/**"
      - "scripts/generate-xsp-v2-mldsa-test-certs.go"
      - "scripts/test-xsp-v2-c2d2-transport-negatives.py"
      - ".github/workflows/xsp-c2d2-transport-negatives.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check final D2 transport-negative and no-legacy contract
        run: |
          python3 -m py_compile scripts/test-xsp-v2-c2d2-transport-negatives.py
          ! grep -R --line-number --fixed-strings 'strict-pq=on' scripts/test-xsp-v2-c2d2-transport-negatives.py
          ! grep -R --line-number -E '(-p|--publish)[ =]' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq 'TLS 1.2 downgrade' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq 'TLS 1.3 classical X25519-only negotiation' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq 'wrong hostname/SNI' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq 'untrusted server certificate root' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq 'alternate valid ML-DSA client certificate' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq 'XMESH1 headers without authenticated PQ client identity on exact ACK route' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq '/api/v1/node/heartbeat' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq 'assert_uncommitted' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq 'node_xsp_replay_nonces' scripts/test-xsp-v2-c2d2-transport-negatives.py
          grep -Fq 'listen 8444 ssl default_server;' deploy/xsp-v2-ingress/nginx-c2b.conf
          grep -Fq 'ssl_reject_handshake on;' deploy/xsp-v2-ingress/nginx-c2b.conf
          test "$(grep -Fc 'ssl_protocols TLSv1.3;' deploy/xsp-v2-ingress/nginx-c2b.conf)" -eq 2
          test "$(grep -Fc 'ssl_ecdh_curve X25519MLKEM768;' deploy/xsp-v2-ingress/nginx-c2b.conf)" -eq 2
          grep -Fq 'ENTRYPOINT ["/bin/sh"]' deploy/xsp-v2-ingress/Dockerfile
          grep -Fq 'exec /usr/bin/openssl "$@"' deploy/xsp-v2-ingress/Dockerfile
          grep -Fq 'location = /api/v2/node/keys/rotation/ack {' deploy/xsp-v2-ingress/nginx-c2b.conf
          grep -Fq 'location = /api/v2/node/keys/rotation/ack/recover {' deploy/xsp-v2-ingress/nginx-c2b.conf
          grep -Fq 'location / {' deploy/xsp-v2-ingress/nginx-c2b.conf
          ! grep -Fq '/api/v1/node/heartbeat' deploy/xsp-v2-ingress/nginx-c2b.conf
          ! grep -Fq 'X-XMesh-Signature' deploy/xsp-v2-ingress/nginx-c2b.conf

  full-process-e2e:
    name: Full ACK-boundary transport negatives and no legacy fallback
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Exercise final integrated transport-negative/no-legacy matrix
        run: python3 scripts/test-xsp-v2-c2d2-transport-negatives.py
