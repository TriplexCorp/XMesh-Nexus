name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt --manifest-path backend/Cargo.toml
      - name: Test and lint
        run: |
          cargo test --manifest-path backend/Cargo.toml
          cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - name: Check frontend syntax
        run: |
          node --check app.js
          node --check login.js
      - name: Validate installer and Docker Compose
        env:
          POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          APP_DB_PASSWORD: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          ADMIN_PASSWORD: 9876543210abcdef9876543210abcdef9876543210abcdef9876543210abcdef
        run: |
          bash -n install.sh
          sh -n deploy/postgres/10-create-app-user.sh
          docker compose config --quiet
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t xmesh-nexus:ci .
