name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, security/auth-hardening, ui/emerald-theme-xray-builder]

permissions:
  contents: read

# During rapid development, only the newest run on a branch needs to build
# the expensive Docker image. PR runs remain independent.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  subscription-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check backend independently from frontend regression tests
        working-directory: backend
        run: cargo test --lib --locked --no-default-features || cargo test --bin xmesh-api --no-default-features
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test xmeshctl first-try confirmation
        run: |
          bash -n xmeshctl
          bash -n scripts/check-xmeshctl-confirm.sh
          bash scripts/check-xmeshctl-confirm.sh
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24 for JavaScript checks
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check frontend syntax
        run: |
          node --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          node --check app.js
          node --check unified-selects.js
          node --check subscription-studio.js
          node --check subscription-portal.js
          node --check login.js
          node --check xray-studio-hosts.js
          node --check xray-studio-v4.js
          node --check xray-studio-tools.js
          node --check xray-studio-composer.js
          node --check client-routing.js
          node --check xray-json-diagnostics.js
          node --check xray-json-intelligence.js
      - name: Check shared themed selectors across all sections
        run: node scripts/check-unified-selects.js
      - name: Test manual JSON line diagnostics and Hot Fix
        run: node scripts/check-json-diagnostics.js
      - name: Test Xray semantic intelligence
        run: node scripts/check-xray-intelligence.js
      - name: Test XRAY STUDIO editor tools and Reality Short ID recovery
        run: node scripts/check-xray-tool-actions.js
      - name: Verify XRAY STUDIO wrap default and Add JSON tab dimensions
        run: node scripts/check-xray-studio-wrap-tabs.js
      - name: Verify enterprise XRAY STUDIO inspector and layout
        run: node scripts/check-xray-studio-enterprise.js
      - name: Verify combinatorial Xray composer and Shadowsocks XHTTP Reality
        run: node scripts/check-xray-studio-composer.js
      - name: Verify XRAY STUDIO public endpoint integration
        run: node scripts/check-xray-studio-hosts.js
      - name: Enforce active XRAY STUDIO entrypoint and remove stale assets
        run: node scripts/check-xray-active-entrypoint.js
      - name: Verify packaged frontend assets
        run: node scripts/check-static-assets.js
      - name: Verify per-server client routing templates and assignments
        run: node scripts/check-client-routing.js
      - name: Validate RU/EN panel and portal localization
        run: node scripts/check-i18n.js
      - name: Audit English translation coverage across panel modules
        run: node scripts/check-english-coverage.js
      - name: Check subscription studio and independent deployment blueprint
        run: node scripts/check-subscription-studio.js
      - name: Verify real admin RBAC, authentication boundaries and CSP
        run: node scripts/check-admin-security.js
      - name: Enforce observer least-privilege API and UI security contracts
        run: node scripts/check-viewer-security.js
      - name: Verify advanced server-enforced security policies and sessions
        run: node scripts/check-security-policy.js
      - name: Verify user creation and dialog motion
        run: node scripts/check-modal-motion.js
      - name: Verify TOTP enrollment, MFA login and recovery security
        run: node scripts/check-mfa.js
      - name: Verify persistent MFA key migration safety
        run: bash scripts/check-mfa-key.sh
      - name: Verify advanced security policies and active-session controls
        run: node scripts/check-security-center.js
      - name: Audit authentication, portal isolation and HTML sinks
        run: node scripts/check-security-audit.js
      - name: Check generic branding in tracked files
        run: node scripts/check-white-label.js
      - name: Check appearance surface choices and migration
        run: node scripts/check-appearance-surfaces.js
      - name: Check New Node button rendering and handler
        run: node scripts/check-node-create-action.js
      - name: Check optional node hosting and local flags in notifications
        run: node scripts/check-node-hosting-notifications.js
      - name: Test live notification bell, loading, refresh and failed node status handling
        run: node scripts/check-notification-center.js
      - name: Verify infrastructure statistics, steal time and save feedback
        run: node scripts/check-statistics-feedback.js
      - name: Verify Statistics and Dashboard responsive SVG geometry
        run: node scripts/test-traffic-chart-geometry.js
      - name: Enforce tech-debt cleanup and compatibility boundaries
        run: node scripts/check-tech-debt.js
      - name: Verify CRUD dialogs close after success and DPRK flag renders offline
        run: node scripts/check-crud-dialog-lifecycle.js
      - name: Verify Xray per-user per-inbound metrics collector
        run: python3 scripts/test-xray-stats-collector.py
      - name: Test node metrics collector syntax and real presence state transitions
        run: |
          bash -n deploy/node-metrics-agent.sh
          python3 scripts/test-node-presence.py
      - name: Ensure online status expires and signed telemetry cannot replay
        run: node scripts/check-user-presence.js
      - name: Check managed Xray update safety and SQLx migration uniqueness
        run: node scripts/check-managed-xray-update.js
      - name: Ensure client fingerprint is configured at hosts, not users
        run: node scripts/check-user-fingerprint-ownership.js
      - name: Verify opt-in balancers and separate settings workspace
        run: node scripts/check-balancers-workspace.js
      - name: Verify user quota changes preserve signed traffic and bulk edits do not reset it
        run: node scripts/check-user-quota-preserves-traffic.js
      - name: Verify manual node traffic reset and safety guards
        run: node scripts/check-node-traffic-reset.js
      - name: Verify automatic node quota cutoff and signed shutdown
        run: node scripts/check-node-traffic-cutoff.js
      - name: Verify cumulative node network traffic accounting
        run: node scripts/check-node-network-traffic.js
      - name: Check exact Xray release choice and pinned node agent
        run: node scripts/check-node-xray-releases.js
      - name: Check secure remote Agent upgrades and version display
        run: node scripts/check-agent-update.js
      - name: Check live node Xray version and status feedback
        run: node scripts/check-node-live-status.js
      - name: Check three-zone horizontal Host editor and all working fields
        run: node scripts/check-host-editor-zones.js
      - name: Check wide horizontal Node editor field alignment
        run: node scripts/check-node-editor-layout.js
      - name: Check responsive Nodes grid and density buttons
        run: node scripts/check-node-grid-layout.js
      - name: Verify large-fleet node search and pagination
        run: node scripts/check-node-explorer.js
      - name: Check Nodes IP rotation and Rust resolver integration
        run: node scripts/check-node-ip-rotation.js
      - name: Check XHTTP serialization and themed dropdowns
        run: node scripts/check-xhttp-extras.js
      - name: Check XRAY Studio selector safety
        run: node scripts/check-xray-studio-selectors.js
      - name: Verify automatic public Client JSON addresses
        run: node scripts/check-xray-endpoint-autofill.js
      - name: Test real per-user client JSON generation and Reality X25519 derivation
        run: node scripts/test-client-config.js
      # Formatting is a verification gate: CI must not silently rewrite the checkout.
      # Keep source-contract checks above this step so they inspect the committed code.
      - name: Verify committed Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - name: "Test and lint (strict Clippy: all targets, pedantic, nursery)"
        run: |
          cargo test --manifest-path backend/Cargo.toml --all-targets
          # Correctness, security-sensitive patterns and code-quality warnings
          # are fatal; do not suppress individual lint families globally.
          cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features -- \
            -D warnings \
            -D clippy::pedantic \
            -D clippy::nursery \
            -F unsafe-code
      - name: Verify independent subscription keys, URL redaction and credential rekey contract
        run: node scripts/check-subscription-security.js
      - name: Verify automated Ubuntu host installation and nginx TLS template
        run: bash scripts/check-install-host.sh
      - name: Validate installer and Docker Compose
        env:
          POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          APP_DB_PASSWORD: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          REDIS_PASSWORD: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          ADMIN_PASSWORD: 9876543210abcdef9876543210abcdef9876543210abcdef
          DASHBOARD_PATH: /dashboard/0123456789abcdef0123456789abcdef0123456789abcdef
          SUBSCRIPTION_ENCRYPTION_KEY: "1234567812345678123456781234567812345678123456781234567812345678"
        run: |
          bash -n install.sh
          bash -n xmeshctl
          bash -n scripts/check-xmeshctl-confirm.sh
          bash scripts/check-xmeshctl-confirm.sh
          bash -n deploy/node-metrics-agent.sh
          bash -n deploy/install-node-metrics-agent.sh
          bash -n deploy/update-node-control-agent.sh
          sh -n deploy/postgres/10-create-app-user.sh
          mkdir -p deploy/runtime
          printf '%s\n' "$DASHBOARD_PATH" > deploy/runtime/dashboard-path
          docker compose config --quiet
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t xmesh-nexus:ci .


  integration:
    name: API authentication integration
    runs-on: ubuntu-latest
    needs: rust
    env:
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_DB_PASSWORD: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      REDIS_PASSWORD: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: 9876543210abcdef9876543210abcdef9876543210abcdef
      TOTP_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      SUBSCRIPTION_ENCRYPTION_KEY: "1234567812345678123456781234567812345678123456781234567812345678"
      COOKIE_SECURE: "false"
      DASHBOARD_PATH: /dashboard/0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - name: Start disposable PostgreSQL, Redis and XMesh API
        run: |
          mkdir -p deploy/runtime
          printf '%s\n' "$DASHBOARD_PATH" > deploy/runtime/dashboard-path
          chmod 0666 deploy/runtime/dashboard-path
          docker compose up --build -d
      - name: Wait for database migrations and healthy API
        run: |
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=120 panel
          exit 1
      - name: Exercise signed node identity, tamper resistance and replay rejection
        run: python3 scripts/test-node-auth-integration.py
      - name: Exercise real RBAC, MFA and revocation API
        run: python3 scripts/test-auth-integration.py
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose logs --tail=180
      - name: Remove disposable CI database
        if: always()
        run: docker compose down --volumes --remove-orphans
