name: tmp refresh ui cache

on:
  push:
    branches:
      - integration/argon-frontend-recovery-20261102

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/argon-frontend-recovery-20261102
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Refresh content-addressed asset graph
        run: |
          node scripts/update-ui-cache.cjs
          node scripts/update-ui-cache.cjs --check
          node scripts/check-ui-system.js
          git diff --check
      - name: Commit refreshed keys
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html frontend/login.html frontend/styles/system/nexus-ui-v3.css
          git commit -m "fix(ui): refresh content-addressed asset keys"
          git push origin HEAD:integration/argon-frontend-recovery-20261102
