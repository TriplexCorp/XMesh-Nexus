name: Temporary UI cache refresh

on:
  push:
    branches:
      - integration/argon-frontend-recovery-20261102
    paths:
      - '.github/workflows/tmp-refresh-ui-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/argon-frontend-recovery-20261102
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Refresh canonical UI content hashes
        run: |
          node scripts/update-ui-cache.cjs
          node scripts/update-ui-cache.cjs --check
          node scripts/check-ui-system.js
          git diff --check
      - name: Commit refreshed hashes
        run: |
          if git diff --quiet -- frontend; then
            echo 'No cache changes to commit'
            exit 0
          fi
          git config user.name 'Xmesh Creator'
          git config user.email 'Aselis3d@gmail.com'
          git add frontend
          git commit -m 'fix(frontend): refresh canonical UI content hashes'
          git push origin HEAD:integration/argon-frontend-recovery-20261102
