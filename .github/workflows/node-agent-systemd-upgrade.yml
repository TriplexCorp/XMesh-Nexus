name: Security - installed Node v6 meter upgrade (disposable systemd)
on:
  pull_request:
    paths:
      - 'deploy/update-node-control-agent.sh'
      - 'deploy/xmesh-product-upgrade-coordinator.py'
      - 'deploy/xmesh-product-agent-upgrade.*'
      - 'scripts/test-product-agent-upgrade-coordinator.py'
      - 'scripts/build-product-agent-bridge-package.sh'
      - 'scripts/test-product-agent-bridge-apt.sh'
      - 'scripts/test-node-agent-systemd-upgrade.py'
      - '.github/workflows/node-agent-systemd-upgrade.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/update-node-control-agent.sh'
      - 'deploy/xmesh-product-upgrade-coordinator.py'
      - 'deploy/xmesh-product-agent-upgrade.*'
      - 'scripts/test-product-agent-upgrade-coordinator.py'
      - 'scripts/build-product-agent-bridge-package.sh'
      - 'scripts/test-product-agent-bridge-apt.sh'
      - 'scripts/test-node-agent-systemd-upgrade.py'
      - '.github/workflows/node-agent-systemd-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-systemd-meter-upgrade:
    name: Ubuntu 24.04 systemd signed-meter upgrade and interrupted-link canary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      XMESH_AUDIT_SYSTEMD_CANARY: "1"
    steps:
      - name: Check out Nexus under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out exact reviewed old v6.0.11 Node
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 647adcf7af326b205fce12545fb5d75a20bb8191
          path: .ci-old-node
          persist-credentials: false
      - name: Check out exact reviewed v6.0.15 Node producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 6c1bafa8433003a9bfed15986d83dba4d8cb5f1a
          path: .ci-new-node
          persist-credentials: false
      - name: Check out the reviewed product bridge source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 7af520cdd1254d25a08a52d6b1f0a4c596b46be0
          path: .ci-product-bridge
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .ci-product-bridge/agent/xspv2/go.mod
          cache: false
      - name: Verify reproducible bridge package and independently pinned APT trust
        shell: bash
        run: |
          set -Eeuo pipefail
          revision="$(git -C .ci-product-bridge rev-parse HEAD)"
          test "$revision" = '7af520cdd1254d25a08a52d6b1f0a4c596b46be0'
          bridge="$RUNNER_TEMP/xmesh-product-bridge"
          (cd .ci-product-bridge/agent/xspv2 &&
            CGO_ENABLED=0 go build -trimpath \
              -ldflags "-X main.version=control-v6.0.27 -X main.sourceRevision=$revision" \
              -o "$bridge" ./cmd/xmesh-agent-xspv2-product)
          read -r digest _ < <(sha256sum "$bridge")
          scripts/build-product-agent-bridge-package.sh "$bridge" "$digest" "$RUNNER_TEMP/bridge-a.deb"
          scripts/build-product-agent-bridge-package.sh "$bridge" "$digest" "$RUNNER_TEMP/bridge-b.deb"
          cmp "$RUNNER_TEMP/bridge-a.deb" "$RUNNER_TEMP/bridge-b.deb"
          sha256sum "$bridge" "$RUNNER_TEMP/bridge-a.deb"
          scripts/test-product-agent-bridge-apt.sh "$RUNNER_TEMP/bridge-a.deb"
      - name: Verify product bridge orchestration and recovery boundaries
        run: sudo /usr/bin/python3 scripts/test-product-agent-upgrade-coordinator.py -v
      - name: Prove installed helper migration under real Ubuntu systemd
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/update-node-control-agent.sh
          python3 -m py_compile scripts/test-node-agent-systemd-upgrade.py
          test -d /run/systemd/system
          sudo --preserve-env=GITHUB_ACTIONS,XMESH_AUDIT_SYSTEMD_CANARY \
            /usr/bin/python3 scripts/test-node-agent-systemd-upgrade.py \
            .ci-old-node .ci-new-node
      - name: Record systemd diagnostics if test failed
        if: failure()
        shell: bash
        run: |
          sudo journalctl -b --no-pager --since '-12 minutes' \
            --grep 'xmesh-meter-upgrade-audit-' -n 60 || true
