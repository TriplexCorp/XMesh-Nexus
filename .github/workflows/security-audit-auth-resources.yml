name: Security audit - isolated authentication resources
on:
  pull_request:
    paths:
      - 'backend/src/auth.rs'
      - 'backend/src/main.rs'
      - 'scripts/security-audit-login-resources.py'
      - '.github/workflows/security-audit-auth-resources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-login:
    name: Auth resources (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [baseline, candidate]
    env:
      ADMIN_USERNAME: audit-owner
      COOKIE_SECURE: "false"
      PANEL_DOMAIN: ci.example.invalid
      DASHBOARD_PATH: /dashboard/security-audit-disposable
      XMESH_AUDIT_DISPOSABLE: "1"
      XMESH_TEST_URL: http://127.0.0.1:8080
    steps:
      - name: Check out audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out exact pre-fix baseline
        if: matrix.target == 'baseline'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TriplexCorp/XMesh-Nexus
          ref: 4aa18331e537d6a1eacd747d58af55041748abf0
          path: .audit-baseline
          persist-credentials: false
      - name: Prepare disposable secrets and source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD REDIS_PASSWORD ADMIN_PASSWORD TOTP_ENCRYPTION_KEY SUBSCRIPTION_ENCRYPTION_KEY XSP_V2_PRODUCT_INTERNAL_TOKEN; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          source_dir="$GITHUB_WORKSPACE"
          if [[ '${{ matrix.target }}' == baseline ]]; then source_dir="$GITHUB_WORKSPACE/.audit-baseline"; fi
          printf 'AUDIT_SOURCE_DIR=%s\n' "$source_dir" >> "$GITHUB_ENV"
          printf 'AUDIT_SOURCE_SHA=%s\n' "$(git -C "$source_dir" rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'COMPOSE_PROJECT_NAME=xmesh-security-${{ matrix.target }}\n' >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xmesh-audit-artifacts" "$source_dir/deploy/runtime"
          printf '%s\n' "$DASHBOARD_PATH" > "$source_dir/deploy/runtime/dashboard-path"
          chmod 0666 "$source_dir/deploy/runtime/dashboard-path"
          printf '%s\n' 'services:' '  panel:' '    environment:' '      TOKIO_WORKER_THREADS: "1"' > "$RUNNER_TEMP/xmesh-audit-artifacts/runtime.yaml"
      - name: Build only isolated API, PostgreSQL and Redis
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AUDIT_SOURCE_DIR"
          docker compose -f compose.yaml -f "$RUNNER_TEMP/xmesh-audit-artifacts/runtime.yaml" up --build -d db redis panel
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Measure baseline or enforce regression
        shell: bash
        run: |
          set -Eeuo pipefail
          mode=()
          if [[ '${{ matrix.target }}' == baseline ]]; then mode=(--observe); fi
          python3 scripts/security-audit-login-resources.py "${mode[@]}" --output "$RUNNER_TEMP/xmesh-audit-artifacts/login-${{ matrix.target }}.json"
      - name: Retain sanitized bounded measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-audit-login-${{ matrix.target }}
          path: ${{ runner.temp }}/xmesh-audit-artifacts/login-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy this job's disposable containers and database
        if: always()
        shell: bash
        run: |
          if [[ -n "$AUDIT_SOURCE_DIR" && -f "$RUNNER_TEMP/xmesh-audit-artifacts/runtime.yaml" ]]; then
            cd "$AUDIT_SOURCE_DIR"
            docker compose -f compose.yaml -f "$RUNNER_TEMP/xmesh-audit-artifacts/runtime.yaml" down --volumes --remove-orphans
          fi
