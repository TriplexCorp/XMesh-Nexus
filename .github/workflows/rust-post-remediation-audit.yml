name: Rust post-remediation full Cargo audit
on:
  pull_request:
    paths:
      - '.github/workflows/rust-post-remediation-audit.yml'
      - 'backend/Cargo.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-post-remediation-audit.yml'
      - 'backend/Cargo.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cargo-audit-resolved-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact Nexus revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use stable Rust with exact backend manifest
        run: |
          set -Eeuo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo generate-lockfile --manifest-path backend/Cargo.toml
          test -s backend/Cargo.lock
      - name: Verify immutable upstream SQLx fix and production PostgreSQL-only graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, tomllib
          path = pathlib.Path("backend/Cargo.toml")
          manifest = tomllib.loads(path.read_text())
          sqlx = manifest["dependencies"]["sqlx"]
          assert sqlx["default-features"] is False
          assert "postgres" in sqlx["features"] and "sqlite" not in sqlx["features"]
          patch = manifest["patch"]["crates-io"]["sqlx-sqlite"]
          assert patch["rev"] == "10462fa4414c6c7f1ed1d39bb31678e3b726878c"
          assert patch["git"] == "https://github.com/transact-rs/sqlx"
          packages = tomllib.loads(pathlib.Path("backend/Cargo.lock").read_text())["package"]
          driver = [p for p in packages if p["name"] == "sqlx-sqlite"]
          sqlite = [p for p in packages if p["name"] == "libsqlite3-sys"]
          assert len(driver) == len(sqlite) == 1, (driver, sqlite)
          assert driver[0]["source"].startswith("git+https://github.com/transact-rs/sqlx?"), driver
          assert "10462fa4414c6c7f1ed1d39bb31678e3b726878c" in driver[0]["source"], driver
          version = tuple(int(n) for n in sqlite[0]["version"].split(".")[:3])
          assert version >= (0,39,0), sqlite
          print("SQLx SQLite compatibility pin is exact; resolved libsqlite3-sys =", sqlite[0]["version"])
          PY
          cargo tree --manifest-path backend/Cargo.toml --no-default-features \
            --target x86_64-unknown-linux-gnu --edges normal --format '{p}' \
            > "$RUNNER_TEMP/production-runtime-tree.txt"
          if grep -Eq '(^|[[:space:]])(libsqlite3-sys|sqlx-sqlite|rusqlite) v[0-9]' "$RUNNER_TEMP/production-runtime-tree.txt"; then
            echo 'Unexpected SQLite in production runtime dependency tree' >&2
            exit 1
          fi
          echo 'Production PostgreSQL API remains SQLite-free'
      - name: Install pinned cargo-audit 0.23.0
        run: |
          set -Eeuo pipefail
          cargo install cargo-audit --version 0.23.0 --locked
      - name: Strict full resolved-graph advisory audit (no ignored findings)
        run: |
          set -Eeuo pipefail
          cargo audit --json --file backend/Cargo.lock > "$RUNNER_TEMP/cargo-audit.json"
      - name: Print normalized advisory inventory, even on audit failure
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"],"cargo-audit.json")
          if not p.exists() or not p.stat().st_size:
              print("No JSON advisory report produced; audit could not complete")
          else:
              try:
                  data=json.loads(p.read_text())
              except Exception as exc:
                  print(f"Invalid audit report; do not assume clean: {exc}")
              else:
                  advisories=data.get("vulnerabilities",{}).get("list",[])
                  print(f"Full Cargo audit returned {len(advisories)} vulnerability records")
                  for entry in advisories:
                      a=entry.get("advisory",{})
                      package=entry.get("package",{})
                      print("ADVISORY",a.get("id"),"crate",package.get("name"),"version",package.get("version"))
                  print("Scanner outcome is authoritative; absence of findings here does not override failed CI")
          PY
      - name: Retain exact scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-post-remediation-cargo-audit
          path: ${{ runner.temp }}/cargo-audit.json
          if-no-files-found: warn
          retention-days: 14
