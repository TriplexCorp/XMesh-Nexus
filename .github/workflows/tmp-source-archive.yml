name: Temporary main source archive

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-source-archive.yml

permissions:
  contents: read

jobs:
  archive-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR base (current main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Create clean source ZIP
        run: |
          git archive \
            --format=zip \
            --prefix=XMesh-Nexus-main/ \
            --output=xmesh-nexus-main-source.zip \
            HEAD
          sha256sum xmesh-nexus-main-source.zip
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: xmesh-nexus-main-source
          path: xmesh-nexus-main-source.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
