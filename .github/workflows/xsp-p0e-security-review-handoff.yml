name: XSP-v2 P0-E Security Review Handoff

on:
  push:
    branches: [main]
    paths:
      - "deploy/xsp-v2-p0e-security-review-handoff.contract.json"
      - "docs/XSP_V2_P0E_SECURITY_REVIEW_HANDOFF.md"
      - ".github/workflows/xsp-p0e-security-review-handoff.yml"
      - ".github/workflows/xsp-p0e-security-review-bundle.yml"
      - "docs/XSP_V2_P0E_SECURITY_REVIEW_BUNDLE.md"
  pull_request:
    paths:
      - "deploy/xsp-v2-p0e-security-review-handoff.contract.json"
      - "docs/XSP_V2_P0E_SECURITY_REVIEW_HANDOFF.md"
      - ".github/workflows/xsp-p0e-security-review-handoff.yml"
      - ".github/workflows/xsp-p0e-security-review-bundle.yml"
      - "docs/XSP_V2_P0E_SECURITY_REVIEW_BUNDLE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-review-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v4 control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out exact v4 Nexus review target
        uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Nexus
          ref: 12b3170996bc062ee16c79659a6378e5e425fd0e
          path: xmesh-nexus-reviewed
          fetch-depth: 0

      - name: Check out exact v4 Node review target
        uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb
          path: xmesh-node-reviewed
          fetch-depth: 0

      - name: Verify machine-readable v4 handoff and external blockers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='deploy/xsp-v2-p0e-security-review-handoff.contract.json'
          x=json.load(open(p))
          assert x['schema']=='xsp2-p0e-security-review-handoff-contract-3'
          assert x['nexus']=={
            'repository':'TriplexCorp/XMesh-Nexus',
            'sourceRevision':'12b3170996bc062ee16c79659a6378e5e425fd0e',
          }
          assert x['node']=={
            'repository':'TriplexCorp/XMesh-Node',
            'sourceRevision':'34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb',
          }
          assert x['supersededV3ReviewTarget']=={
            'nexusSourceRevision':'0bab1a48cff570b3abe405bcda4dc242b23b8a4b',
            'nodeSourceRevision':'083dc181c5e175f89007f4b93111cd5c45a69d97',
            'internalAuditMerge':'424d99d8a9822c2e8157e5cdbb15c423e99f10ef',
            'supersededBySecurityRemediation':True,
          }
          assert x['securityRemediationCheckpoint']=={
            'nexusMandatoryTlsClientAuthMerge':'12b3170996bc062ee16c79659a6378e5e425fd0e',
            'nodeMasterKeyDirectoryFsyncMerge':'34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb',
            'resolvedInternalFindings':['AI-LOW-001','AI-LOW-002'],
          }
          assert x['runtimeBaseline']=={
            'nexusSourceRevision':'12b3170996bc062ee16c79659a6378e5e425fd0e',
            'nodeSourceRevision':'34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb',
            'criticalRuntimePathsMustBeUnchanged':True,
          }
          domains=x['requiredReviewDomains']
          assert len(domains)==11 and len(set(domains))==11
          assert set(domains)=={
            'protocol-and-canonicalization',
            'hybrid-cryptography-and-key-purpose-binding',
            'pq-only-transport-and-node-identity',
            'isolated-signer-and-key-custody',
            'postgresql-replay-ack-epoch-and-receipt',
            'agent-local-durability-and-rollback',
            'coordinated-backup-restore-and-off-host-floor',
            'owner-authorized-key-retirement',
            'parser-fuzz-and-external-mldsa65-vectors',
            'default-off-redacted-observability',
            'production-migration-no-fallback-and-rollback',
          }
          assert 'docs/XSP_V2_AI_ASSISTED_INTERNAL_SECURITY_AUDIT_2026-10-30.md' in x['requiredEvidenceDocuments']
          assert 'deploy/xsp-v2-ingress/nginx-c2b.conf' in x['requiredImplementationEvidence']
          assert 'scripts/test-xsp-v2-c2d2-transport-negatives.py' in x['requiredImplementationEvidence']
          assert x['requiredExternalBlockers']==[
            'independent-security-review-findings-and-signoff',
            'p0-e4a-five-representative-physical-abrupt-power-runs-and-independent-review',
          ]
          assert x['reviewPackageFrozen'] is True
          for key in ('independentSecurityReviewComplete','physicalPowerLossQualified',
                      'productionActivation','strictPQEnabled'):
            assert x[key] is False
          PY

      - name: Verify frozen repository revisions exactly
        run: |
          set -euo pipefail
          test "$(git -C xmesh-nexus-reviewed rev-parse HEAD)" = '12b3170996bc062ee16c79659a6378e5e425fd0e'
          test "$(git -C xmesh-node-reviewed rev-parse HEAD)" = '34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb'

      - name: Prove v3 to v4 Nexus runtime delta is exactly AI-LOW-001
        run: |
          set -euo pipefail
          old='0bab1a48cff570b3abe405bcda4dc242b23b8a4b'
          new='12b3170996bc062ee16c79659a6378e5e425fd0e'
          changed="$(git -C xmesh-nexus-reviewed diff --name-only "$old" "$new" -- \
            backend \
            app.js \
            compose.yaml \
            install.sh \
            xmeshctl \
            security/xspv2 \
            deploy/xsp-v2-ingress \
            deploy/node-control-agent.sh \
            deploy/update-node-control-agent.sh \
            deploy/xsp-v2-agent-staged-apply.sh \
            deploy/xmesh-xsp-v2-agent-stage.service | sort)"
          expected='deploy/xsp-v2-ingress/nginx-c2b.conf'
          test "$changed" = "$expected" || {
            echo 'unexpected Nexus security-runtime drift between v3 and v4:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          grep -Eq '^[[:space:]]*ssl_verify_client[[:space:]]+on;' \
            xmesh-nexus-reviewed/deploy/xsp-v2-ingress/nginx-c2b.conf
          ! grep -Eq '^[[:space:]]*ssl_verify_client[[:space:]]+optional;' \
            xmesh-nexus-reviewed/deploy/xsp-v2-ingress/nginx-c2b.conf

      - name: Prove v3 to v4 Node security delta is exactly AI-LOW-002
        run: |
          set -euo pipefail
          old='083dc181c5e175f89007f4b93111cd5c45a69d97'
          new='34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb'
          changed="$(git -C xmesh-node-reviewed diff --name-only "$old" "$new" -- security/xspv2 agent/xspv2 | sort)"
          expected="$(printf '%s\n' \
            security/xspv2/poc-go/keyring/master_key_durability_linux_test.go \
            security/xspv2/poc-go/keyring/sealed.go | sort)"
          test "$changed" = "$expected" || {
            echo 'unexpected Node security-runtime drift between v3 and v4:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          grep -Fq 'func syncParentDir(path string) error' \
            xmesh-node-reviewed/security/xspv2/poc-go/keyring/sealed.go
          grep -Fq 'if err = syncParentDir(path); err != nil {' \
            xmesh-node-reviewed/security/xspv2/poc-go/keyring/sealed.go
          test -s xmesh-node-reviewed/security/xspv2/poc-go/keyring/master_key_durability_linux_test.go

      - name: Verify required v4 evidence index exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          x=json.load(open('deploy/xsp-v2-p0e-security-review-handoff.contract.json'))
          root=pathlib.Path('xmesh-nexus-reviewed')
          required=(x['requiredEvidenceDocuments'] + x['requiredMachineContracts'] +
                    x['requiredImplementationEvidence'])
          assert len(required)==len(set(required)), 'duplicate review evidence path'
          for rel in required:
            p=root/rel
            assert p.is_file(), f'missing frozen review evidence: {rel}'
            assert p.stat().st_size > 0, f'empty frozen review evidence: {rel}'
          PY

      - name: Verify machine contracts remain bounded and non-production
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('xmesh-nexus-reviewed')
          files=[
            'deploy/xsp-v2-p0e-owner-retirement-durable-erasure.contract.json',
            'deploy/xsp-v2-p0e-parser-fuzz.contract.json',
            'deploy/xsp-v2-p0e-mldsa65-fips204-acvp.contract.json',
            'deploy/xsp-v2-p0e-observability.contract.json',
            'deploy/xsp-v2-disposable-canary-rehearsal.contract.json',
            'deploy/xsp-v2-production-rollout-plan.contract.json',
            'deploy/xsp-v2-strict-pq-activation-approval.contract.json',
          ]
          forbidden_true={
            'productionActivation','strictPQEnabled','physicalPowerLossQualified',
            'independentSecurityReviewComplete','legacyXMESH1Retired',
          }
          def walk(v, where='root'):
            if isinstance(v, dict):
              for k,val in v.items():
                if k in forbidden_true:
                  assert val is False, f'{where}.{k} unexpectedly true/non-false: {val!r}'
                walk(val, where+'.'+k)
            elif isinstance(v, list):
              for i,val in enumerate(v): walk(val, f'{where}[{i}]')
          for rel in files:
            obj=json.load(open(root/rel))
            assert isinstance(obj.get('schema'), str) and obj['schema'].startswith('xsp2-')
            walk(obj, rel)
          PY

      - name: Verify remediated ingress source contracts
        run: |
          set -euo pipefail
          (
            cd xmesh-nexus-reviewed
            node scripts/check-xsp-v2-ingress-runtime.js
            node scripts/check-xsp-v2-c2b-ack-runtime.js
            node scripts/check-xsp-v2-c2c-runtime.js
          )
          grep -Fq 'No required SSL certificate was sent' \
            xmesh-nexus-reviewed/scripts/test-xsp-v2-c2b-ack-process.py
          grep -Fq 'mandatory mTLS before ACK routing' \
            xmesh-nexus-reviewed/scripts/test-xsp-v2-c2d2-transport-negatives.py

      - name: Verify final release controls remain present and non-executing
        run: |
          set -euo pipefail
          root=xmesh-nexus-reviewed
          for f in \
            docs/XSP_V2_DISPOSABLE_CANARY_REHEARSAL.md \
            docs/XSP_V2_PRODUCTION_ROLLOUT_PLAN.md \
            docs/XSP_V2_STRICT_PQ_ACTIVATION_APPROVAL.md \
            scripts/verify-xsp-v2-production-rollout-plan.py \
            scripts/verify-xsp-v2-strict-pq-activation-approval.py; do
            test -s "$root/$f"
          done
          grep -Fq 'finalReleaseCanarySatisfied=false' "$root/docs/XSP_V2_DISPOSABLE_CANARY_REHEARSAL.md"
          grep -Fq '"productionActivation": false' "$root/docs/XSP_V2_PRODUCTION_ROLLOUT_PLAN.md"
          grep -Fq 'strictPQEnabled=false' "$root/docs/XSP_V2_STRICT_PQ_ACTIVATION_APPROVAL.md"
          grep -Fq 'requiresSeparateExecution' "$root/docs/XSP_V2_STRICT_PQ_ACTIVATION_APPROVAL.md"

      - name: Verify v4 handoff normative statements
        run: |
          set -euo pipefail
          handoff='docs/XSP_V2_P0E_SECURITY_REVIEW_HANDOFF.md'
          grep -Fq '12b3170996bc062ee16c79659a6378e5e425fd0e' "$handoff"
          grep -Fq '34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb' "$handoff"
          grep -Fq 'AI-LOW-001' "$handoff"
          grep -Fq 'AI-LOW-002' "$handoff"
          grep -Fq 'issue #137 remains required' "$handoff"
          grep -Fq 'issue #138' "$handoff"
          grep -Fq '`strict-pq` remains OFF' "$handoff"
          grep -Fq 'production rollout remains NOT AUTHORIZED' "$handoff"

      - name: Verify handoff changes are limited to review-control files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            changed="$(git diff --name-only "$base...$head" | sort)"
          else
            parents="$(git rev-list --parents -n 1 HEAD)"
            parent_count=$(( $(wc -w <<<"$parents") - 1 ))
            if [ "$parent_count" -gt 1 ]; then
              base="$(git rev-parse HEAD^1)"
            else
              base="$(git rev-parse HEAD^)"
            fi
            changed="$(git diff --name-only "$base" HEAD | sort)"
          fi
          allowed="$(printf '%s\n' \
            .github/workflows/xsp-p0e-security-review-bundle.yml \
            .github/workflows/xsp-p0e-security-review-handoff.yml \
            deploy/xsp-v2-p0e-security-review-handoff.contract.json \
            docs/XSP_V2_P0E_SECURITY_REVIEW_BUNDLE.md \
            docs/XSP_V2_P0E_SECURITY_REVIEW_HANDOFF.md | sort)"
          test -n "$changed"
          while IFS= read -r path; do
            grep -Fxq "$path" <<<"$allowed" || {
              echo "non-review-control file changed in v4 handoff delta: $path" >&2
              exit 1
            }
          done <<<"$changed"

      - name: State preparation-only v4 evidence
        run: |
          echo 'PASS: v4 freezes the exact remediated Nexus/Node source revisions and proves the v3->v4 security delta is limited to AI-LOW-001/002 remediation.'
          echo 'This CI does not perform independent security review and does not qualify physical abrupt-power behavior.'
          echo 'Issues #137/#138 remain external blockers; strict-pq remains OFF; production rollout remains NOT AUTHORIZED.'
