name: XSP-v2 Final Release Canary v3

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/xsp-v2-final-release-canary-v3.contract.json"
      - "deploy/xsp-v2-p0e-ai-assisted-security-review-v6.*"
      - "deploy/xsp-v2-kvm-vps-durability-carry-forward-v1.json"
      - "deploy/xsp-v2-kvm-vps-strict-pq-activation-approval-v2.contract.json"
      - "scripts/verify-xsp-v2-kvm-vps-strict-pq-activation-approval-v2.py"
      - ".github/workflows/xsp-v2-final-release-canary-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXUS: a1267ae186f74d5e21561e3b64fc7375d499132e
  NODE: 64709ce8f5f0ce80e2c0bab59b4476347825e57c

jobs:
  gates-and-carry-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 64709ce8f5f0ce80e2c0bab59b4476347825e57c
          path: node
          fetch-depth: 0
      - name: Verify review, durability and unchanged prior-canary domains
        run: |
          set -Eeuo pipefail
          python3 scripts/verify-xsp-v2-p0e-ai-assisted-security-review-result.py \
            --contract deploy/xsp-v2-p0e-ai-assisted-security-review-v6.contract.json \
            --result deploy/xsp-v2-p0e-ai-assisted-security-review-v6.json --require-closure-eligible
          python3 - <<'PY'
          import json
          c=json.load(open('deploy/xsp-v2-final-release-canary-v3.contract.json'))
          assert c['releaseCandidate']=={'nexusRevision':'a1267ae186f74d5e21561e3b64fc7375d499132e','nodeRevision':'64709ce8f5f0ce80e2c0bab59b4476347825e57c'}
          assert c['requiredEvidence']['previousFinalCanaryResultSha256']=='b29fb94428b0c5fcfff776ee73cb808d6df0400dcc9b247f5ab7ca42c6f0f400'
          d=json.load(open('deploy/xsp-v2-kvm-vps-durability-carry-forward-v1.json'))
          assert d['productionTarget']==c['releaseCandidate']
          assert d['claims']['fiveRunCrashMatrixCarriedForward'] and d['claims']['postgresCrashRecoveryCarriedForward']
          PY
          git diff --quiet 12b3170996bc062ee16c79659a6378e5e425fd0e..$NEXUS -- \
            scripts/test-xsp-agent-real-e2e.py \
            scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py \
            scripts/test-xsp-v2-canary-observability.sh \
            backend/src/main.rs
          test "$(git diff --name-only 12b3170996bc062ee16c79659a6378e5e425fd0e..$NEXUS -- backend/src | sort)" = $'backend/src/bin/xsp_v2_permit_operator.rs\nbackend/src/bin/xsp_v2_permit_signer.rs'
          cd node
          git diff --quiet 34d3d7ef5b88fb62e0d7ffa70d92b9aafa3a3abb..$NODE -- \
            agent/xspv2/cmd/xmesh-agent-xspv2/main.go agent/xspv2/runtime agent/xspv2/state
      - name: Prove approval v2 rejects fallback and missing AI review
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          x={
            'schema':'xsp2-kvm-vps-strict-pq-activation-approval-2','deploymentClass':'kvm-vps',
            'releaseCandidate':{'nexusRuntimeRevision':'a1267ae186f74d5e21561e3b64fc7375d499132e','nodeRevision':'64709ce8f5f0ce80e2c0bab59b4476347825e57c','nexusImageSha256':'sha256:'+'1'*64,'agentArtifactSha256':'2'*64},
            'evidence':{'aiAssistedSecurityReviewAccepted':True,'aiAssistedSecurityReviewResultSha256':'3'*64,'kvmVpsDurabilityQualificationAccepted':True,'kvmVpsDurabilityResultSha256':'4'*64,'providerStorageRiskAccepted':True,'providerStorageRiskAcceptanceSha256':'5'*64,'finalCanaryPassed':True,'finalCanaryResultSha256':'6'*64,'rolloutPlanReviewed':True,'rolloutPlanSha256':'7'*64,'rolloutPlanReviewSha256':'8'*64},
            'scope':{'mode':'limited-canary','nodes':['node-13'],'validFrom':'2026-10-31T00:00:00Z','validUntil':'2026-10-31T23:59:00Z'},
            'transportPolicy':{'tlsProtocols':['TLSv1.3'],'keyExchange':'X25519MLKEM768','clientIdentity':'ML-DSA-65','criticalMessageSignatures':['Ed25519','ML-DSA-65'],'automaticFallback':False,'classicalOnlyAllowed':False},
            'decision':{'strictPqAction':'enable','legacyXMESH1Action':'retain'},
            'approval':{'authority':'release-owner','approvedBy':'Triplex','approvedAt':'2026-10-31T12:00:00Z','statement':'bounded canary'},
            'claims':{'productionActivation':False,'strictPQEnabled':False,'legacyXMESH1Retired':False,'physicalPowerLossQualified':False}}
          json.dump(x,open('/tmp/good.json','w'))
          a=json.loads(json.dumps(x));a['transportPolicy']['classicalOnlyAllowed']=True;json.dump(a,open('/tmp/fallback.json','w'))
          a=json.loads(json.dumps(x));a['evidence']['aiAssistedSecurityReviewAccepted']=False;json.dump(a,open('/tmp/no-review.json','w'))
          PY
          python3 scripts/verify-xsp-v2-kvm-vps-strict-pq-activation-approval-v2.py --approval /tmp/good.json
          ! python3 scripts/verify-xsp-v2-kvm-vps-strict-pq-activation-approval-v2.py --approval /tmp/fallback.json
          ! python3 scripts/verify-xsp-v2-kvm-vps-strict-pq-activation-approval-v2.py --approval /tmp/no-review.json

  production-bindings:
    needs: gates-and-carry-forward
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      agent_sha: ${{ steps.bind.outputs.agent_sha }}
      bundle_sha: ${{ steps.bind.outputs.bundle_sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: a1267ae186f74d5e21561e3b64fc7375d499132e, path: runtime}
      - uses: actions/checkout@v4
        with: {repository: TriplexCorp/XMesh-Node, ref: 64709ce8f5f0ce80e2c0bab59b4476347825e57c, path: runtime/node}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3', cache: false}
      - name: Build exact production surfaces
        run: |
          set -Eeuo pipefail
          cd runtime/node/agent/xspv2
          go test ./... -count=1
          go build -trimpath -ldflags "-X main.version=final-canary-v3 -X main.sourceRevision=$NODE" -o /tmp/xmesh-agent-xspv2-activate ./cmd/xmesh-agent-xspv2-activate
          /tmp/xmesh-agent-xspv2-activate --identity > /tmp/identity.json
          cd "$GITHUB_WORKSPACE/runtime"
          docker build -f backend/Dockerfile.xsp-signer -t xsp-v3-signer .
          docker build --target runtime -f backend/Dockerfile.xsp-c2c -t xsp-v3-c2c .
          docker build --target origin-ack-gate -f deploy/xsp-v2-ingress/Dockerfile -t xsp-v3-origin .
          docker build --target runtime-c2b -f deploy/xsp-v2-ingress/Dockerfile -t xsp-v3-ingress .
      - name: Compute exact candidate bindings
        id: bind
        run: |
          python3 - <<'PY' > /tmp/bindings
          import hashlib,json,subprocess
          agent=hashlib.sha256(open('/tmp/xmesh-agent-xspv2-activate','rb').read()).hexdigest()
          ident=json.load(open('/tmp/identity.json'));assert ident['sourceRevision']=='64709ce8f5f0ce80e2c0bab59b4476347825e57c' and ident['artifactSha256']==agent
          images={k:subprocess.check_output(['docker','image','inspect','--format={{.Id}}',v],text=True).strip() for k,v in {'signer':'xsp-v3-signer','c2c':'xsp-v3-c2c','origin':'xsp-v3-origin','ingress':'xsp-v3-ingress'}.items()}
          manifest={'schema':'xsp2-production-runtime-image-manifest-1','nexusRevision':'a1267ae186f74d5e21561e3b64fc7375d499132e','nodeRevision':'64709ce8f5f0ce80e2c0bab59b4476347825e57c','images':images}
          raw=(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n').encode();open('/tmp/runtime-bundle-manifest.json','wb').write(raw)
          print(agent);print(hashlib.sha256(raw).hexdigest())
          PY
          agent="$(sed -n '1p' /tmp/bindings)"; bundle="$(sed -n '2p' /tmp/bindings)"
          echo "agent_sha=$agent" >> "$GITHUB_OUTPUT"; echo "bundle_sha=$bundle" >> "$GITHUB_OUTPUT"
          echo "agentArtifactSha256=$agent"; echo "nexusImageSha256=sha256:$bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: xsp-v2-production-bindings-v3
          path: /tmp/runtime-bundle-manifest.json

  final-result:
    needs: [gates-and-carry-forward, production-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit exact final canary v3 result
        env:
          AGENT_SHA: ${{ needs.production-bindings.outputs.agent_sha }}
          BUNDLE_SHA: ${{ needs.production-bindings.outputs.bundle_sha }}
        run: |
          set -Eeuo pipefail
          SECURITY_SHA="$(sha256sum deploy/xsp-v2-p0e-ai-assisted-security-review-v6.json|awk '{print $1}')"
          CARRY_SHA="$(sha256sum deploy/xsp-v2-kvm-vps-durability-carry-forward-v1.json|awk '{print $1}')"
          python3 - "$AGENT_SHA" "$BUNDLE_SHA" "$SECURITY_SHA" "$CARRY_SHA" <<'PY'
          import json,sys
          a,b,s,c=sys.argv[1:]
          x={'schema':'xsp2-final-release-canary-result-3','releaseCandidate':{'nexusRevision':'a1267ae186f74d5e21561e3b64fc7375d499132e','nodeRevision':'64709ce8f5f0ce80e2c0bab59b4476347825e57c','nexusImageSha256':'sha256:'+b,'agentArtifactSha256':a},'evidence':{'aiAssistedSecurityReviewResultSha256':s,'durabilityCarryForwardSha256':c,'previousFinalCanaryResultSha256':'b29fb94428b0c5fcfff776ee73cb808d6df0400dcc9b247f5ab7ca42c6f0f400','providerStorageRiskAcceptanceSha256':'49a311a8bf871c6afcaa5841622b9f1e28e74675452671abc4e970f644dec604'},'carryForwardDomains':['agentLifecycle','coordinatedRecovery','redactedObservability'],'rerunDomains':['productionActivationArtifactBinding','nexusFourImageRuntimeBundle','approvalV2NegativeControls'],'finalReleaseCanarySatisfied':True,'productionActivation':False,'strictPQEnabled':False,'legacyXMESH1Retired':False,'physicalPowerLossQualified':False}
          json.dump(x,open('final-release-canary-v3-result.json','w'),sort_keys=True,separators=(',',':'));open('final-release-canary-v3-result.json','a').write('\n');print(json.dumps(x,sort_keys=True,separators=(',',':')))
          PY
          sha256sum final-release-canary-v3-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: xsp-v2-final-release-canary-v3-result
          path: final-release-canary-v3-result.json
          if-no-files-found: error
          retention-days: 30
