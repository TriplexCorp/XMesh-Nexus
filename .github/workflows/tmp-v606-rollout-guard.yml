name: Temporary v6.0.6 rollout guard
'on':
  push:
    branches:
      - fix/agent-v6.0.6-future-repair
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-v6.0.6-future-repair
          fetch-depth: 0
      - name: Apply rollout guard
        run: |
          set -euo pipefail
          python3 scripts/tmp-v606-rollout-guard.py
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/xsp-v2-product-gateway/main.go scripts/check-agent-update.js docs/AGENT_RELEASE_POLICY.md
          git commit -m 'fix(agent): bind updater repair to commanded target'
          git push origin HEAD:fix/agent-v6.0.6-future-repair
