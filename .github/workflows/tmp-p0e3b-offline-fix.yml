name: Temporary P0-E3b offline toolbox fix

on:
  push:
    branches: [feat/xsp-v2-p0e3b-coordinated-backup-restore]
    paths: [".github/workflows/tmp-p0e3b-offline-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xsp-v2-p0e3b-coordinated-backup-restore
      - name: Fix toolbox bootstrap/offline boundary
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py"); s=p.read_text(); old="\"docker\", \"run\", \"-d\", \"--name\", toolbox, \"--network\", \"none\","; new="\"docker\", \"run\", \"-d\", \"--name\", toolbox,"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          python3 -c 'from pathlib import Path; p=Path("scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py"); s=p.read_text(); old="                timeout=900,\n            )\n\n            # Real protected panel_response"; new="                timeout=900,\n            )\n            # Bootstrap may use the runner network only to install/build dependencies.\n            # Every recovery identity/signature/checkpoint operation below runs offline.\n            command(\"docker\", \"network\", \"disconnect\", \"bridge\", toolbox, timeout=30)\n            networks = json.loads(command(\"docker\", \"inspect\", toolbox, \"--format\", \"{{json .NetworkSettings.Networks}}\").stdout)\n            if networks:\n                raise RuntimeError(f\"P0-E3b crypto toolbox retained a network after bootstrap: {networks}\")\n\n            # Real protected panel_response"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          python3 -m py_compile scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py
          git diff --check
      - name: Commit offline boundary fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py
          git commit -m 'fix(xsp-v2): bootstrap E3b toolbox before offline recovery'
          git push origin HEAD:feat/xsp-v2-p0e3b-coordinated-backup-restore
