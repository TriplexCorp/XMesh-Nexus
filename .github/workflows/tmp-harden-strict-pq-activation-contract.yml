name: Temporary strict-PQ activation contract hardening

on:
  push:
    branches:
      - release/strict-pq-activation-approval-contract

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/strict-pq-activation-approval-contract
          fetch-depth: 0

      - name: Apply exact hardening patch
        run: python3 scripts/tmp_harden_strict_pq_activation_contract.py

      - name: Verify, self-clean and push
        run: |
          python3 -m py_compile scripts/verify-xsp-v2-strict-pq-activation-approval.py
          git diff --check
          rm .github/workflows/tmp-harden-strict-pq-activation-contract.yml
          rm scripts/tmp_harden_strict_pq_activation_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-xsp-v2-strict-pq-activation-approval.py .github/workflows/xsp-strict-pq-activation-approval.yml .github/workflows/tmp-harden-strict-pq-activation-contract.yml scripts/tmp_harden_strict_pq_activation_contract.py
          git diff --cached --check
          git commit -m "security(xsp-v2): freeze activation approval contract bounds"
          git push origin HEAD:release/strict-pq-activation-approval-contract
