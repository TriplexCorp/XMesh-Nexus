name: Node GeoData and Routing checks
on:
  push:
    paths:
      - 'backend/src/node_geodata.rs'
      - 'backend/src/node_routing.rs'
      - 'backend/src/node_runtime.rs'
      - 'backend/src/main.rs'
      - 'backend/migrations/0025_node_geodata_status.sql'
      - 'frontend/js/core/app.js'
      - 'frontend/js/features/nodes/node-geodata.js'
      - 'frontend/styles/features/nodes/node-geodata.css'
      - 'frontend/js/features/nodes/node-routing.js'
      - 'frontend/styles/features/nodes/node-routing.css'
      - 'backend/Dockerfile'
      - 'backend/src/security.rs'
      - 'frontend/index.html'
      - 'frontend/styles/**'
      - 'scripts/ci/frontend-source.cjs'
      - '.github/workflows/geodata-check.yml'
  pull_request:
    paths:
      - 'backend/src/node_geodata.rs'
      - 'backend/src/node_runtime.rs'
      - 'backend/src/node_routing.rs'
      - 'frontend/js/core/app.js'
      - 'frontend/js/features/nodes/node-geodata.js'
      - 'frontend/styles/features/nodes/node-geodata.css'
      - 'frontend/js/features/nodes/node-routing.js'
      - 'frontend/styles/features/nodes/node-routing.css'
      - 'backend/Dockerfile'
      - 'backend/src/security.rs'
      - 'frontend/index.html'
      - 'frontend/styles/**'
      - 'scripts/ci/frontend-source.cjs'
      - '.github/workflows/geodata-check.yml'
  workflow_dispatch:
jobs:
  app-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard JavaScript
        run: |
          node --check frontend/js/core/app.js
          node --check frontend/js/features/nodes/node-geodata.js
          node --check frontend/js/features/nodes/node-routing.js
          node - <<'JS'
          const fs=require('fs');
          const assert=require('node:assert/strict');
          const {assertPackaged,panelStyles}=require('./scripts/ci/frontend-source.cjs');
          const html=fs.readFileSync('frontend/index.html','utf8');
          const rebasing=fs.readFileSync('backend/src/security.rs','utf8');
          const routing=fs.readFileSync('frontend/js/features/nodes/node-routing.js','utf8');
          const css=panelStyles();

          assertPackaged(assert,['node-geodata.js','node-geodata.css','node-routing.js','node-routing.css']);
          for(const name of ['node-geodata.js','node-routing.js']){
            if(!html.includes(name)||!rebasing.includes(name))
              throw new Error('Missing packaged or custom-path script asset: '+name);
          }
          for(const name of ['node-geodata.css','node-routing.css']){
            if(!rebasing.includes(name))
              throw new Error('Missing packaged or custom-path stylesheet asset: '+name);
          }
          assert(!html.includes('/node-geodata.css')&&!html.includes('/node-routing.css'),
            'Feature styles must stay behind the canonical panel CSS entrypoint');
          assert(css.includes('dialog#dlg.geo-modal'),'GeoData modal styles must be wired into the panel CSS graph');
          assert(css.includes('dialog#dlg.node-routing-modal'),'Node routing styles must be wired into the panel CSS graph');
          if(routing.includes('class="box route-json-workspace"'))
            throw new Error('Node routing JSON workspace must not nest the global .box modal shell');
          if(!routing.includes('class="route-json-workspace"'))
            throw new Error('Node routing JSON workspace shell is missing');
          if(!/\/js\/features\/nodes\/node-routing\.js\?v=[a-f0-9]{12}/.test(html))
            throw new Error('Node routing script must use a content-addressed cache key');
          if(!/\/js\/features\/nodes\/node-geodata\.js\?v=[a-f0-9]{12}/.test(html))
            throw new Error('Node GeoData script must use a content-addressed cache key');
          if(html.indexOf('node-geodata.js')>html.indexOf('/js/core/app.js'))
            throw new Error('Node GeoData runtime must load before core app.js');
          if(html.indexOf('node-routing.js')>html.indexOf('/js/core/app.js'))
            throw new Error('Node routing runtime must load before core app.js');

          // The general node form reads ENT.nodes.fs in full. Hidden GeoData
          // fields in that schema previously caused a null-input crash.
          const app=fs.readFileSync('frontend/js/core/app.js','utf8');
          const start=app.indexOf("nodes:{t:'Узлы'");
          const end=app.indexOf("  tpls:{",start);
          if(start<0||end<0)throw new Error('Cannot identify node schema');
          const fields=app.slice(start,app.indexOf('def:()=>',start));
          if(['geoEnabled','geoBlockAds','geoUpdateHours','geoSiteUrl','geoIpUrl','geoExtraSources','geoCustomRules']
            .some(key=>fields.includes("{k:'"+key+"'")))
            throw new Error('GeoData input leaked into the general node editor form schema');
          JS
      - name: Check installed agents
        run: |
          bash -n deploy/node-control-agent.sh
          bash -n deploy/update-node-control-agent.sh
  backend:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test GeoData and routing policies
        working-directory: backend
        run: |
          cargo test node_geodata
          cargo test node_routing
