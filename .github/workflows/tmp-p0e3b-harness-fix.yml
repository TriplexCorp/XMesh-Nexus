name: Temporary P0-E3b harness fixes

on:
  push:
    branches: [feat/xsp-v2-p0e3b-coordinated-backup-restore]
    paths: [".github/workflows/tmp-p0e3b-harness-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xsp-v2-p0e3b-coordinated-backup-restore
      - name: Apply exact harness fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py')
          s = p.read_text()
          replacements = {
              'command("go", "build", "-trimpath", "-o", str(tmp / "p0e3b-agent-helper"), "./cmd/p0e3b-helper",\n                    timeout=180, input_text=None, check=True)':
              'command("go", "-C", str(agent_module), "build", "-trimpath", "-o", str(tmp / "p0e3b-agent-helper"), "./cmd/p0e3b-helper",\n                    timeout=180, input_text=None, check=True)',
              'f"decode(\'{ack_digest}\',\'hex\'),decode(\'{signed_ack.read_bytes().hex()}\',\'hex\'),to_timestamp({receipt_template.stat().st_mtime_ns // 1_000_000}/1000.0));"':
              'f"decode(\'{ack_digest}\',\'hex\'),decode(\'{signed_ack.read_bytes().hex()}\',\'hex\'),to_timestamp({ack_message[\'issuedAtMs\'] + 500}/1000.0));"',
              'if create_checkpoint.returncode != 0:\n                raise RuntimeError("failed to create current owner/off-host recovery checkpoint")\n            checkpoint = json.loads((offhost / "current-checkpoint.json").read_text())':
              'if create_checkpoint.returncode != 0:\n                raise RuntimeError("failed to create current owner/off-host recovery checkpoint")\n            toolbox_run("chown", f"{host_uid}:{host_gid}", work_path(offhost / "current-checkpoint.json"))\n            checkpoint = json.loads((offhost / "current-checkpoint.json").read_text())',
          }
          for old, new in replacements.items():
              count = s.count(old)
              assert count == 1, (old[:80], count)
              s = s.replace(old, new)
          p.write_text(s)
          PY
          python3 -m py_compile scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py
          git diff --check
      - name: Commit harness fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-xsp-v2-p0e3b-coordinated-backup-restore.py
          git commit -m 'fix(xsp-v2): harden E3b harness runner plumbing'
          git push origin HEAD:feat/xsp-v2-p0e3b-coordinated-backup-restore
