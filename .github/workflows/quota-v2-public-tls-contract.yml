name: Quota V2 Nexus signed TLS authority interoperates with measured Node
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/quota_v2_public_tls_authority.rs'
      - 'backend/src/bin/quota_v2_ci_public_tls.rs'
      - 'backend/Cargo.toml'
      - '.github/workflows/quota-v2-public-tls-contract.yml'
  push:
    branches: ['**']
    paths:
      - 'backend/src/quota_v2_public_tls_authority.rs'
      - 'backend/src/bin/quota_v2_ci_public_tls.rs'
      - 'backend/Cargo.toml'
      - '.github/workflows/quota-v2-public-tls-contract.yml'
permissions:
  contents: read
jobs:
  strict-tls-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 829087a38fd6acd1570a78b27b7a203d4399f4d9
          path: .ci-reviewed-node
          persist-credentials: false
      - name: Require exact reviewed Node and absent public TLS deployment
        run: |
          test "$(git -C .ci-reviewed-node rev-parse HEAD)" = 829087a38fd6acd1570a78b27b7a203d4399f4d9
          test "$(cat .ci-reviewed-node/AGENT_VERSION)" = control-v6.0.35
          test -f .ci-reviewed-node/experiments/quota-v2-physical-stop/public_tls_frontend.py
          ! grep -E '^ExecStart=.*public_tls_frontend' .ci-reviewed-node/deploy/install-metered-services.sh
      - name: Test current Node signed TLS isolation and stop-only fail-closed behavior
        run: |
          set -euo pipefail
          python3 .ci-reviewed-node/tests/test_quota_v2_public_tls_frontend.py -v
          sudo python3 .ci-reviewed-node/tests/test_quota_v2_public_tls_certificates.py -v
          python3 .ci-reviewed-node/tests/test_quota_v2_public_tls_stop_monitor.py -v
          # No signed VLESS alias may outlive its actual installed Xray cap.
          # The watcher and its stop-only monitor cannot issue TLS authority.
          python3 .ci-reviewed-node/tests/test_quota_v2_public_tls_cap_watch.py -v
          python3 .ci-reviewed-node/tests/test_quota_v2_public_tls_preflight.py -v
          # Agent must read the real signed-cap state from the measured Xray
          # through a PID-bound, root-private Unix socket. It is never
          # evidence of positive public TLS authorization or off-host WAL.
          python3 .ci-reviewed-node/tests/test_quota_v2_cap_observation.py -v
          test -f .ci-reviewed-node/experiments/xray-dataplane-fence/experimental_cap_socket.go.txt
          test -f .ci-reviewed-node/experiments/quota-v2-physical-stop/cap_install.py
          # This independent compatibility test must never install a public
          # service. Positive ingress still needs runtime cap/WAL admission,
          # a root-owned supervisor and continuous authenticated revocation.
          ! grep -E '^ExecStart=.*public_tls_(frontend|stop_monitor)' \
            .ci-reviewed-node/deploy/install-metered-services.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Nexus real Ed25519 signer and rejected authorizations
        run: cargo test --manifest-path backend/Cargo.toml quota_v2_public_tls_authority -- --nocapture
      - name: Cross-verify ephemeral Nexus signature with strict Node
        env:
          GITHUB_ACTIONS: 'true'
          RUNNER_ENVIRONMENT: github-hosted
          XMESH_AUDIT_DISPOSABLE: '1'
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/public-tls-contract"
          python3 - "$RUNNER_TEMP/profile-sha" <<'PY'
          import hashlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / ".ci-reviewed-node/tests"))
          from test_quota_v2_public_tls_frontend import profile
          import wal_transport
          Path(sys.argv[1]).write_text(
              hashlib.sha256(wal_transport.observed.canonical(profile())).hexdigest())
          PY
          digest="$(cat "$RUNNER_TEMP/profile-sha")"
          cargo run --quiet --manifest-path backend/Cargo.toml \
            --features quota-v2-disposable-cap-issuer \
            --bin quota-v2-ci-public-tls -- \
            "$digest" "$RUNNER_TEMP/public-tls-contract"
          python3 - "$RUNNER_TEMP/public-tls-contract" <<'PY'
          import copy, json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / ".ci-reviewed-node/tests"))
          from test_quota_v2_public_tls_frontend import profile
          import public_tls_frontend as tls
          root = Path(sys.argv[1])
          raw = (root / "public-tls-authority.json").read_bytes()
          key = (root / "policy-public-key.txt").read_text()
          kw = dict(node=47, activation="a"*64, genesis_sha="b"*64,
                    runtime_id="c"*64, pinned=key, now_ms=1_800_000_000_000)
          config = tls.compile_signed_public_tls(profile(), raw, **kw)
          assert {x["tag"] for x in config["inbounds"]} == {"vless-main","vless-cdn"}
          assert all(x["listen"] == "0.0.0.0" and x["streamSettings"]["security"] == "tls"
                     for x in config["inbounds"])
          assert all(x["settings"]["vnext"][0]["address"] == "xmesh-meter.invalid"
                     for x in config["outbounds"][1:])
          for changed in (
              dict(kw, runtime_id="d"*64), dict(kw, genesis_sha="f"*64),
              dict(kw, activation="f"*64), dict(kw, pinned="e"*64),
              dict(kw, now_ms=1_800_000_060_000),
          ):
              try:
                  tls.compile_signed_public_tls(profile(), raw, **changed)
              except ValueError:
                  continue
              raise AssertionError("foreign identity or expired authority accepted")
          changed_profile = copy.deepcopy(profile())
          changed_profile["inbounds"][0]["settings"]["clients"][0]["id"] = (
              "33333333-3333-4333-8333-333333333333")
          try:
              tls.compile_signed_public_tls(changed_profile, raw, **kw)
          except ValueError:
              pass
          else:
              raise AssertionError("revised Xray roster acquired foreign TLS authorization")
          altered = json.loads(raw)
          altered["payload"]["bindings"][0]["port"] = 12345
          try:
              tls.compile_signed_public_tls(profile(), json.dumps(altered).encode(), **kw)
          except ValueError:
              pass
          else:
              raise AssertionError("unsigned public port change accepted")
          print("PASS: real Nexus Ed25519 -> Node runtime/profile-bound TLS authority; no listener started")
          PY
