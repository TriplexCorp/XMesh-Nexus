name: Temporary P0-E3a docs checkpoint

on:
  push:
    branches:
      - docs/p0e3a-checkpoint-p0e3b-current

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0e3a-checkpoint-p0e3b-current
          fetch-depth: 1
      - name: Update README and roadmap checkpoint
        run: python3 .github/scripts/update-p0e3a-docs.py
      - name: Validate and commit docs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- README.md README.en.md docs/ENTERPRISE_ROADMAP.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md docs/ENTERPRISE_ROADMAP.md
          git diff --cached --quiet && { echo "no docs changes produced" >&2; exit 1; }
          git commit -m "docs(xsp-v2): checkpoint P0-E3a and start P0-E3b"
          git push origin HEAD:docs/p0e3a-checkpoint-p0e3b-current
