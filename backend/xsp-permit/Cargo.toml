[package]
name = "xmesh-xsp-permit"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "xsp-v2-permit-signer"
path = "../src/bin/xsp_v2_permit_signer.rs"
required-features = ["xsp-v2-experimental"]
test = false

[[bin]]
name = "xsp-v2-permit-operator"
path = "../src/bin/xsp_v2_permit_operator.rs"
required-features = ["xsp-v2-experimental"]
test = false

[features]
default = []
xsp-v2-experimental = ["dep:openssl"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
openssl = { version = "=0.10.81", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
