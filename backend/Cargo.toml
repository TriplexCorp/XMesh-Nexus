[package]
name = "xmesh-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
ed25519-dalek = "2"
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"
subtle = "2.6"
axum = { version = "0.8.9", features = ["macros"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "time", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
