[package]
name = "xmesh-api"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "xmesh-api"
path = "src/main.rs"

[[bin]]
name = "quota-v2-ci-signed-cap"
path = "src/bin/quota_v2_ci_signed_cap.rs"
required-features = ["quota-v2-disposable-cap-issuer"]

[[bin]]
name = "xsp-v2-recovery-checkpoint"
path = "src/bin/xsp_v2_recovery_checkpoint.rs"
required-features = ["xsp-v2-experimental"]

[[bin]]
name = "xsp-v2-observability"
path = "src/bin/xsp_v2_observability.rs"
required-features = ["xsp-v2-observability"]

[features]
default = []
# CI-only PostgreSQL -> real PolicySigner, absent from production Docker and
# default builds. Positive result is NOT a shipping XSP/2 admission endpoint.
quota-v2-disposable-cap-issuer = []
# Build only in an audited OpenSSL 3.5+ environment; disabled in production Docker.
xsp-v2-experimental = ["dep:openssl"]
# Operator-only read path; disabled by default and not built into production Docker.
xsp-v2-observability = []

[dependencies]
openssl = { version = "=0.10.81", optional = true }
base64 = "0.22"
anyhow = "1"
argon2 = "0.5"
ed25519-dalek = "2"
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"
subtle = "2.6"
axum = { version = "0.8.9", features = ["macros"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "time", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

# SQLx 0.9.0 includes the SQLite driver in the resolved Cargo.lock even though
# the Nexus runtime enables PostgreSQL only. The released sqlite driver pins
# libsqlite3-sys below the fixed 0.39.x series (RUSTSEC-2026-0459).
# Use upstream's narrowly reviewed compatibility change (#4502), pinned to
# an immutable commit. It only broadens the optional driver's dependency range;
# no SQLite driver is enabled in the production API.
# Drop this override once a released SQLx version contains upstream #4502.
[patch.crates-io]
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
