name: xmesh-nexus

services:
  db:
    image: timescale/timescaledb:2.30.0-pg18
    environment:
      POSTGRES_DB: xmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./install.sh first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run ./install.sh first}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/10-create-app-user.sh:/docker-entrypoint-initdb.d/10-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xmesh"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?Run ./install.sh first}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./install.sh first}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  panel:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ADDR: 0.0.0.0:8080
      STATIC_DIR: /app/static
      CORE_DATA_DIR: /var/lib/xmesh/core
      DATABASE_URL: postgresql://xmesh_app:${APP_DB_PASSWORD:?Run ./install.sh first}@db:5432/xmesh
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run ./install.sh first}@redis:6379/0
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run ./install.sh first}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DASHBOARD_PATH: ${DASHBOARD_PATH:?Run ./install.sh first}
      DASHBOARD_PATH_MIRROR: /run/xmesh/dashboard-path
      PANEL_UPDATE_REQUEST: /run/xmesh/panel-update-request
      PANEL_UPDATE_STATUS: /run/xmesh/panel-update-status
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      SUBSCRIPTION_ENCRYPTION_KEY: ${SUBSCRIPTION_ENCRYPTION_KEY:?Run ./install.sh to provision subscription key}
      XSP_V2_SIGNER_SOCKET_PATH: /run/xmesh-signer/signer.sock
      XSP_V2_P0D_AGENT_MIGRATION: ${XSP_V2_P0D_AGENT_MIGRATION:-}
      RUST_LOG: info,tower_http=info,sqlx=warn
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - core_data:/var/lib/xmesh
      - ./deploy/runtime/dashboard-path:/run/xmesh/dashboard-path:rw
      - ./deploy/runtime/panel-update-request:/run/xmesh/panel-update-request:rw
      - ./deploy/runtime/panel-update-status:/run/xmesh/panel-update-status:ro
      - xsp_v2_signer_socket:/run/xmesh-signer
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  xsp-v2-signer:
    # Opt-in only. The default production stack does not start this component.
    profiles: ["xsp-v2-staging"]
    build:
      context: .
      dockerfile: backend/Dockerfile.xsp-signer
    command: ["--xsp-v2-signer"]
    environment:
      XSP_V2_SIGNER_DATABASE_URL: ${XSP_V2_SIGNER_DATABASE_URL:-}
      XSP_V2_SIGNER_SOCKET_PATH: /run/xmesh-signer/signer.sock
      XSP_V2_SIGNER_ED25519_KEY_FILE: /run/xmesh-signer-keys/panel-ed25519.pem
      XSP_V2_SIGNER_MLDSA65_KEY_FILE: /run/xmesh-signer-keys/panel-mldsa65.pem
      XSP_V2_SIGNER_EXPECTED_ED_KEY_ID: ${XSP_V2_SIGNER_EXPECTED_ED_KEY_ID:-}
      XSP_V2_SIGNER_EXPECTED_PQ_KEY_ID: ${XSP_V2_SIGNER_EXPECTED_PQ_KEY_ID:-}
      XSP_V2_SIGNER_ISSUER_ID: ${XSP_V2_SIGNER_ISSUER_ID:-xmesh-nexus-panel}
      RUST_LOG: warn,sqlx=error
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - xsp_v2_signer_socket:/run/xmesh-signer
      - ${XSP_V2_SIGNER_KEYS_DIR:-/etc/xmesh-nexus/xsp-v2-signer}:/run/xmesh-signer-keys:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  core_data:
  xsp_v2_signer_socket:
