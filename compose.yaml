name: xmesh-nexus

services:
  db:
    image: timescale/timescaledb:2.30.0-pg18
    environment:
      POSTGRES_DB: xmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./install.sh first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run ./install.sh first}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/10-create-app-user.sh:/docker-entrypoint-initdb.d/10-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xmesh"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?Run ./install.sh first}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./install.sh first}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  panel:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ADDR: 0.0.0.0:8080
      STATIC_DIR: /app/static
      CORE_DATA_DIR: /var/lib/xmesh/core
      DATABASE_URL: postgresql://xmesh_app:${APP_DB_PASSWORD:?Run ./install.sh first}@db:5432/xmesh
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run ./install.sh first}@redis:6379/0
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run ./install.sh first}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_LEGACY_NODE_BEARER: ${ALLOW_LEGACY_NODE_BEARER:-false}
      DASHBOARD_PATH: ${DASHBOARD_PATH:?Run ./install.sh first}
      DASHBOARD_PATH_MIRROR: /run/xmesh/dashboard-path
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      RUST_LOG: info,tower_http=info,sqlx=warn
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - core_data:/var/lib/xmesh
      - ./deploy/runtime/dashboard-path:/run/xmesh/dashboard-path:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  core_data:
