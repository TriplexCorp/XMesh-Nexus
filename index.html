<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XMesh Nexus — Infrastructure Control</title>
<meta name="description" content="XMesh Nexus is a refined control panel for Xray VPN infrastructure.">
<meta name="theme-color" content="#090a0c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo" id="lg">X</div><b class="bt" id="bn">XMesh Nexus</b></div>
  <nav id="nav" aria-label="Разделы"></nav>
  <div class="core"><div class="ct"><span class="dot" id="cd" style="--c:var(--mu);animation:none"></span><div><b>Xray-core</b><small id="cs">API не подключён</small></div></div><button id="restart" aria-label="Перезапустить ядро"></button></div>
</aside>
<div class="wrap">
  <header class="top">
    <h1 id="title"></h1>
    <button class="search" id="pal" aria-label="Поиск и команды"><span id="si"></span><span>Поиск и команды</span><kbd>Ctrl K</kbd></button>
    <div class="tl"><button class="ib" id="theme" aria-label="Сменить тему"></button><button class="ib" id="bell" aria-label="Уведомления"></button><button class="btn" data-nu id="addb"></button></div>
  </header>
  <main id="view" class="view"></main>
</div>
</div>
<div class="bulk" id="bulk" role="toolbar" aria-label="Массовые действия"></div>
<dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
