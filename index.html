<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XMesh Nexus — Infrastructure Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1318;--s1:#151b23;--s2:#1d252f;--ln:rgba(200,215,235,.1);--tx:#e8edf4;--mu:#a6b0c0;--a:#6fd8c3;--b:#a0a2f6;--c3:#7fb3e8;--c4:#ebbd7a;--ok:#7bd8a4;--wr:#ebbd7a;--er:#f0899a;--ink:#0e1318;color-scheme:dark}
[data-theme=light]{--bg:#eeece7;--s1:#f8f6f2;--s2:#ebe8e2;--ln:rgba(30,40,55,.13);--tx:#1d2430;--mu:#556070;--a:#12806d;--b:#5558d0;--c3:#2a6fb0;--c4:#a56d12;--ok:#1f8a52;--wr:#a56d12;--er:#bb3f50;--ink:#f8f6f2;color-scheme:light}
[data-accent=ocean]{--a:#7fb3e8;--b:#6fd8c3}[data-accent=amber]{--a:#ebbd7a;--b:#f0899a}[data-accent=rose]{--a:#f0a0c4;--b:#a0a2f6}
[data-theme=light][data-accent=ocean]{--a:#2a6fb0;--b:#12806d}[data-theme=light][data-accent=amber]{--a:#a56d12;--b:#bb3f50}[data-theme=light][data-accent=rose]{--a:#b0386f;--b:#5558d0}
[data-accent=violet]{--a:#b7a1ff;--b:#83d9ed}[data-accent=emerald]{--a:#60d6a2;--b:#c3e879}[data-accent=cyan]{--a:#63dff2;--b:#7fa8ff}[data-accent=ruby]{--a:#ff8aa7;--b:#d4a1ff}
[data-theme=light][data-accent=violet]{--a:#7050cb;--b:#167b9a}[data-theme=light][data-accent=emerald]{--a:#168657;--b:#6b8e12}[data-theme=light][data-accent=cyan]{--a:#087d9b;--b:#345fc6}[data-theme=light][data-accent=ruby]{--a:#b92f61;--b:#7046bc}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(clamp(15px,.5vw + 9px,20px)*var(--ts,1))}
body{font:1rem/1.5 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;transition:background .5s,color .5s}
body::before,body::after{content:"";position:fixed;width:62vmax;height:62vmax;border-radius:50%;filter:blur(100px);z-index:-1;pointer-events:none;animation:drift 32s ease-in-out infinite alternate}
body::before{background:radial-gradient(circle,color-mix(in srgb,var(--a) 14%,transparent),transparent 65%);top:-28vmax;left:-14vmax}
body::after{background:radial-gradient(circle,color-mix(in srgb,var(--b) 14%,transparent),transparent 65%);bottom:-32vmax;right:-16vmax;animation-delay:-14s}
@keyframes drift{to{transform:translate(9vmax,6vmax) scale(1.18)}}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.mu{color:var(--mu)}.er{color:var(--er)}small{font-size:.88rem}
.ic{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:15.5rem minmax(0,1fr);min-height:100dvh}
aside{position:sticky;top:0;height:100dvh;padding:1.3rem .9rem;display:flex;flex-direction:column;gap:1rem;border-right:1px solid var(--ln);background:color-mix(in srgb,var(--s1) 55%,transparent);backdrop-filter:blur(20px);z-index:20;overflow-y:auto}
.brand{display:flex;align-items:center;gap:.7rem;padding:0 .5rem;font-size:1.2rem;font-weight:600}
.logo{width:2.1rem;height:2.1rem;border-radius:.65rem;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));color:var(--ink);font-weight:700}
nav{display:flex;flex-direction:column;gap:.15rem}
nav .g{font-size:.8rem;color:var(--mu);padding:.8rem .8rem .25rem;opacity:.85}
nav a,nav .more{position:relative;display:flex;align-items:center;gap:.8rem;padding:.55rem .8rem;border-radius:.7rem;color:var(--mu);text-decoration:none;transition:background .2s,color .2s}
nav a:hover{color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent)}
nav a.on{color:var(--tx);background:var(--s2)}
nav a.on::before{content:"";position:absolute;left:-.9rem;top:.55rem;bottom:.55rem;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--a),var(--b))}
nav em{margin-left:auto;font-style:normal;font-size:.85rem}.more{display:none}
.core{margin-top:auto;padding:.9rem;border-radius:1rem;background:var(--s2);display:grid;gap:.8rem}
.ct{display:flex;align-items:center;gap:.7rem}.ct small{display:block;color:var(--mu)}
.core button{padding:.5rem;border-radius:.65rem;background:color-mix(in srgb,var(--tx) 8%,transparent);display:flex;justify-content:center;gap:.5rem;transition:background .2s}
.core button:hover{background:color-mix(in srgb,var(--tx) 14%,transparent)}
.spin .ic{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--c,var(--ok));flex:none;animation:ping 2.4s infinite;display:inline-block}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c,var(--ok)) 55%,transparent)}100%{box-shadow:0 0 0 .6rem transparent}}

.wrap{padding:1.5rem clamp(1rem,2.5vw,2.6rem) 4rem;width:100%;max-width:120rem;margin-inline:auto}
.top{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1.3rem}
h1{font-size:1.7rem;font-weight:600;letter-spacing:-.02em;margin-right:auto}
.search{display:flex;align-items:center;gap:.6rem;padding:0 .9rem;height:2.8rem;width:min(21rem,100%);border-radius:.8rem;background:var(--s1);border:1px solid var(--ln);color:var(--mu);text-align:left;transition:border-color .2s}
.search:hover,.search:focus-within{border-color:var(--a)}.search span,.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--mu)}.search input{color:var(--tx)}
kbd{font:inherit;font-size:.82rem;padding:0 .5rem;border-radius:.4rem;background:var(--s2);color:var(--mu)}
.tl{display:flex;gap:.6rem}
.ib{width:2.8rem;height:2.8rem;border-radius:.8rem;display:grid;place-items:center;background:var(--s1);border:1px solid var(--ln);color:var(--mu);position:relative;transition:color .2s,transform .2s}.ib:hover{color:var(--tx);transform:translateY(-1px)}
.pip{position:absolute;top:.55rem;right:.6rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--er);border:2px solid var(--s1)}
[data-theme=dark] .sun,[data-theme=light] .moon{display:none}
.btn{height:2.8rem;padding:0 1.2rem;border-radius:.8rem;font-weight:600;color:var(--ink);background:linear-gradient(135deg,var(--a),var(--b));display:inline-flex;align-items:center;justify-content:center;gap:.5rem;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px -12px var(--a);white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px -10px var(--a)}
.gh,.dg{height:2.8rem;padding:0 1.1rem;border-radius:.8rem;background:var(--s2);border:1px solid var(--ln);display:inline-flex;align-items:center;justify-content:center;gap:.5rem;transition:background .2s;white-space:nowrap}
.gh:hover{background:color-mix(in srgb,var(--tx) 10%,var(--s2))}.dg{color:var(--er)}.dg:hover{background:color-mix(in srgb,var(--er) 16%,var(--s2))}
.sm{height:2.3rem;padding:0 .85rem;font-size:.92rem}

.view{display:grid;gap:1.1rem}
.view>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}.view>:nth-child(2){animation-delay:.08s}.view>:nth-child(3){animation-delay:.16s}.view>:nth-child(n+4){animation-delay:.24s}.view.still>*{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.sk{border-radius:.7rem;background:linear-gradient(90deg,var(--s1),color-mix(in srgb,var(--tx) 8%,var(--s1)),var(--s1));background-size:200% 100%;animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:1.1rem;padding:1.3rem;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1.1rem}.two.b{grid-template-columns:repeat(2,minmax(0,1fr))}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
h3{font-size:1.1rem;font-weight:600}.hd p,.note{color:var(--mu);font-size:.95rem}
.bar2{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}.bar2>.note{margin-right:auto}

.strip{display:grid;grid-template-columns:repeat(4,1fr);padding:.5rem 0}
.stat{position:relative;padding:.8rem 1.4rem;display:grid;gap:.2rem;align-content:start;border-left:1px solid var(--ln)}.stat:first-child{border-left:0}
.val{font-size:2.1rem;font-weight:600;letter-spacing:-.03em;line-height:1.2}.val small{font-size:1rem;font-weight:500;color:var(--mu);margin-left:.4rem;letter-spacing:0}
.spark{position:absolute;right:1.2rem;top:1rem;width:5.5rem;height:2.4rem}
.sa{fill:currentColor;opacity:.12}.sl{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s .4s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
.chip{display:inline-block;width:fit-content;padding:.05rem .65rem;border-radius:99px;font-size:.88rem;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}

.live{display:flex;gap:1.5rem;align-items:baseline;flex-wrap:wrap}
.lg{display:flex;align-items:baseline;gap:.5rem;color:var(--mu)}.lg b{font-size:1.8rem;font-weight:600;letter-spacing:-.03em;color:var(--c)}.lg i{width:.6rem;height:.6rem;border-radius:3px;background:var(--c);align-self:center}
.seg{display:flex;padding:.2rem;border-radius:.7rem;background:var(--s2);flex-wrap:wrap}
.seg button{padding:.3rem .85rem;border-radius:.55rem;color:var(--mu);transition:background .25s,color .25s}.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 6px rgba(0,0,0,.2)}
.plot{position:relative}
#ch{display:block;width:100%;height:clamp(13rem,30vh,24rem);overflow:hidden}#ch path{vector-effect:non-scaling-stroke}
#cg{animation:scroll 1s linear forwards}@keyframes scroll{to{transform:translateX(calc(-1*var(--dx)))}}
.yl{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;padding:.2rem 0 .5rem;font-size:.85rem;color:var(--mu);pointer-events:none}
.donutw{display:flex;align-items:center;gap:1.6rem;flex-wrap:wrap}
.donut{position:relative;width:9.5rem;height:9.5rem;flex:none}.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:13;stroke-dasharray:0 100;transition:stroke-dasharray 1.6s cubic-bezier(.2,.8,.2,1)}
.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--mu);font-size:.9rem}.donut b{font-size:1.5rem;color:var(--tx)}
.leg{display:grid;gap:.6rem;flex:1;min-width:11rem}.leg div{display:flex;align-items:center;gap:.6rem}.leg i{width:.65rem;height:.65rem;border-radius:3px;background:var(--c)}.leg span:last-child{margin-left:auto;color:var(--mu)}
.rowi{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--ln)}.rowi:first-of-type{border-top:0}.rowi>div{flex:1;min-width:0}
.big{font-size:1.9rem;font-weight:600;letter-spacing:-.03em}

.fl{display:flex;gap:.4rem;flex-wrap:wrap;margin-right:auto}
.fl button{padding:.35rem .9rem;border-radius:99px;border:1px solid var(--ln);background:var(--s1);color:var(--mu);transition:.2s}.fl button:hover{color:var(--tx)}.fl button b{font-weight:500;opacity:.7;margin-left:.3rem}
.fl button.on{background:color-mix(in srgb,var(--a) 18%,var(--s1));color:var(--tx);border-color:color-mix(in srgb,var(--a) 50%,transparent)}
.tw{overflow-x:auto;margin:0 -.4rem}table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--mu);padding:.3rem .8rem .7rem;font-size:.95rem;white-space:nowrap}th button{color:inherit;font-weight:inherit}th button:hover{color:var(--tx)}
td{padding:.7rem .8rem;border-top:1px solid var(--ln);white-space:nowrap;vertical-align:middle}
tbody tr[data-id],tbody tr[data-e]{cursor:pointer;transition:background .2s}tbody tr[data-id]:hover,tbody tr[data-e]:hover{background:color-mix(in srgb,var(--tx) 5%,transparent)}
tr.sel{background:color-mix(in srgb,var(--a) 9%,transparent)}
input[type=checkbox]{accent-color:var(--a);width:1.05rem;height:1.05rem;cursor:pointer}.c1{width:2.4rem}
.who{display:flex;align-items:center;gap:.8rem;font-weight:500}.who small{display:block;font-weight:400}
.av{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#10151b;flex:none}
.pb{width:min(8rem,30vw);height:.45rem;border-radius:9px;background:var(--s2);overflow:hidden}.pb.f{width:100%}.pb i{display:block;height:100%;width:var(--w);border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b));animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both;transition:width .8s}
.pb.wr i{background:var(--wr)}.pb.er i{background:var(--er)}@keyframes grow{from{width:0}}
.tr{display:flex;align-items:center;gap:.7rem}.tr small{color:var(--mu);min-width:5.5rem}
.empty{padding:2.2rem 1rem;text-align:center;color:var(--mu);display:grid;gap:.8rem;justify-items:center}
.pg{display:flex;align-items:center;gap:.6rem;justify-content:flex-end;padding-top:1rem;flex-wrap:wrap;color:var(--mu)}.pg select{width:auto;height:2.3rem}
.bulk{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,160%);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:center;padding:.6rem .8rem;border-radius:1rem;background:var(--s2);border:1px solid var(--ln);box-shadow:0 20px 50px -14px rgba(0,0,0,.6);transition:transform .45s cubic-bezier(.2,.9,.3,1.15);z-index:30;max-width:calc(100vw - 1.5rem)}.bulk.on{transform:translate(-50%,0)}
.ia{width:2.3rem;height:2.3rem;border-radius:.6rem;display:grid;place-items:center;color:var(--mu);transition:.2s}.ia:hover{color:var(--tx);background:var(--s2)}.ia:disabled{opacity:.3;pointer-events:none}
.sw{position:relative;width:2.8rem;height:1.6rem;display:inline-block;flex:none}.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1;margin:0;width:100%;height:100%}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--s2);border:1px solid var(--ln);transition:background .3s}
.sw span::after{content:"";position:absolute;top:.2rem;left:.22rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--mu);transition:transform .35s cubic-bezier(.3,1.5,.5,1),background .3s}
.sw input:checked+span{background:color-mix(in srgb,var(--a) 32%,transparent)}.sw input:checked+span::after{transform:translateX(1.15rem);background:var(--a)}
.sw input:focus-visible+span{outline:2px solid var(--a);outline-offset:2px}

.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:1.1rem}
.nc{display:grid;gap:1rem;transition:opacity .3s}.nc.off{opacity:.6}.nc .h{display:flex;align-items:center;gap:.8rem}.nc .h>div{flex:1;min-width:0}.fg{font-size:1.9rem;line-height:1}
.mb{display:grid;gap:.35rem}.mb>div{display:flex;justify-content:space-between;color:var(--mu);font-size:.92rem}.mb b{color:var(--tx);font-weight:500}
.kvg{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}.kvg span{display:block;color:var(--mu);font-size:.9rem}
.acts{display:flex;gap:.5rem;flex-wrap:wrap}
.ll{display:grid;grid-template-columns:5.5rem 4.6rem 1fr;gap:.8rem;align-items:baseline;padding:.45rem 0;border-top:1px solid var(--ln);font-size:.95rem;word-break:break-word}.ll time{color:var(--mu)}
.logs{max-height:calc(100dvh - 19rem);min-height:16rem;overflow:auto}
.sg{display:grid;gap:1.2rem}.sg>div{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-top:1.1rem;border-top:1px solid var(--ln)}.sg>div:first-child{border:0;padding:0}.sg small{display:block;color:var(--mu)}
.swt{display:flex;gap:.7rem}.swt button{width:2.1rem;height:2.1rem;border-radius:50%;background:linear-gradient(135deg,var(--x),var(--y));border:2px solid transparent;transition:transform .2s}.swt button.on{outline:2px solid var(--tx);outline-offset:3px}.swt button:hover{transform:scale(1.1)}
input[type=range]{accent-color:var(--a);width:min(14rem,100%);height:auto;padding:0;border:0;background:none}

dialog{border:0;padding:0;background:none;color:var(--tx);max-width:none;max-height:none;overflow:visible}
dialog::backdrop{background:rgba(6,10,14,.55);backdrop-filter:blur(6px);animation:fade .3s}
dialog[open]{animation:pop .35s cubic-bezier(.2,.9,.3,1.1)}
dialog:not(.side):not(.pop):not(.pal):not(.user-modal){margin:auto;width:min(30rem,calc(100vw - 2rem))}dialog.wide{width:min(44rem,calc(100vw - 2rem))!important}
dialog.side{margin:0 0 0 auto;width:min(33rem,100vw);height:100dvh;animation:slide .4s cubic-bezier(.2,.9,.3,1)}dialog.side .box{height:100%;border-radius:1.2rem 0 0 1.2rem;max-height:none}
dialog.pop{margin:5rem 1.5rem auto auto;width:min(25rem,calc(100vw - 2rem))}dialog.pal{margin:9vh auto auto;width:min(38rem,calc(100vw - 2rem))}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}@keyframes slide{from{transform:translateX(100%)}}@keyframes fade{from{opacity:0}}
.box{background:var(--s1);border:1px solid var(--ln);border-radius:1.2rem;padding:1.5rem;display:grid;gap:1.1rem;align-content:start;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);max-height:calc(100dvh - 2rem);overflow:auto}
.box h2{font-size:1.35rem;font-weight:600}
.f{display:grid;gap:.4rem;min-width:0}.f>span{color:var(--mu);font-size:.92rem}.f small{color:var(--mu)}
input:not([type=checkbox]):not([type=range]),select,textarea{height:2.8rem;padding:0 .9rem;border-radius:.7rem;background:var(--s2);border:1px solid var(--ln);width:100%}
textarea{height:auto;padding:.8rem;font:.88rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;white-space:pre}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);border-color:transparent}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}.act{display:flex;gap:.7rem;justify-content:flex-end;flex-wrap:wrap}.act.sp>*{flex:1}
.ms{display:flex;flex-wrap:wrap;gap:.5rem}.ck{display:flex;align-items:center;gap:.45rem;padding:.3rem .8rem;border-radius:99px;border:1px solid var(--ln);background:var(--s2);cursor:pointer;transition:.2s}.ck:has(input:checked){border-color:color-mix(in srgb,var(--a) 60%,transparent);background:color-mix(in srgb,var(--a) 16%,var(--s2))}
.qr{width:11rem;border-radius:.8rem;background:#fff;padding:.5rem;justify-self:center}.qr svg{display:block;width:100%}
.lk{display:flex;gap:.5rem}.lk input{font-size:.88rem}
.nt{display:grid;padding:.7rem 0;border-top:1px solid var(--ln)}.nt:first-of-type{border:0}
.pi{display:flex;width:100%;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:.7rem;text-align:left}.pi.on{background:var(--s2)}.pi em{margin-left:auto;font-style:normal;color:var(--mu);font-size:.85rem}
.uc{display:flex;gap:2px;align-items:flex-end;height:3.2rem}.uc i{flex:1;background:linear-gradient(var(--a),var(--b));border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
#toast{position:fixed;left:50%;bottom:1.6rem;transform:translate(-50%,30px);opacity:0;display:flex;align-items:center;gap:1rem;padding:.7rem 1.1rem;border-radius:.9rem;background:var(--s2);border:1px solid var(--ln);box-shadow:0 16px 40px -12px rgba(0,0,0,.5);transition:.45s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;z-index:99;max-width:calc(100vw - 2rem)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{color:var(--a);font-weight:600}
[data-motion=off] *,[data-motion=off] ::before,[data-motion=off] ::after{animation-duration:.01ms!important;transition-duration:.01ms!important}

@media(max-width:1100px){
 .app{grid-template-columns:4.8rem minmax(0,1fr)}aside{padding:1.2rem .5rem;align-items:center}.lbl,.bt,nav em,.ct>div,nav .g{display:none}nav a{padding:.75rem}nav a.on::before{left:-.5rem}.brand{padding:0}.ct{justify-content:center}
 .two,.two.b{grid-template-columns:minmax(0,1fr)}.strip{grid-template-columns:repeat(2,1fr)}.stat:nth-child(odd){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--ln);padding-top:1.2rem;margin-top:.5rem}}

function setNodeGauge(key,pct,center,detail){

function drawNodeLive(){DB.nodes.forEach(n=>{

  else if(b=g('[data-del]')){const [k,id]=b.dataset.del.split(':'),e=ENT[k],r=DB[k].find(x=>x.id==id),m=e.guard?.(r);if(m)return $('#fe').textContent=m;if(!b.dataset.s){b.dataset.s=1;b.lastChild.textContent='Точно удалить?';return}await api.remove(k,id);dlg.close();toast('Удалено');render(1)}
  else if(b=g('[data-nr]')){toast('Перезапуск требует подключённого backend/API Xray. В автономном HTML он не выполняется.')}
  else if(b=g('[data-nt]')){const n=DB.nodes.find(x=>x.id==b.dataset.nt);await api.update('nodes',n.id,{disabled:!n.disabled});toast(`${n.name}: ${n.disabled?'отключён':'включён'}`);render(1)}
  else if(b=g('[data-tt]')){TP.tab=b.dataset.tt;TP.q='';TP.f='';render(1)}
  else if(b=g('[data-lv]')){}
  else if(b=g('[data-th]')){C.theme=b.dataset.th;apply();$$('#th button').forEach(x=>x.classList.toggle('on',x==b))}
  else if(b=g('[data-ac]')){C.accent=b.dataset.ac;apply();$$('[data-ac]').forEach(x=>x.classList.toggle('on',x==b))}
  else if(b=g('[data-ui]')){const prop=b.dataset.ui,value=b.dataset.value;if(prop&&value){C[prop]=value;apply();$$(`[data-ui="${prop}"]`).forEach(x=>x.classList.toggle('on',x==b))}}
  else if(g('#rs')){C={...CDEFAULT};apply();render(1);toast('Оформление сброшено')}
  else if(g('#gx')){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='xmesh-nexus-backup.json';a.click()}
  else if(b=g('[data-cf]')){dlg.close();CF&&CF()}
  else if(b=g('[data-pi]')){const x=PI[+b.dataset.pi];if(x){dlg.close();x.r()}}
  else if(g('#more'))modal(`<div class="box"><h2>Разделы</h2>${FLAT.map(([k,i,l])=>`<button class="pi" data-go="${k}">${ic(i)}<span>${l}</span></button>`).join('')}</div>`);
  else if(b=g('[data-go]')){dlg.close();location.hash=b.dataset.go}
  else if(g('#pal'))palette();
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.tg){const [k,id]=t.dataset.tg.split(':');await api.update(k,id,{disabled:!t.checked});toast(t.checked?'Включено':'Отключено')}
  else if(t.dataset.usq){const [ui,si]=t.dataset.usq.split(':').map(Number),u=DB.users.find(x=>x.id==ui);await api.update('users',ui,{squads:t.checked?[...new Set([...u.squads,si])]:u.squads.filter(x=>x!=si)});toast('Доступ обновлён');render(1);userDrawer(ui,'acc')}
  else if(t.dataset.hw){await api.update('users',+t.dataset.hw,{hwid:+t.value||0});toast('Лимит устройств сохранён');render(1);userDrawer(+t.dataset.hw,'acc')}
  else if(t.dataset.hk){DB.set.hooks[t.dataset.hk]=t.checked?1:0;save();toast(t.checked?'Событие включено':'Событие отключено')}
  else if(t.dataset.psz){UQ.size=+t.value;UQ.page=1;drawUsers()}
  else if(t.id=='mo'){C.motion=t.checked?1:0;apply()}
  else if(t.id=='tplsel'){const p=DB.tpls.find(x=>x.id==t.value);if(!p)return;const f=$('form[data-k=user]');const set=(k,v)=>{const el=$(`[name=${k}]`,f);if(el)el.value=v};set('limit',p.limit);set('days',p.days);set('strategy',p.strategy);set('hwid',p.hwid);$('[name=hold]',f).checked=p.hold;$$('[name=squads]',f).forEach(c=>c.checked=p.squads.includes(+c.value))}});
document.addEventListener('input',e=>{if(e.target.id=='ts'){C.ts=+e.target.value;$('#tsv').textContent=Math.round(C.ts*100)+'%';apply()}else if(e.target.id=='radius'){C.radius=+e.target.value;$('#rv').textContent=C.radius+' px';apply()}if(e.target.id=='pq')pdraw(e.target.value)});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();palette();return}
  if(e.target.id=='pq'){if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();const n=Math.min(PI.length,12);PX=(PX+(e.key=='ArrowDown'?1:n-1))%Math.max(n,1);$$('.pi').forEach((x,i)=>x.classList.toggle('on',i==PX));$('.pi.on')?.scrollIntoView({block:'nearest'})}if(e.key=='Enter'){e.preventDefault();const x=PI[PX];if(x){dlg.close();x.r()}}return}
  if(e.key=='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();cur=='users'?$('#uq').focus():palette()}});
document.addEventListener('submit',async e=>{const f=e.target,k=f.dataset.k;if(!k)return;const er=m=>{e.preventDefault();$('#fe')&&($('#fe').textContent=m)};
  if(k=='user'){const d=read(FU,f);if(DB.users.some(u=>u.username.toLowerCase()==d.username.toLowerCase()))return er('Такое имя уже есть. Выберите другое.');if(!d.squads.length)return er('Выберите хотя бы один сквад.');
    const u={username:d.username,disabled:false,hold:d.hold,holdDays:d.days||30,created:Date.now(),expireAt:d.hold||!d.days?null:Date.now()+d.days*DAY,limit:d.limit,used:0,strategy:d.strategy,tag:d.tag,tg:'',email:'',desc:d.desc,hwid:d.hwid,squads:d.squads,onlineAt:0,adminId:DB.admins.find(a=>a.role==='owner')?.id||null,short:Math.floor(Math.random()*2**40).toString(36).padStart(8,'a'),devices:[]};
    const c=await api.create('users',u);UQ.q='';UQ.st='all';UQ.sort='created';UQ.dir='desc';toast(`Пользователь ${c.username} создан`);location.hash=='#users'?render(1):location.hash='users';setTimeout(()=>userDrawer(c.id,'sub'),350)}
  else if(k=='uedit'){e.preventDefault();const d=read(FE,f),id=+f.dataset.id;if(DB.users.some(u=>u.username.toLowerCase()==d.username.toLowerCase()&&u.id!=id))return er('Такое имя уже есть.');await api.update('users',id,d);toast('Сохранено');render(1);userDrawer(id,'ov')}
  else if(k=='ent'){const key=f.dataset.ent,e2=ENT[key],d=read(e2.fs,f),id=f.dataset.id,m=e2.chk?.(d,+id);if(m)return er(m);
    if(id){await api.update(key,id,d);toast('Сохранено')}else{const o=Object.assign({disabled:false,order:DB[key].length+1,created:Date.now(),last:0,used:0,state:'OFFLINE'},d);const c=await api.create(key,o);toast('Создано');if(e2.after?.(c)){render(1);return}}render(1)}
  else if(k=='bsq'){const d=read([{k:'squads',t:'multi'}],f),ids=new Set(UQ.sel);await api.bulk('users',ids,u=>u.squads=[...new Set([...u.squads,...d.squads])]);toast('Сквады добавлены');render(1)}
  else if(k=='brand'){const d=read([{k:'brand'},{k:'domain'}],f);DB.set.brand=d.brand;DB.set.domain=d.domain;save();brand();toast('Сохранено');e.preventDefault()}});
const acts2=ok=>`<div class="act"><button type="button" class="gh" data-x>Отмена</button><button class="btn">${ok}</button></div>`;
$('#theme').onclick=()=>{C.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';apply();if(cur=='set')render(1)};
$('#bell').onclick=()=>{const n=[...DB.nodes.filter(x=>nstat(x)=='OFFLINE').map(x=>[x.flag+' '+x.name,'узел не отвечает']),...DB.users.flatMap(u=>st(u)=='ACTIVE'&&u.limit&&u.used/u.limit>.9?[[u.username,`использовал ${Math.round(u.used/u.limit*100)}% трафика`]]:st(u)=='ACTIVE'&&u.expireAt&&u.expireAt-Date.now()<2*DAY?[[u.username,'подписка истекает: '+left(u.expireAt)]]:[]).slice(0,8)];$('#bell .pip')?.remove();
  modal(`<div class="box"><div class="bar2"><h2>Уведомления</h2><button class="ia" data-x style="margin-left:auto" aria-label="Закрыть">${ic('x')}</button></div><div>${n.map(([a,b])=>`<div class="nt"><b>${esc(a)}</b><span class="mu">${b}</span></div>`).join('')||'<p class="note">Новых уведомлений нет.</p>'}</div></div>`,'pop')};

document.addEventListener('click',e=>{
  const button=e.target.closest('[data-node-grid-mode]');
  if(!button)return;
  const mode=button.dataset.nodeGridMode;
  if(!['compact','standard','spacious'].includes(mode))return;
  const grid=document.querySelector('.nodes');
  if(!grid)return;
  grid.dataset.gridMode=mode;
  document.querySelectorAll('[data-node-grid-mode]').forEach(item=>{
    const active=item.dataset.nodeGridMode===mode;
    item.classList.toggle('on',active);
    item.setAttribute('aria-pressed',active?'true':'false');
  });
  try{localStorage.setItem(NODE_GRID_KEY,mode)}catch(e){}
});
