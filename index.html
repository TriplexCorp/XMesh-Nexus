<!doctype html>
<html lang="ru" data-theme="dark" data-accent="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XMesh Nexus — Infrastructure Control</title>
<meta name="description" content="XMesh Nexus is a refined control panel for Xray VPN infrastructure.">
<meta name="theme-color" content="#071b15">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261021-node-ip-rotation-1">
<link rel="stylesheet" href="global-hover.css">
<link rel="stylesheet" href="xray-studio.css?v=20261021-grid-align-1">
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo" id="lg">X</div><b class="bt" id="bn">XMesh Nexus</b></div>
  <nav id="nav" aria-label="Разделы"></nav>
  <div class="core"><div class="ct"><span class="dot" id="cd" style="--c:var(--mu);animation:none"></span><div><b>Xray-core</b><small id="cs">API не подключён</small></div></div><button id="restart" aria-label="Настройки Xray-core"></button><small id="core-rail-version" class="core-rail-version" aria-live="polite">—</small></div>
</aside>
<div class="wrap">
  <header class="top">
    <div class="top-identity"><span class="top-eyebrow" aria-hidden="true"><span class="top-eyebrow-mark"></span>XMESH / WORKSPACE</span><h1 id="title"></h1></div>
    <button class="search" id="pal" type="button" aria-label="Поиск и команды"><span id="si" class="search-glyph"></span><span class="search-label">Поиск и команды</span><kbd>Ctrl K</kbd></button>
    <div class="tl"><button class="ib" id="theme" aria-label="Сменить тему"></button><button class="ib" id="bell" aria-label="Уведомления"></button><button class="btn" id="logout" type="button">Выйти</button><button class="btn" type="button" data-nu id="addb" aria-label="Добавить пользователя"></button></div>
  </header>
  <main id="view" class="view"></main>
</div>
</div>

<dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>

<script src="xray-json-intelligence.js?v=20261021-smart-1"></script>
<script src="xray-json-diagnostics.js?v=20261021-smart-1"></script>
<script src="app.js?v=20261021-node-ip-rotation-1"></script>
<script src="xray-studio-v5.js?v=20261021-5"></script>
<script src="xray-studio-dialog.js?v=20261021-settings-2"></script>
</body>
</html>
