<html lang="ru" data-theme="dark" data-accent="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XMesh Nexus — Infrastructure Control</title>
<meta name="description" content="XMesh Nexus is a refined control panel for Xray VPN infrastructure.">
<meta name="theme-color" content="#071b15">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo" id="lg">X</div><b class="bt" id="bn">XMesh Nexus</b></div>
  <nav id="nav" aria-label="Разделы"></nav>
  <div class="core"><div class="ct"><span class="dot" id="cd" style="--c:var(--mu);animation:none"></span><div><b>Xray-core</b><small id="cs">API не подключён</small></div></div><button id="restart" aria-label="Настройки Xray-core"></button><small id="core-rail-version" class="core-rail-version" aria-live="polite">—</small></div>
  <div class="sidebar-account"><button class="sidebar-logout" id="logout" type="button" title="Выйти из панели">Выйти</button></div>
</aside>
<div class="wrap">
  <header class="top">
    <div class="top-identity"><span class="top-eyebrow" aria-hidden="true"><span class="top-eyebrow-mark"></span>XMESH / WORKSPACE</span><h1 id="title"></h1></div>
    <button class="search" id="pal" type="button" aria-label="Поиск и команды"><span id="si" class="search-glyph"></span><span class="search-label">Поиск и команды</span><kbd>Ctrl K</kbd></button>
    <div class="tl"><button class="ib" id="theme" aria-label="Сменить тему"></button><button class="ib" id="bell" type="button" aria-label="Уведомления" aria-haspopup="dialog" aria-expanded="false"></button><div class="top-language" id="top-language">
      <button class="ib top-language-trigger" id="language-trigger" type="button" aria-label="Язык интерфейса" aria-haspopup="true" aria-expanded="false" aria-controls="language-menu"></button>
      <div class="top-language-menu" id="language-menu" role="group" aria-label="Выбор языка" hidden>
        <button type="button" data-panel-language="ru" aria-pressed="false">Русский <span>RU</span></button>
        <button type="button" data-panel-language="en" aria-pressed="false">English <span>EN</span></button>
      </div></div><button class="btn" type="button" data-nu id="addb" aria-label="Добавить пользователя"></button></div>
  </header>
  <main id="view" class="view"></main>
</div>
</div>

<dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>

<script src="xray-json-intelligence.js?v=20261024-reality-autofill-v3"></script>

<script src="/xray-studio-composer.js?v=20261024-rollback-single-editor-v1"></script>
<script src="/xray-studio-tools.js?v=20261024-vision-gate-v3"></script>
<script src="/xray-studio-hosts.js?v=20261023-hosts-remarks-22"></script>

<script src="app.js?v=20261026-multiprotocol-hosts-v1"></script>
